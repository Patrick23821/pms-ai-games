<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.babylonjs.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: wss: data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
<title>Paintball Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--pink:#ff3d9a;--cyan:#26e8ff;--yellow:#ffe23d;--purple:#9b5cff;--green:#3dff8a;--orange:#ff8a1f;--bg:#0b0520;--glass:rgba(22,12,48,.66);--red:#ff3b5c;--blue:#2f8bff;--uis:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Rubik,system-ui,"Segoe UI",Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.hidden{display:none!important}
.fd{font-family:"Lilita One",Impact,system-ui,sans-serif;letter-spacing:.5px}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.screen.menu{align-items:center;justify-content:center;padding:64px 2vw 20px;background:radial-gradient(ellipse at center,rgba(11,5,32,.2) 0%,rgba(11,5,32,.72) 100%)}
.menuWrap{display:grid;grid-template-columns:minmax(220px,270px) minmax(380px,640px) minmax(280px,340px);gap:22px;align-items:center;justify-content:center;width:100%;max-width:1500px}
.menuCenter{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.menuCenter .logo{font-size:clamp(40px,6.2vw,92px);margin-bottom:6px}
.tagline{font-family:"Lilita One",Impact,sans-serif;letter-spacing:5px;font-size:15px;color:var(--yellow);text-shadow:0 2px 0 #1a0833,0 0 14px rgba(255,226,61,.5);margin-bottom:6px}
.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(200px,260px));gap:14px 16px;margin-top:6px}
.menuGrid .mbtn{width:100%;margin:0;text-align:center;font-size:22px;padding:14px 16px;border-radius:22px}
.menuGrid .mbtn:nth-child(odd){transform:rotate(-1.6deg)}
.menuGrid .mbtn:nth-child(even){transform:rotate(1.6deg)}
.menuGrid .mbtn:hover{transform:rotate(0deg) scale(1.08) translateY(-4px);filter:brightness(1.08)}
.menuGrid .mbtn:active{transform:rotate(0deg) scale(.96) translateY(3px)}
.menuGrid .mbtn.big{grid-column:1/3;font-size:30px;padding:16px}
.side{padding:16px;align-self:center}
.charCard{text-align:center}
.charCard .prev{height:360px}
.dailyRow{font-size:13px;margin:6px 0;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.06)}
.dailyRow .xpbar{width:100%;margin-top:4px}
@media (max-width:1150px){.menuWrap{grid-template-columns:1fr;max-width:660px}.side.left{display:none}.charCard .prev{height:240px}}
.dim{background:radial-gradient(ellipse at center,rgba(20,8,50,.72),rgba(8,3,22,.92))}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.gb::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(120deg,var(--pink),var(--yellow),var(--cyan),var(--purple),var(--pink));background-size:300% 300%;animation:gb 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.gold.gb::before{background:linear-gradient(120deg,#ffd700,#fff3a0,#ff9d00,#ffd700,#fff3a0);background-size:300% 300%}
@keyframes gb{to{background-position:300% 0}}
.panel{padding:22px;width:min(1100px,96vw)}
.btn{font-family:"Lilita One",Impact,system-ui,sans-serif;font-size:20px;letter-spacing:.8px;padding:12px 24px;border:3px solid #1a0833;border-radius:18px;color:#1a0833;background:linear-gradient(180deg,#fff 0%,#ffd6f0 100%);box-shadow:0 6px 0 #1a0833,0 12px 20px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.65),inset 0 -5px 0 rgba(0,0,0,.1);cursor:pointer;transition:transform .14s cubic-bezier(.3,1.8,.5,1),box-shadow .14s,filter .15s;pointer-events:auto;white-space:nowrap;position:relative;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.btn:hover{transform:scale(1.07,.95) translateY(-3px);filter:brightness(1.08)}
.btn:active{transform:scale(.95,1.05) translateY(3px);box-shadow:0 2px 0 #1a0833,0 4px 8px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.4)}
.btn.p{background:linear-gradient(180deg,#ff8ac6,#ff2e88)}
.btn.c{background:linear-gradient(180deg,#8ff6ff,#16b8ff)}
.btn.y{background:linear-gradient(180deg,#fff7a0,#ffc21a)}
.btn.g{background:linear-gradient(180deg,#a6ffc8,#22d672)}
.btn.v{background:linear-gradient(180deg,#d2b0ff,#8047ff)}
.btn.d{background:linear-gradient(180deg,#7d6aa8,#3a2c55)}
.btn.r{background:linear-gradient(180deg,#ff9a9a,#e0283f)}
.btn.o{background:linear-gradient(180deg,#ffd09a,#ff7a1a)}
.btn.p,.btn.v,.btn.d,.btn.r{color:#fff;text-shadow:2px 2px 0 #1a0833,-1px -1px 0 #1a0833,1px -1px 0 #1a0833,-1px 1px 0 #1a0833,0 2px 0 #1a0833}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:12px;border-width:2px;box-shadow:0 3px 0 #1a0833,0 6px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.xs{font-size:12px;padding:4px 9px;border-radius:9px;border-width:2px;letter-spacing:.3px;box-shadow:0 2px 0 #1a0833,inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sm:active,.btn.xs:active{box-shadow:0 1px 0 #1a0833}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.on{outline:3px solid var(--yellow)}
.mbtn{display:block;width:300px;margin:7px 0;text-align:left;font-size:24px;padding:12px 22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:rgba(255,255,255,.07);border-radius:16px;padding:12px;position:relative;border:2px solid rgba(255,255,255,.08);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.r-common{box-shadow:0 0 14px rgba(200,200,220,.25);border-color:#aab}
.r-rare{box-shadow:0 0 16px rgba(40,160,255,.5);border-color:#39f}
.r-epic{box-shadow:0 0 18px rgba(170,70,255,.6);border-color:#a4f}
.r-legendary{box-shadow:0 0 20px rgba(255,170,20,.7);border-color:#fa2}
.r-mythic{box-shadow:0 0 24px rgba(255,50,140,.8);border-color:#f3a;animation:myth 2s linear infinite}
@keyframes myth{50%{border-color:#3ff;box-shadow:0 0 24px rgba(50,255,255,.8)}}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.14);text-transform:uppercase;letter-spacing:.5px}
h1,h2,h3{font-family:"Lilita One",Impact,system-ui,sans-serif;letter-spacing:.5px}
h2{font-size:34px;margin-bottom:10px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{font-size:20px;margin:8px 0}
input[type=text],input[type=number],select,textarea{background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font:inherit;outline:none;user-select:text;-webkit-user-select:text}
input[type=text]:focus,textarea:focus{border-color:var(--cyan)}
input[type=range]{accent-color:var(--pink);width:180px}
input[type=checkbox]{accent-color:var(--pink);width:18px;height:18px}
select option{background:#1a0d38}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{font-size:15px;padding:7px 12px}
.muted{opacity:.65;font-size:13px}
.coin::before{content:'🪙 '}
.topbar{position:absolute;top:16px;right:18px;display:flex;gap:12px;align-items:center;pointer-events:auto;z-index:5}
.pill{background:rgba(0,0,0,.45);border-radius:999px;padding:7px 14px;font-weight:800;display:flex;gap:8px;align-items:center}
.xpbar{width:140px;height:9px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.logo{font-family:"Lilita One",Impact,sans-serif;font-size:clamp(44px,7vw,96px);line-height:.9;position:relative;margin-bottom:18px;background:linear-gradient(95deg,#ff3d9a,#ffe23d 35%,#26e8ff 65%,#9b5cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:wob 3s ease-in-out infinite}
.logo .blob{position:absolute;border-radius:50%;filter:blur(.5px);animation:splat 2.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.03)}}
@keyframes splat{0%{transform:scale(0);opacity:0}20%{transform:scale(1.2);opacity:1}60%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
#drip{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex}
#drip span{flex:1;height:130%;transform:translateY(-135%);border-radius:0 0 60px 60px}
#drip.go span{animation:dripA .8s cubic-bezier(.6,0,.4,1) forwards}
@keyframes dripA{0%{transform:translateY(-135%)}45%{transform:translateY(-12%)}55%{transform:translateY(-12%)}100%{transform:translateY(110%)}}
/* HUD */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;transform-origin:center;font-family:Rubik,system-ui,sans-serif}
#hudLeave{position:absolute;top:12px;left:12px;pointer-events:auto;width:40px;height:40px;border-radius:12px;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
#hudTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.tsc{min-width:70px;text-align:center;font-family:"Lilita One";font-size:30px;padding:4px 14px;border-radius:14px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#timer{font-family:"Lilita One";font-size:30px;background:rgba(0,0,0,.5);padding:4px 16px;border-radius:14px;min-width:110px;text-align:center}
#timer.warn{color:#ff4d6a;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#modeName{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;opacity:.8;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#covBar{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:320px;height:14px;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.5);display:flex}
#covBar i{display:block;height:100%}
#killfeed{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.kf{background:rgba(0,0,0,.55);padding:5px 10px;border-radius:10px;font-weight:800;font-size:14px;animation:kfin .25s ease-out}
.kf.me{outline:2px solid var(--yellow)}
@keyframes kfin{from{transform:translateX(40px);opacity:0}}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#hitm{position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);opacity:0}
#hitm.show{animation:hm .25s ease-out}
#hitm.kill{filter:drop-shadow(0 0 6px #ff3d9a)}
@keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#dmgDirs{position:absolute;inset:0}
.dd{position:absolute;left:50%;top:50%;width:120px;height:26px;margin:-13px 0 0 -60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,40,80,.85),transparent 70%);animation:ddf 1s forwards}
@keyframes ddf{to{opacity:0}}
#hpCan{position:absolute;left:24px;bottom:24px;width:84px;height:104px}
#hpCan .can{position:absolute;inset:0;border-radius:10px 10px 16px 16px;background:rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.85);overflow:hidden}
#hpCan .fill{position:absolute;left:0;right:0;bottom:0;transition:height .2s}
#hpCan .lid{position:absolute;top:-10px;left:8px;right:8px;height:10px;border:3px solid rgba(255,255,255,.85);border-bottom:none;border-radius:20px 20px 0 0}
#hpCan .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Lilita One";font-size:28px;text-shadow:0 2px 0 #000}
#hpCan .sh{position:absolute;left:-6px;right:-6px;bottom:-12px;height:8px;border-radius:5px;background:#5cf;box-shadow:0 0 10px #5cf}
#hopper{position:absolute;right:24px;bottom:24px;text-align:right}
#hopper .ball{width:110px;height:70px;border-radius:55px 55px 18px 18px;background:rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-family:"Lilita One";font-size:30px;margin-left:auto;position:relative;overflow:hidden}
#hopper .ball i{position:absolute;left:0;right:0;bottom:0;opacity:.45}
#hopper .ball span{position:relative}
#wname{font-family:"Lilita One";font-size:18px;margin-top:4px}
#equip{font-size:13px;font-weight:800;opacity:.9}
#minimap{position:absolute;left:120px;bottom:20px;width:180px;height:180px;border-radius:50%;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.6)}
#chat{position:absolute;left:14px;bottom:215px;width:380px;pointer-events:none;transition:opacity .5s}
#chat.fade{opacity:.25}
#chatLog{max-height:190px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:14px}
#chatLog div{background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px;text-shadow:0 1px 0 #000;word-break:break-word}
#chatLog .sys{color:#ffe23d;font-style:italic}
#chatIn{width:100%;margin-top:4px;pointer-events:auto}
#banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#banner .b{font-family:"Lilita One";font-size:54px;text-shadow:0 5px 0 rgba(0,0,0,.45);animation:bn 2.2s ease-out forwards;background:linear-gradient(90deg,#ffe23d,#ff3d9a,#26e8ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#banner .s{font-size:18px;font-weight:800;opacity:.9}
@keyframes bn{0%{transform:scale(2.2) rotate(-6deg);opacity:0}15%{transform:scale(1) rotate(0);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#wmeter{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:4px}
#wmeter div{width:62px;height:32px;border-radius:9px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
#wmeter div.cur{border-color:#fff;transform:scale(1.15);box-shadow:0 0 12px currentColor}
#scope{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0,transparent 28vh,rgba(0,0,0,.96) 28.5vh)}
#scope::before,#scope::after{content:'';position:absolute;background:rgba(0,0,0,.8)}
#scope::before{left:50%;top:22vh;bottom:22vh;width:2px}
#scope::after{top:50%;left:calc(50% - 28vh);right:calc(50% - 28vh);height:2px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,60,.55));opacity:0;transition:opacity .3s}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:12px;font-weight:800}
#streak{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px}
#streak span{background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;font-size:12px;font-weight:800}
#fps{position:absolute;top:60px;left:12px;font:12px monospace;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:6px;white-space:pre}
#specLbl,#killcam{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);text-align:center;background:rgba(0,0,0,.55);padding:10px 20px;border-radius:14px}
#killcam .n{font-family:"Lilita One";font-size:28px}
#respawnT{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:"Lilita One";font-size:36px;text-shadow:0 3px 0 #000}
#netBadge{position:absolute;top:14px;left:60px;font-size:11px;font-weight:800;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px}
#rangePanel{position:absolute;top:100px;left:12px;background:rgba(0,0,0,.5);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.dmgNum{position:absolute;font-family:"Lilita One";font-size:22px;color:#ffe23d;text-shadow:0 2px 0 #000;pointer-events:none;animation:dn .9s ease-out forwards}
@keyframes dn{to{transform:translateY(-50px);opacity:0}}
.nameTag{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:13px;text-shadow:0 1px 2px #000;white-space:nowrap;text-align:center;pointer-events:none}
.nameTag small{display:block;font-size:10px;opacity:.8;font-weight:600}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.ov.clear{pointer-events:none}
#scoreboard table{border-collapse:collapse;width:100%}
#scoreboard td,#scoreboard th{padding:6px 10px;text-align:left;font-size:14px}
#scoreboard tr{border-bottom:1px solid rgba(255,255,255,.08)}
#scoreboard tr.me{background:rgba(255,226,61,.15)}
#wheel{position:fixed;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);z-index:31;pointer-events:none}
#wheel .opt{position:absolute;width:120px;margin-left:-60px;margin-top:-18px;text-align:center;background:rgba(0,0,0,.6);padding:8px;border-radius:12px;font-weight:800;font-size:14px;border:2px solid transparent}
#wheel .opt.sel{border-color:var(--yellow);background:rgba(255,61,154,.6);transform:scale(1.1)}
#modalRoot{position:fixed;inset:0;z-index:80;pointer-events:none}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,15,.6);pointer-events:auto;animation:fadeIn .2s}
.modal .glass{padding:24px;min-width:320px;max-width:min(560px,94vw);max-height:90vh;overflow:auto;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7)}}
@keyframes fadeIn{from{opacity:0}}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,10,45,.92);border:2px solid var(--cyan);padding:9px 16px;border-radius:14px;font-weight:600;animation:pop .25s;max-width:80vw}
.toast.warn{border-color:var(--yellow)}.toast.err{border-color:var(--red)}.toast.good{border-color:var(--green)}
#err{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a0f4a,#0b0520);text-align:center;padding:30px}
#offline{position:fixed;left:14px;top:14px;z-index:12;background:linear-gradient(90deg,#ff8a1f,#ff3d9a);padding:5px 12px;border-radius:10px;font-weight:800;font-size:12px}
.srv{display:grid;grid-template-columns:1fr auto;gap:6px;padding:14px}
.srv .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;grid-column:1/3}
.srv .bar i{display:block;height:100%}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px}
.b-empty{background:#445}.b-open{background:#1c9c55}.b-almost{background:#d98a00}.b-full{background:#c0233e}.b-vote{background:#7a3cff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:10px 0 16px}
.pod{text-align:center;font-weight:800}
.pod .blk{border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.06));display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:"Lilita One";font-size:30px}
.mini{width:50px;height:70px;margin:0 auto 6px;position:relative;animation:bob 1s ease-in-out infinite}

.intro{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}
.intro .team{font-family:"Lilita One";font-size:22px;line-height:1.5;text-shadow:0 3px 0 #000;animation:kfin .5s}

.scroll{max-height:60vh;overflow:auto}
.ach{padding:8px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px}

.screen{scrollbar-width:thin;scrollbar-color:#9354e9 #100a22}

.screen.menu{isolation:isolate;background:linear-gradient(180deg,rgba(6,7,23,.28),rgba(8,7,24,.77)),radial-gradient(ellipse at 55% 45%,transparent 25%,rgba(8,7,24,.6) 90%)}
.menuWrap{grid-template-columns:minmax(0,1fr) minmax(360px,560px) minmax(0,1fr);max-width:1420px;gap:28px;position:relative}
.menuCenter{animation:menuEnter .55s cubic-bezier(.2,.8,.2,1) both}
.menuCenter .logo{font-size:clamp(58px,6vw,94px);margin:0 0 8px}
.logo{display:flex;flex-direction:column;align-items:center;background:none;overflow:visible;line-height:.95}
.logoPaint{color:#f6f5ff;font-size:.59em;letter-spacing:.035em;-webkit-text-stroke:1px #25113e;text-shadow:0 4px 0 #25113e;z-index:1}
.logoPro{font-size:1.25em;letter-spacing:.05em;line-height:.97;transform:skew(-8deg);background:linear-gradient(165deg,#fffca7 6%,#ffe23d 38%,#ffa945 70%,#ff668f);background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #39204d);z-index:1}
.tagline{font-family:Rubik,system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:3.2px;color:#c9bee8;text-shadow:none;margin-bottom:8px}
.menuGrid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:12px}
.menuGrid .mbtn{font-size:19px;padding:13px 10px;border-radius:17px;letter-spacing:.8px;transform:none!important}
.menuGrid .mbtn:hover{transform:translateY(-3px) scale(1.035)!important;box-shadow:0 8px 0 #190e31,0 12px 24px rgba(0,0,0,.35)}
.menuGrid .mbtn:active{transform:translateY(3px) scale(.98)!important}
.menuGrid .mbtn.big{font-size:30px;border-radius:20px;overflow:hidden;min-height:70px}
.menuGrid .mbtn.big::after{content:'';position:absolute;inset:-50% auto -50% -35%;width:18%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skew(-25deg);animation:playSheen 5s ease-in-out infinite;pointer-events:none}
.menuGrid .mbtn:last-child{grid-column:1/3;font-size:15px;padding:9px;background:rgba(47,35,75,.85);border-color:#756491;box-shadow:0 3px 0 #190e31}
.side.left{justify-self:start;max-width:238px;padding:0;background:transparent;box-shadow:none;backdrop-filter:none;animation:menuEnter .65s .10s both}
.side.left::before,.charCard::before{display:none}
.side.left h3{font-size:15px;letter-spacing:1.2px;color:#e6dffd}
.dailyRow{background:transparent;padding:12px 0;border-bottom:1px solid rgba(205,188,242,.15);border-radius:0;font-size:12px;line-height:1.7}
.dailyRow .xpbar{height:4px;background:rgba(255,255,255,.1);margin-top:7px}
.charCard{background:transparent;box-shadow:none;backdrop-filter:none;justify-self:stretch;padding:0;position:relative;animation:menuEnter .7s .17s both}
.charCard .prev{height:380px;background:#000;border-radius:13px;overflow:hidden}
.charCard .xpbar{height:5px}
.glass{background:linear-gradient(145deg,rgba(38,24,67,.93),rgba(13,13,34,.91));box-shadow:0 22px 65px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);border-radius:20px}
.side.left,.charCard{background:transparent;box-shadow:none}
.gb::before{padding:1px;background:linear-gradient(125deg,#e5bcff80,#8e72c433,#5be6ef88,#c671ff55);animation-duration:12s}

.panel{padding:26px}
.card{background:rgba(39,33,69,.65);border-color:rgba(169,149,213,.2);border-radius:13px}
.btn{border-color:#1c1230;box-shadow:0 5px 0 #1c1230,0 10px 22px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn:focus-visible{outline:3px solid #e9dcff;outline-offset:4px}
.topbar{gap:8px;top:17px}
.pill{border:1px solid #b9a4df40;border-radius:13px;background:rgba(16,11,36,.75);padding:8px 12px}
.menuEyebrow{font-size:10px;letter-spacing:3px;font-weight:800;color:#70e5ee;margin-bottom:8px}
#pauseOv{backdrop-filter:blur(5px)}
#pauseOv .glass{border-radius:23px}
#scoreOv table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}

#timer{background:rgba(14,12,33,.87);border:1px solid rgba(177,164,217,.4);border-radius:10px;font-size:26px;padding:7px 17px}
#modeName{top:67px;color:#e8e2f8;font-size:10px;letter-spacing:1.6px;max-width:76vw;text-align:center;white-space:normal}
#covBar{top:91px}
#killfeed{top:74px}
.kf{background:rgba(17,13,35,.85);border:1px solid rgba(165,140,210,.23);border-radius:8px;font-size:12px;padding:7px 11px}

#hudLeave{border:1px solid #b5a0d752;background:rgba(17,13,35,.83)}
#scope{background:radial-gradient(circle at center,transparent 27vh,rgba(0,0,0,.97) 27.6vh)}
#scope::before{top:calc(50% - 23vh);bottom:calc(50% - 23vh);background:linear-gradient(180deg,#080810 42%,transparent 42% 58%,#080810 58%)}
#scope::after{left:calc(50% - 23vh);right:calc(50% - 23vh);background:linear-gradient(90deg,#080810 45%,transparent 45% 55%,#080810 55%)}
#scope .scopeRing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54vh;height:54vh;border:2px solid rgba(152,219,221,.46);border-radius:50%;box-shadow:0 0 0 6px rgba(0,0,0,.8),inset 0 0 30px rgba(0,0,0,.25)}

.prev{background:#000;border-radius:13px}
@keyframes menuEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes playSheen{0%,65%{left:-35%;opacity:0}70%{opacity:1}86%,100%{left:125%;opacity:0}}
@media(max-width:1120px){.menuWrap{grid-template-columns:minmax(360px,540px) minmax(240px,330px);gap:22px;max-width:940px}.side.left{display:none}.charCard .prev{height:330px}.screen.menu{padding-top:66px}.menuCenter .logo{font-size:74px}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
body.rm *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}

<script>
/* ===================== CORE: utils + canonical frozen data ===================== */

    const legL=buildLeg('L',-0.1), legR=buildLeg('R',0.1);

        case 'hat_tophat': h=hr(M.CreateCylinder('hat',{diameter:0.36,height:0.42,tessellation:16},sc)); h.position.y=0.40; const b2=hr(M.CreateCylinder('brim',{diameter:0.56,height:0.03,tessellation:16},sc)); b2.position.y=0.20; b2.material=hm; const rib=hr(M.CreateCylinder('rib',{diameter:0.37,height:0.08},sc)); rib.position.y=0.24; rib.material=teamAccentM; break;

    const bucket=M.CreateCylinder('bucket',{diameterTop:0.75,diameterBottom:0.58,height:0.65,tessellation:16},sc); bucket.parent=root; bucket.position.y=0.32; bucket.material=sm.bucket; bucket.isPickable=false; bucket.setEnabled(false);
    const splotM=new BABYLON.StandardMaterial('splot',sc); splotM.diffuseTexture=R.scene===sc?R.splatTex():null; if(splotM.diffuseTexture) splotM.diffuseTexture.hasAlpha=true; splotM.backFaceCulling=false; splotM.zOffset=-2;

      root, torso, headRoot, head, face, hair, crown, band, chest, fMat, faceTex:faceTex, faceSkin:headSkin, faceIdx:0, faceMode:null, blinkT:2+Math.random()*3,hairParts:hairBundle.parts,hairMat,
      shL, elL, foreArmL, handL,

  },

  setGun(av,wid,paintHex){
    if(av.gunId===wid) return; av.gunId=wid;
    if(av.gun){ av.gun.dispose(); av.gun=null; }
    if(wid){
      av.gun=S.buildGun(av.sc,wid,{paint:paintHex});
      av.gun.parent=av.torso;
      av.gun.position.set(0.06,0.22,0.27);
      av.gun.rotation.set(0,0,0);
    }
  },

  setColor(av,col){
    av.col=col;
    if(!av.mat.diffuseTexture) av.mat.diffuseColor=new BABYLON.Color3(col[0],col[1],col[2]);
    else { av.mat.diffuseTexture.dispose(); av.mat.diffuseTexture=shirtTex(av.sc,col,av.shirtPattern); }
    av.mat.emissiveColor=new BABYLON.Color3(col[0]*0.2,col[1]*0.2,col[2]*0.2);
    if(av.teamAccentM){ av.teamAccentM.diffuseColor=new BABYLON.Color3(col[0],col[1],col[2]); av.teamAccentM.emissiveColor=new BABYLON.Color3(col[0]*0.4,col[1]*0.4,col[2]*0.4); }
  },

  splot(av,col){
    if(av.splots.length>=8){ const o=av.splots.shift(); o.dispose(); }
    const d=BABYLON.MeshBuilder.CreatePlane('sp',{size:0.35},av.sc); const m=new BABYLON.StandardMaterial('spm',av.sc); m.diffuseTexture=av.splotM.diffuseTexture; m.diffuseColor=new BABYLON.Color3(col[0],col[1],col[2]); m.backFaceCulling=false; m.zOffset=-2; m.disableDepthWrite=true; m.emissiveColor=new BABYLON.Color3(col[0]*0.3,col[1]*0.3,col[2]*0.3); d.material=m; d.parent=av.chest; const a=Math.random()*6.28, yy=(Math.random()-0.5)*0.5; d.position.set(Math.sin(a)*0.32,yy,Math.cos(a)*0.20); d.rotation.y=a; d.isPickable=false; av.splots.push(d);
  },

  clearSplots(av){ av.splots.forEach(s=>s.dispose()); av.splots=[]; },
  paintFace(av,mode){ if(!av.faceTex) return; const m=mode||(av.faceIdx===2?'':null); if(av.faceMode===m) return; av.faceMode=m; S.FacePainter.draw(av.faceTex.getContext(),256,av.faceIdx,av.faceSkin,m); av.faceTex.update(); },
  setVis(av,v){ if(av.vis===v) return; av.vis=v; av.root.getChildMeshes().forEach(m=>{ if(m.name!=='shield') m.visibility=v; }); },

  resetPose(av){
    av.poseNodes.forEach(n=>{ n.rotationQuaternion=null; n.rotation.set(0,0,0); });
    av.torso.position.set(0,0.98,0);
    av.headRoot.position.set(0,0.68,0);
    av.legL.hip.position.y=0.88; av.legR.hip.position.y=0.88;
    av.elL.position.set(0,-0.29,0); av.elR.position.set(0,-0.29,0);
    av.bucket.setEnabled(false);
    if(av.gun){ av.gun.rotationQuaternion=null; av.gun.rotation.set(0,0,0); av.gun.setEnabled(true); }
  },

  holdWeapon(av,st){
    const gun=av.gun; if(!gun) return;
    const ready=!!st.preview||!!st.sprint;
    const worldPitch=ready?(st.sprint?0.5:0.18):U.clamp(st.pitch||0,-1.2,1.2);
    const pitch=worldPitch-av.torso.rotation.x, yaw=ready?-0.25:-av.torso.rotation.y;
    gun.scaling.setAll(1.05);
    gun.rotation.set(pitch,yaw,0);
    Q.RotationYawPitchRollToRef(yaw,pitch,0,av.gripRotation);
    MX.ComposeToRef(gun.scaling,av.gripRotation,V3.Zero(),av.gripMatrix);
    V3.TransformCoordinatesToRef(gun.rig.grip,av.gripMatrix,av.gripPosition);
    const handY=(ready?0.15:0.17)+Math.sin(worldPitch)*0.10;
    gun.position.set(0.065-av.gripPosition.x,handY-av.gripPosition.y,0.17-av.gripPosition.z);
    MX.ComposeToRef(gun.scaling,av.gripRotation,gun.position,av.gripMatrix);
    V3.TransformCoordinatesToRef(gun.rig.grip,av.gripMatrix,av.gripTarget);
    V3.TransformCoordinatesToRef(gun.rig.support,av.gripMatrix,av.supportTarget);
    solveArm(av.shR,av.elR,av.gripTarget,1);
    if(av.gunId!=='paddle') solveArm(av.shL,av.elL,av.supportTarget,-1);
  },

  /* Dynamic natural articulated locomotion and poses */
  update(av,dt,st){
    this.resetPose(av);
    av.t+=dt; const sp=st.speed||0; const moving=sp>0.8; const sprint=st.sprint;
    const cycleSpeed=sprint?14:10; const cycle=av.t*cycleSpeed;
    const k=U.clamp(sp/6.5,0,1.2);

    /* Position & Rotation */
    av.root.position.set(st.x,st.y,st.z);
    av.root.rotation.set(0,st.yaw||0,0);
    const sc=st.scale||1; av.root.scaling.setAll(sc);

    /* Idle Breathing & Torso Sway */
    const breath=Math.sin(av.t*2.8)*0.015;
    const strideBob=moving?Math.abs(Math.sin(cycle))*0.06*k:0;
    const leanForward=sprint?0.14:(moving?0.04:0);
    const crouchOffset=st.crouch?-0.32:0;

    av.torso.position.y=0.98+breath-strideBob+crouchOffset;
    av.torso.rotation.x=leanForward;
    av.torso.rotation.y=moving?Math.sin(cycle)*0.08*k:0;

    /* Head pitch tracking gaze */
    av.headRoot.rotation.x=U.clamp(st.pitch||0,-0.6,0.6);
    av.headRoot.rotation.y=0;
    if(st.dead) this.paintFace(av,'dead');
    else if(st.preview){ if(av.faceMode) this.paintFace(av,null); }
    else { av.blinkT=(av.blinkT||0)-dt; if(av.blinkT<=0){ av.blinkT=2.5+Math.random()*4; this.paintFace(av,'blink'); av.blinkT=-0.12; } else if(av.blinkT>-0.05&&av.blinkT<0) this.paintFace(av,null); }

    /* Grounded articulated Leg locomotion with knee articulation */
    if(!st.dead && !st.crouch && !st.slide){
      if(moving){
        /* Left Leg */
        const swingL=Math.sin(cycle);
        av.legL.hip.rotation.x=swingL*0.65*k;
        av.legL.knee.rotation.x=Math.max(0,-swingL*0.9*k); /* Knee bends naturally on back-kick! */
        av.legL.foot.rotation.x=-swingL*0.25*k;

        /* Right Leg */
        const swingR=-Math.sin(cycle);
        av.legR.hip.rotation.x=swingR*0.65*k;
        av.legR.knee.rotation.x=Math.max(0,-swingR*0.9*k);
        av.legR.foot.rotation.x=-swingR*0.25*k;
      } else {
        /* Athletic grounded idle stance */
        av.legL.hip.rotation.x=0.04; av.legL.knee.rotation.x=0.06; av.legL.foot.rotation.x=-0.04;
        av.legR.hip.rotation.x=-0.04; av.legR.knee.rotation.x=0.06; av.legR.foot.rotation.x=0.04;
      }
    } else if(st.slide){
      av.torso.rotation.x=-0.25;
      av.legL.hip.rotation.x=-1.2; av.legL.knee.rotation.x=0.2; av.legL.foot.rotation.x=0.4;
      av.legR.hip.rotation.x=0.4; av.legR.knee.rotation.x=1.5; av.legR.foot.rotation.x=-0.3;
    } else if(st.crouch){
      /* Deep athletic crouch with grounded feet */
      av.legL.hip.rotation.x=-0.75; av.legL.knee.rotation.x=1.35; av.legL.foot.rotation.x=-0.50;
      av.legR.hip.rotation.x=-0.75; av.legR.knee.rotation.x=1.35; av.legR.foot.rotation.x=-0.50;
    }

    if(av.gun && !st.emote){
      this.holdWeapon(av,st);
    } else {
      const sw=moving?Math.sin(cycle)*0.7*k:0;
      av.shL.rotation.set(sw,0,0.06); av.shR.rotation.set(-sw,0,-0.06); av.elL.rotation.x=-0.2; av.elR.rotation.x=-0.2;
      if(av.gun) av.gun.setEnabled(false);
    }

    av.bucket.setEnabled(false);

    /* Emotes */
    if(st.emote){ const e=st.emote, et=e.t; switch(e.k){
      case 'wave':
        av.shL.rotation.x=-2.6; av.shL.rotation.y=0; av.shL.rotation.z=0.3;
        av.elL.rotation.x=-0.4; av.elL.rotation.z=Math.sin(et*14)*0.6;
        av.headRoot.rotation.z=0.15;
        break;
      case 'dance':
        av.root.rotation.y=st.yaw+Math.sin(et*8)*0.4;
        av.torso.position.y=0.98+Math.abs(Math.sin(et*10))*0.14;
        av.shL.rotation.x=-2.2+Math.sin(et*10)*0.6; av.shR.rotation.x=-2.2+Math.cos(et*10)*0.6;
        av.legL.hip.rotation.x=Math.sin(et*10)*0.6; av.legR.hip.rotation.x=-Math.sin(et*10)*0.6;
        break;
      case 'taunt':
        av.shL.rotation.x=-1.6; av.shL.rotation.z=Math.sin(et*16)*0.6;
        av.torso.rotation.x=-0.15;
        break;
      case 'sit':
        av.bucket.setEnabled(true);
        av.torso.position.y=0.72;
        av.legL.hip.rotation.x=-1.4; av.legL.knee.rotation.x=1.4;
        av.legR.hip.rotation.x=-1.4; av.legR.knee.rotation.x=1.4;
        av.shL.rotation.x=-0.4; av.shR.rotation.x=-0.4;
        break;
      case 'flip':
        const f=Math.min(1,et/0.85);
        av.root.position.y=st.y+Math.sin(f*Math.PI)*1.6;
        av.root.rotation.x=-f*Math.PI*2;
        av.legL.knee.rotation.x=1.2; av.legR.knee.rotation.x=1.2;
        break;
    } }

    /* Ragdoll / Elimination collapse */
    if(st.dead){

G.flag=function(p,why){ p.viol=(p.viol||0)+1; S.log('violation',p.name,why,p.viol); if(p.viol>40&&p.peer) S.Net.kick(p.peer,'Auto-kick: repeated violations ('+why+')'); };

G.allowed=function(p,wid){ if(G.kind==='hub'||G.kind==='menu') return false; if(wid==='grenade') return true; if(G.cfg.mode==='gungame') return wid===S.GUNGAME[Math.min(p.gunIdx,S.GUNGAME.length-1)]; if(p.jugg) return wid==='mini'; if(p.zombie) return wid==='sprayer'; return p.loadout.indexOf(wid)>=0; };
G.hostInput=function(p,m){ const now=G.now; const dt=U.clamp(now-(p.lastIn||now-0.033),0.02,0.5); p.lastIn=now; const f=m.f|0;

G.hostFire=function(p,m){ if(G.kind==='hub'||G.kind==='menu'){ G.flag(p,'fire-in-hub'); return; } if(!p.alive||G.phase!=='play') return; const wid=m.w, isG=wid==='grenade';

/* ---- pickups ---- */
G.pickTick=function(dt){ for(const k of G.pk){ if(!k.on){ k.t-=dt; if(k.t<=0){ k.on=true; G.pkDirty=true; } continue; } if(k.k==='health'&&G.muts.oneshot) continue;

    if(L.length>6){ g.fillStyle='rgba(255,255,255,.5)'; g.font='600 22px Rubik,Arial,sans-serif'; g.fillText('+'+(L.length-6)+' more — press F to see all',36,130+6*64); } }
  t.update(); };

/* ---- local player update ---- */
G.localInput=function(){ const inp={mx:0,mz:0,jumpPressed:false,jumpHeld:false,sprint:false,crouch:false}; if(I.typing||!I.locked||S.UI.wheelOpen) return inp;
  inp.mz=(I.down('fwd')?1:0)-(I.down('back')?1:0); inp.mx=(I.down('right')?1:0)-(I.down('left')?1:0); inp.jumpPressed=I.pressed('jump'); inp.jumpHeld=I.down('jump'); inp.sprint=I.down('sprint')||!!I.keys.ShiftRight; inp.crouch=I.down('crouch')||I.down('crouch2')||!!I.keys.ControlRight; return inp; };
G.switchW=function(p,i){ if(i===p.wi) return; p.wi=i; p.reloadT=0; p.burstLeft=0; p.charge=0; p.charging=false; p.spin=0; p.aimMortar=false; p.swapT=0.25; S.Audio.click(); };
G.localUpdate=function(dt){ const p=G.me; if(!p) return; const st=S.Save.d.settings; const locked=I.locked&&!S.UI.wheelOpen;
  if(p.alive&&(G.phase==='play'||G.phase==='intro')){
    if(locked&&G.phase==='play'&&!G.adminCam){ let s=0.0022*st.sens; if(p.ads) s*=st.adsSens*(G.wdef(p)&&G.wdef(p).scope?0.6:1); const ddx=U.clamp(I.dx,-500,500), ddy=U.clamp(I.dy,-500,500); p.yaw+=ddx*s; p.yaw=Math.atan2(Math.sin(p.yaw),Math.cos(p.yaw)); p.pitch=U.clamp(p.pitch+ddy*s*(st.invertY?-1:1),-1.5,1.5); }
    const inp=G.phase==='play'?G.localInput():{mx:0,mz:0};
    if(st.adsToggle){ if(locked&&(I.mPressed(2)||I.pressed('ads2'))) p.adsTog=!p.adsTog; p.ads=!!p.adsTog; } else p.ads=locked&&(I.mDown(2)||I.down('ads2'));
    if(!G.wdef(p)) p.ads=false;
    if(p.emote&&(inp.mx||inp.mz||inp.jumpPressed)) p.emote=null; if(p.emote){ p.emote.t+=dt; if(p.emote.t>3.2) p.emote=null; }
    if(G.phase==='play'&&!p.noclip&&!G.adminCam) G.stepMove(p,inp,dt);
    if(!G.auth){ for(const k in p.buffs) if(p.buffs[k]>0) p.buffs[k]-=dt; if(p.prot>0) p.prot-=dt; }
    if(locked&&G.phase==='play'){ if(I.pressed('w1')) G.switchW(p,0); if(I.pressed('w2')) G.switchW(p,1); if(I.pressed('w3')) G.switchW(p,2);
      if(I.wheel){ if(G.fourD()) G.shiftSlice(p,I.wheel<0?1:-1); else G.switchW(p,(p.wi+(I.wheel>0?1:2))%3); }
      if(G.fourD()){ if(I.pressed('sliceDown')) G.shiftSlice(p,-1); if(I.pressed('sliceUp')) G.shiftSlice(p,1); }
      if(I.pressed('reload')) G.startReload(p); if(I.pressed('grenade')) G.throwGrenade(p); if(I.pressed('melee')){ if(!G.interact(p)) G.doMelee(p); } if(I.pressed('spray')) G.spray(p);
      if(G.kind==='range'){ if(I.keys.BracketRight&&!I.prev.BracketRight) G.rangeCycle(1); if(I.keys.BracketLeft&&!I.prev.BracketLeft) G.rangeCycle(-1); } }
    if(G.canFight(p)) G.updWeapon(p,dt,locked&&I.mDown(0),locked&&I.mPressed(0),!I.mb[0]&&I.mbp[0]||(!locked&&!!p.charging)); else if(p.charging){ p.charging=false; p.charge=0; }
    p.bloom=Math.max(0,(p.bloom||0)-dt*0.12);
  } else if(!p.alive){ p.deadT=(p.deadT||0)+dt; if(G.killcam){ G.killcam.t+=dt; if(G.killcam.t>3) G.killcam=null; }
    if(!G.killcam&&(G.cfg.mode==='lts'||G.phase!=='play')&&locked){ if(I.mPressed(0)) G.specNext(); if(I.pressed('jump')) G.freeCam=G.freeCam?null:{x:p.x,y:p.y+4,z:p.z,yaw:p.yaw,pitch:0.3}; } } };
G.specNext=function(){ const list=[]; G.players.forEach(o=>{ if(o.alive&&!o.local) list.push(o); }); list.sort((a,b)=>(a.team===G.me.team?0:1)-(b.team===G.me.team?0:1)); if(!list.length){ G.spec=null; return; } const i=G.spec?(list.findIndex(o=>o.id===G.spec.id)+1)%list.length:0; G.spec={id:list[i].id}; G.freeCam=null; };
G.clientTick=function(dt){ G.interpTick(dt); if(G.phase==='play'){ if(G.cfg.time>0) G.timeLeft-=dt; else G.elapsed+=dt; }
  G.inAcc=(G.inAcc||0)+dt; if(G.inAcc>=1/30){ G.inAcc=0; const p=G.me; if(p) S.Net.send({t:'in',p:[U.r2(p.x),U.r2(p.y),U.r2(p.z)],v:[U.r2(p.vx),U.r2(p.vy),U.r2(p.vz)],r:[U.r3(p.yaw),U.r3(p.pitch)],w:p.slice,f:(p.crouch?1:0)|(p.ads?2:0)|(p.sprinting?4:0)|(p.slideT>0?8:0)|(p.zip?32:0)|(p.onGround?64:0),wi:p.wi}); }
  G.players.forEach(p=>{ if(!p.local&&p.emote) p.emote.t+=dt; }); };

/* ---- special cameras ---- */
G.prepareIntro=function(remaining){
  G.phaseT=typeof remaining==='number'&&isFinite(remaining)?U.clamp(remaining,0,S.INTRO.duration):S.INTRO.duration;
  G.introAge=S.INTRO.duration-G.phaseT; G.camMode='3p'; G.adsK=0;
  G.updateIntroCamera(0);
};
G.updateIntroCamera=function(dt){
  G.introAge=Math.max(0,G.introAge||0)+dt;
  const pose=S.introOrbit(G.M.bounds,G.introAge,S.Save.d.settings.reducedMotion), cam=S.R.cam;
  cam.rotationQuaternion=null; cam.upVector.set(0,1,0);
  cam.position.set(pose.x,pose.y,pose.z); cam.setTarget(new BABYLON.Vector3(pose.target[0],pose.target[1],pose.target[2])); cam.rotation.z=0;
  const aspect=S.R.engine.getRenderWidth()/Math.max(1,S.R.engine.getRenderHeight());
  cam.fov=2*Math.atan(Math.tan(pose.fov*0.5)/aspect);
};
G.specialCam=function(dt){ const cam=S.R.cam, me=G.me; const V=BABYLON.Vector3;
  if(G.adminCam&&G.freeCam&&S.Admin&&S.Admin.local()){ const f=G.freeCam; if(I.locked){ f.yaw+=I.dx*0.002; f.pitch=U.clamp(f.pitch+I.dy*0.002,-1.5,1.5); } const sp=(I.down('sprint')?30:14)*dt; const fw=G.fwd(f.yaw,f.pitch); const mz=(I.down('fwd')?1:0)-(I.down('back')?1:0), mx=(I.down('right')?1:0)-(I.down('left')?1:0); f.x+=fw[0]*mz*sp+Math.cos(f.yaw)*mx*sp; f.y+=fw[1]*mz*sp+(I.down('jump')?sp:0); f.z+=fw[2]*mz*sp-Math.sin(f.yaw)*mx*sp; cam.position.set(f.x,f.y,f.z); cam.rotation.set(f.pitch,f.yaw,0); return true; }
  if(G.phase==='intro'&&G.kind!=='menu'){ G.updateIntroCamera(dt); return true; }
  if(G.phase==='end'||G.phase==='vote'){ const t=G.now*0.15; cam.position.set(Math.cos(t)*32,16,Math.sin(t)*26); cam.setTarget(new V(0,0,0)); return true; }
  if(me&&!me.alive){ if(G.killcam){ const k=G.players.get(G.killcam.id); if(k){ const t=G.killcam.t*1.2; cam.position.set(k.x+Math.cos(t)*4.5,k.y+2.6,k.z+Math.sin(t)*4.5); cam.setTarget(new V(k.x,k.y+1.2,k.z)); return true; } }
    if(G.freeCam){ const f=G.freeCam; if(I.locked){ f.yaw+=I.dx*0.002; f.pitch=U.clamp(f.pitch+I.dy*0.002,-1.5,1.5); } const sp=14*dt; const fw=G.fwd(f.yaw,f.pitch); const mz=(I.down('fwd')?1:0)-(I.down('back')?1:0), mx=(I.down('right')?1:0)-(I.down('left')?1:0); f.x+=fw[0]*mz*sp+Math.cos(f.yaw)*mx*sp; f.y+=fw[1]*mz*sp; f.z+=fw[2]*mz*sp-Math.sin(f.yaw)*mx*sp; cam.position.set(f.x,f.y,f.z); cam.rotation.set(f.pitch,f.yaw,0); return true; }
    if(G.spec){ const s=G.players.get(G.spec.id); if(s&&s.alive){ const fw=G.fwd(s.yaw,0); cam.position.set(s.x-fw[0]*3.5,s.y+2.4,s.z-fw[2]*3.5); cam.setTarget(new V(s.x,s.y+1.4,s.z)); return true; } G.spec=null; }
    const t=G.now*0.3; cam.position.set(me.x+Math.cos(t)*6,me.y+4,me.z+Math.sin(t)*6); cam.setTarget(new V(me.x,me.y+0.5,me.z)); return true; }
  if(me&&me.emote){ const fw=G.fwd(me.yaw,0); cam.position.set(me.x+fw[0]*3.6,me.y+1.8,me.z+fw[2]*3.6); cam.setTarget(new V(me.x,me.y+1.1,me.z)); return true; }
  return false; };
G.menuCam=function(dt){ const t=G.now*0.08; const cam=S.R.cam; cam.position.set(Math.cos(t)*34,15,Math.sin(t)*24); cam.setTarget(new BABYLON.Vector3(0,1.5,0)); cam.fov=0.9; };

/* ---- avatars ---- */
G.updAvatars=function(dt){ const me=G.me, cam=S.R.cam; const vs=G.viewSlice(); const fd=G.fourD();
  G.players.forEach(p=>{ const av=p.av; if(!av) return;
    if(p.local&&G.kind!=='menu'){ const show=G.camMode!=='fp'||(!p.alive)||(p.emote&&p.alive)||G.phase==='intro'||G.phase==='end'||G.phase==='vote'; av.root.setEnabled(!!show&&(p.alive||p.deadT<2)); if(!show) return; }
    let vis=1, en=true; if(fd&&me&&!p.local&&G.kind!=='menu'){ const d=Math.abs(p.slice-vs); if(d===1){ vis=0.15+0.12*Math.sin(G.now*9+p.id); } else if(d>1) en=false; }
    if(!p.alive&&p.deadT>2.2) en=false; av.root.setEnabled(en); if(!en) return; S.Avatar.setVis(av,vis<1?Math.round(vis*20)/20:1);
    const wid=G.kind==='menu'?'pistol':(G.M.id==='plaza'?null:(G.auth?G.wid(p):(p.local?G.wid(p):(p.netWid||av.gunId)))); if(av.gunId!==wid) S.Avatar.setGun(av,wid,'#'+p.color.map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join(''));
    const dist=cam?Math.hypot(cam.position.x-p.x,cam.position.z-p.z):0; const tagHide=vis<1||dist>(G.isTeam()&&me&&p.team===me.team?80:30)||p.local;
    S.Avatar.update(av,dt,{x:p.x,y:p.y,z:p.z,yaw:p.yaw,pitch:p.pitch,speed:Math.hypot(p.vx,p.vz),crouch:p.crouch,slide:p.slideT>0,sprint:p.sprinting,grounded:p.onGround,preview:G.kind==='menu',emote:p.emote?{k:p.emote.k,t:p.emote.t}:null,dead:!p.alive,deadT:p.deadT||0,prot:p.alive&&p.prot>0,scale:p.scale||(G.muts.tiny?0.6:1),hideTag:tagHide});
    if(p.jugg) av.root.scaling.setAll((p.scale||1)*1.25); }); };

/* ---- main frame ---- */
G.frame=function(dtRaw){ if(!G.active) return; const dt=dtRaw*G.timeScale;
  try{
    const paused=G.isPaused(); G.syncPause(paused);
    if(paused){ S.UI.hudTick(0); return; }
    G.now+=dt;
    if(G.kind==='menu'){ G.hostTick(dt); G.menuTick(dt); G.menuCam(dt); S.Proj.update(dt,G); G.updAvatars(dt); S.Paint.flush(); return; }
    G.localUpdate(dt);
    if(G.auth) G.hostTick(dt); else G.clientTick(dt);
    S.Proj.update(dt,G); G.updProps(dt);
    if(G.kind==='range') G.rangeTick(dt);
    if(G.specialCam(dt)){ G.camMode='3p'; const c=S.R.cam; S.Audio.lis.x=c.position.x; S.Audio.lis.y=c.position.y; S.Audio.lis.z=c.position.z; S.Audio.lis.yaw=c.rotation.y; } else { G.camMode='fp'; G.updCamera(dt); }
    G.updAvatars(dt); G.updVM(dt); S.Paint.flush(); S.UI.hudTick(dt);
    if(G.radarT>0) G.radarT-=dt;
    const inten=G.cfg.time>0&&G.timeLeft<60?1:Math.max(0.2,S.Audio.intensity-dt*0.01); S.Audio.intensity=inten;
  } finally { I.end(); /* always consume input deltas, even if a frame throws — otherwise mouse deltas accumulate and spin the view */ } };

/* ---- Training Range ---- */
G.rangeInit=function(){ const sc=S.R.scene; G.dummies=[]; G.rangeScore=0; G.rush=null; G.dps=[]; G.rangeStart={x:0,z:-31};
  const tm=R.mat('tgtM',{c:'#ffffff',e:'#ff3d9a',glow:true}); const tm2=R.mat('tgtM2',{c:'#ffffff',e:'#3dff8a',glow:true});
  const mkT=(x,y,z,r,kind,mask,mat)=>{ const m=BABYLON.MeshBuilder.CreateCylinder('tgt',{diameter:r*2,height:0.12,tessellation:24},sc); m.rotation.x=Math.PI/2; m.position.set(x,y,z); m.material=mat||tm; m.isPickable=false; R.glowAdd(m); const post=BABYLON.MeshBuilder.CreateBox('post',{width:0.1,height:y,depth:0.1},sc); post.position.set(x,y/2,z); post.material=R.mat('range_wall',{c:'#404a60'}); const d={id:'d'+G.dummies.length,x:x,y:y,z:z,r:r,up:true,m:mask==null?255:mask,dummy:true,kind:kind,mesh:m,post:post,alive:true}; G.dummies.push(d); return d; };
  for(let i=0;i<10;i++){ const d=mkT(-18+i*4,1.3+(i%3)*0.8,4+(i%4)*7,0.6,'pop'); d.up=false; d.mesh.setEnabled(false); }
  G.mover=mkT(0,1.3,6,0.55,'move');
  const dps=S.Avatar.create(sc,{color:[0.8,0.8,0.8],name:'DPS DUMMY',gun:false}); dps.root.position.set(-10,0,-24); dps.root.rotation.y=Math.PI; G.dpsAv=dps; G.dummies.push({id:'dps',x:-10,y:1.1,z:-24,r:0.6,up:true,m:255,dummy:true,kind:'dps',head:true});
  for(let w=0;w<8;w++) mkT(26+(w%4)*4,1.4,-10+Math.floor(w/4)*8,0.5,'d4',1<<w,tm2);
  const st=BABYLON.MeshBuilder.CreateCylinder('start',{diameter:2.4,height:0.2,tessellation:24},sc); st.position.set(0,0.1,-31); st.material=tm2; R.glowAdd(st);
  S.UI.rangePanel(); };
G.rangeCycle=function(d){ const ids=S.WEAPON_IDS; let i=ids.indexOf(G.me.loadout[0]); i=(i+d+ids.length)%ids.length; G.rangeGun=ids[i]; G.me.loadout[0]=ids[i]; G.me.wi=0; G.me.ammo={}; G.me.reloadT=0; S.UI.rangePanel(); S.Audio.click(); };
G.rushStart=function(){ if(G.rush) return; G.rush={t:60,score:0,next:0}; G.dummies.forEach(d=>{ if(d.kind==='pop'){ d.up=false; d.mesh.setEnabled(false); d.post.setEnabled(false); } }); S.UI.banner('TARGET RUSH!','Hit as many pop-up targets as you can in 60s'); S.Audio.announce('Target rush'); };
G.rangeHit=function(d,pr,hs,x,y,z){ const dmg=Math.round(pr.dmg*(hs?1.5:1)); S.UI.dmgNum(x,y,z,dmg,hs);
  if(d.kind==='dps'){ G.dps.push([G.now,dmg]); S.Audio.hit(hs); }
  else if(d.kind==='pop'||d.kind==='move'){ S.Audio.hit(hs); if(G.rush&&d.kind==='pop'&&d.up){ G.rush.score++; d.up=false; d.mesh.setEnabled(false); d.post.setEnabled(false); S.UI.hitmarker(2); } else if(G.rush&&d.kind==='move'){ G.rush.score+=2; S.UI.hitmarker(2); } else S.UI.hitmarker(0); }
  else if(d.kind==='d4'){ S.Audio.hit(true); S.UI.hitmarker(1); S.UI.hint('Slice '+G.me.slice+' target hit!',700); } };
G.rangeTick=function(dt){ if(G.me) G.dummies.forEach(d=>{ if(d.kind==='d4'&&d.mesh) d.mesh.setEnabled(!!(d.m&(1<<G.me.slice))); }); if(G.mover){ G.mover.x=Math.sin(G.now*0.9)*14; G.mover.mesh.position.x=G.mover.x; G.mover.post.position.x=G.mover.x; }
  if(G.rush){ const r=G.rush; r.t-=dt; r.next-=dt; if(r.next<=0){ r.next=0.9; const opts=G.dummies.filter(d=>d.kind==='pop'&&!d.up); if(opts.length){ const d=U.pick(opts); d.up=true; d.upT=1.4; d.mesh.setEnabled(true); d.post.setEnabled(true); } }
    G.dummies.forEach(d=>{ if(d.kind==='pop'&&d.up){ d.upT-=dt; if(d.upT<=0){ d.up=false; d.mesh.setEnabled(false); d.post.setEnabled(false); } } });
    if(r.t<=0){ const best=S.Save.d.range.best; if(r.score>best){ S.Save.d.range.best=r.score; S.UI.banner('NEW PERSONAL BEST!',r.score+' targets'); } else S.UI.banner('TIME!',r.score+' targets (best '+best+')'); S.Save.save(); S.UI.checkAch&&S.UI.checkAch(); G.rush=null; } }
  G.dps=G.dps.filter(e=>G.now-e[0]<3); const tot=G.dps.reduce((a,e)=>a+e[1],0); G.curDps=Math.round(tot/3); if(G.curDps>(S.Save.d.range.bestDps||0)){ S.Save.d.range.bestDps=G.curDps; }
  if(G.dpsAv) S.Avatar.update(G.dpsAv,dt,{x:-10,y:0,z:-24,yaw:Math.PI,pitch:0,speed:0,prot:false,scale:1}); S.UI.rangeUpdate(); };

/* ---- Menu diorama ---- */
G.menuInit=function(){ const M=G.M; const cols=[[1,0.25,0.55],[0.2,0.85,1],[1,0.9,0.2],[0.6,0.35,1],[0.25,1,0.55],[1,0.5,0.1]]; for(let i=0;i<120;i++){ const x=U.rand(M.bounds.x0,M.bounds.x1), z=U.rand(M.bounds.z0,M.bounds.z1); const y=M.floorAt(x,z); if(y<-5) continue; S.Paint.add(x,y,z,[0,1,0],U.pick(cols),0.6+Math.random()*1.8,-1,null,-1); } G.menuShotT=1.4; };

})();

<script>
/* ===================== NET (PeerJS host-authoritative star) + TRADE ESCROW =====================
   Room discovery: deterministic peer IDs. To join: connect to the room ID; if nobody answers, claim the ID
   and become host; if the claim returns 'unavailable-id', someone beat us -> retry as client.
   Probes: connect, send {t:'info'}, read the summary, disconnect.
   Host migration: host broadcasts join order; on host loss, clients wait a staggered delay by order index,
   then try to connect (someone else already took over) or claim the room ID themselves. */
(function(){'use strict';
const S=window.__SS, U=S.U, G=S.Game, Sec=S.Sec;
const PREFIX='splatstorm-v1-';
const OPTS={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const N=S.Net={online:false,ready:false,peer:null,probePeer:null,role:null,roomId:null,roomType:null,conns:new Map(),hostConn:null,order:[],leaving:false,migrating:false,ping:0,bans:new Set(),banNames:new Set(),locked:false,muted:new Set(),pending:{},seq:0,hostPeerId:null,board:[],hello:null};
N.ids={pub:[1,2,3,4,5].map(i=>PREFIX+'pub-'+i),arsenal:[1,2,3,4,5].map(i=>PREFIX+'arsenal-'+i),trade:[1,2].map(i=>PREFIX+'trade-'+i)};
N.privId=code=>PREFIX+'priv-'+String(code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
N.isHost=()=>N.role==='host'; N.isClient=()=>N.role==='client';
N.parse=function(raw){ if(typeof raw!=='string'||raw.length>16384) return null; try{ const m=JSON.parse(raw); if(!m||typeof m!=='object'||Array.isArray(m)||typeof m.t!=='string'||m.t.length>6) return null; return m; }catch(e){ return null; } };

N.onHostLost=async function(){ if(N.leaving||N.migrating||N.role!=='client') return; N.migrating=true; clearInterval(N.pingTimer); S.UI.toast('Host migrating…','warn',4000); S.UI.sysChat('Host left — migrating…');
  const me=N.peer&&N.peer.id; const order=N.order.filter(x=>x!==N.hostPeerId); const idx=Math.max(0,order.indexOf(me)); N.role='client'; N.hostConn=null;
  await U.sleep(900+idx*2300);
  for(let a=0;a<8&&!N.leaving;a++){ const r=await N.tryClient(N.roomId); if(r&&r.ok){ N.migrating=false; N.startFromWelcome(r.wel); S.UI.toast('Reconnected to the new host','good'); return; } if(r&&r.rej) break;
    const h=await N.tryHost(N.roomId); if(h==='ok'){ N.migrating=false; G.becomeHost(); S.UI.toast('You are now the host','good'); return; } N.role='client'; await U.sleep(1500); }
  N.migrating=false; if(!N.leaving) S.UI.kicked('Lost connection to the room.'); };
G.becomeHost=function(){ G.auth=true; G.kind=G.M&&G.M.id==='plaza'?'hub':'host'; let maxId=1; const sc={red:G.score.red,blue:G.score.blue};
  Array.from(G.players.values()).forEach(p=>{ maxId=Math.max(maxId,p.id); if(p.local) return; if(p.bot){ p.ai=null; p.hist=[]; return; } if(!p.peer||p.peer===N.roomId){ if(p.av) p.av.root.dispose(); G.players.delete(p.id); } else { p.away=true; p.awayT=20; p.hist=[]; } });
  G.nextId=maxId+1; G.modeInit(); G.score=sc; if(G.cfg.mode==='lts'&&G.roundWins){ G.score.red=G.roundWins.red; G.score.blue=G.roundWins.blue; } G.fillBots(); S.UI.sysChat('You are now hosting this room.'); };

/* ===================== TRADE (host escrow witness + single-use receipts) ===================== */
const T=S.Trade={cur:null,sess:new Map(),reqs:new Map(),owner:new Map(),inbox:null};
T.reset=function(){ T.cur=null; T.sess=new Map(); T.reqs=new Map(); T.owner=new Map(); T.boardList=[]; if(S.UI.tradeClose) S.UI.tradeClose(); };
T.toP=function(p,msg){ if(!p) return; if(p.local) T.clientMsg(msg); else if(p.peer) N.sendTo(p.peer,msg); };
T.tradeable=function(inv){ return inv&&!inv.adm&&S.ITEMS[inv.id]&&S.ITEMS[inv.id].trade!==false&&S.ITEMS[inv.id].price>0&&inv.id!=='golden'&&Date.now()-inv.ts>60000; };
T.request=function(p){ if(G.kind!=='hub'&&!(G.M&&G.M.id==='plaza')) return; if(p.bot){ S.UI.toast('Bots cannot trade.','warn'); return; } N.send({t:'tr',a:'req',to:p.id}); S.UI.toast('Trade request sent to '+G.dispName(p)); };
/* host */
T.hostMsg=function(p,m){ if(!(G.M&&G.M.id==='plaza')) return; const now=Date.now();
  if(m.a==='req'){ const t=G.players.get(m.to|0); if(!t||t===p||t.bot) return; if(now-(p.lastTrade||0)<10000) return T.toP(p,{t:'tr',a:'x',r:'Trade cooldown: wait a few seconds.'}); T.reqs.set(p.id+'>'+t.id,now); T.toP(t,{t:'tr',a:'req',from:p.id,n:p.name}); return; }
  if(m.a==='acc'||m.a==='dec'){ const f=G.players.get(m.to|0); const k=(m.to|0)+'>'+p.id; const ts=T.reqs.get(k); if(!f||!ts||now-ts>30000) return; T.reqs.delete(k); if(m.a==='dec'){ T.toP(f,{t:'tr',a:'x',r:p.name+' declined your trade.'}); return; }
    const tid=U.uuid(); const s={tid:tid,a:f.id,b:p.id,off:{},lock:{},conf:{},st:'open',ack:{}}; s.off[f.id]={it:[],c:0}; s.off[p.id]={it:[],c:0}; T.sess.set(tid,s);
    T.toP(f,{t:'tr',a:'open',tid:tid,o:p.id,n:p.name}); T.toP(p,{t:'tr',a:'open',tid:tid,o:f.id,n:f.name}); return; }
  const s=T.sess.get(m.tid); if(!s||(s.a!==p.id&&s.b!==p.id)) return; const other=G.players.get(s.a===p.id?s.b:s.a);
  if(m.a==='can'){ T.end(s,'Trade cancelled by '+p.name); return; }
  if(s.st!=='open'&&m.a!=='ack') return;
  if(m.a==='off'){ const items=[]; const seen=new Set();
    for(const x of (m.it||[])){ if(!x||typeof x.u!=='string'||seen.has(x.u)) continue; const ok=S.Ledger.verifyProof([x.e]); const e=x.e; if(!e||!e.it||e.it.u!==x.u||!ok.has(e.it.id)) return T.toP(p,{t:'tr',a:'x',r:'Ownership proof rejected for an item.'});
      const def=S.ITEMS[e.it.id]; if(!def||def.trade===false||def.price<=0||e.it.id==='golden') return T.toP(p,{t:'tr',a:'x',r:'That item is untradeable.'}); if(now-e.ts<60000) return T.toP(p,{t:'tr',a:'x',r:'Newly acquired items cannot be re-traded for 60s.'});
      const own=T.owner.get(x.u); if(own!=null&&own!==p.id) return T.toP(p,{t:'tr',a:'x',r:'Item already traded this session (double-spend blocked).'}); seen.add(x.u); items.push({u:x.u,id:e.it.id}); }
    s.off[p.id]={it:items,c:U.clamp(Math.floor(+m.c||0),0,5000)}; s.lock={}; s.conf={}; T.state(s); return; }
  if(m.a==='lock'){ s.lock[p.id]=true; T.state(s); return; }
  if(m.a==='conf'){ if(!s.lock[s.a]||!s.lock[s.b]) return; s.conf[p.id]=true; T.state(s); if(s.conf[s.a]&&s.conf[s.b]){ s.st='count'; T.state(s); setTimeout(()=>T.prep(s),3000); } return; }
  if(m.a==='ack'&&s.st==='prep'){ s.ack[p.id]=m.ok?1:-1; if(s.ack[s.a]===-1||s.ack[s.b]===-1){ T.end(s,'Trade failed verification.'); return; } if(s.ack[s.a]===1&&s.ack[s.b]===1) T.exec(s); } };
T.state=function(s){ [s.a,s.b].forEach(id=>{ const o=id===s.a?s.b:s.a; T.toP(G.players.get(id),{t:'tr',a:'st',tid:s.tid,mine:s.off[id],theirs:s.off[o],lk:[!!s.lock[id],!!s.lock[o]],cf:[!!s.conf[id],!!s.conf[o]],st:s.st}); }); };
T.prep=async function(s){ if(!T.sess.has(s.tid)||s.st!=='count') return; const A=G.players.get(s.a), B=G.players.get(s.b); if(!A||!B) return T.end(s,'Player left.');
  const rc={tid:s.tid,nonce:U.randHex(8),ts:Date.now(),pa:A.id,pb:B.id,na:A.name,nb:B.name,ia:s.off[s.a].it,ib:s.off[s.b].it,ca:s.off[s.a].c,cb:s.off[s.b].c};
  rc.sig=await S.sha256('RCPT|'+JSON.stringify([rc.tid,rc.nonce,rc.ts,rc.pa,rc.pb,rc.ia,rc.ib,rc.ca,rc.cb])); s.rc=rc; s.st='prep'; s.ack={}; T.toP(A,{t:'tr',a:'prep',rc:rc}); T.toP(B,{t:'tr',a:'prep',rc:rc}); setTimeout(()=>{ if(T.sess.has(s.tid)&&s.st==='prep') T.end(s,'Trade timed out.'); },6000); };
T.exec=function(s){ s.st='done'; const rc=s.rc; rc.ia.forEach(x=>T.owner.set(x.u,rc.pb)); rc.ib.forEach(x=>T.owner.set(x.u,rc.pa)); [rc.pa,rc.pb].forEach(id=>{ const p=G.players.get(id); if(p){ p.lastTrade=Date.now(); T.toP(p,{t:'tr',a:'exec',rc:rc}); } }); T.sess.delete(s.tid); G.emit({t:'sys',m:'🤝 '+rc.na+' and '+rc.nb+' completed a trade'}); };
T.end=function(s,r){ T.sess.delete(s.tid); [s.a,s.b].forEach(id=>T.toP(G.players.get(id),{t:'tr',a:'x',r:r})); };
T.playerLeft=function(p){ T.sess.forEach(s=>{ if(s.a===p.id||s.b===p.id) T.end(s,'The other player left.'); }); };
/* client */
T.receiptOk=async function(rc){ if(!rc||typeof rc.tid!=='string'||typeof rc.nonce!=='string') return false; const key=rc.tid+':'+rc.nonce; if(S.Save.d.usedReceipts.indexOf(key)>=0) return false; const sig=await S.sha256('RCPT|'+JSON.stringify([rc.tid,rc.nonce,rc.ts,rc.pa,rc.pb,rc.ia,rc.ib,rc.ca,rc.cb])); return sig===rc.sig; };
T.clientMsg=async function(m){ const me=G.me; if(!me) return;
  switch(m.a){
    case 'req': S.UI.tradeRequest(m.from|0,Sec.sanitize(String(m.n),30)); break;
    case 'open': T.cur={tid:m.tid,other:m.o|0,name:Sec.sanitize(String(m.n),30),mine:{it:[],c:0},theirs:{it:[],c:0},lk:[false,false],cf:[false,false],st:'open'}; S.UI.tradeOpen(); break;
    case 'st': if(T.cur&&T.cur.tid===m.tid){ Object.assign(T.cur,{mine:m.mine,theirs:m.theirs,lk:m.lk,cf:m.cf,st:m.st}); S.UI.tradeRender(); } break;
    case 'x': S.UI.toast(Sec.sanitize(String(m.r),100),'warn'); if(T.cur&&!/proof|untradeable|double|re-traded|cooldown/i.test(m.r)){ T.cur=null; S.UI.tradeClose(); } break;
    case 'prep': { const rc=m.rc; const mineA=rc.pa===me.id; const give=mineA?rc.ia:rc.ib, cgive=mineA?rc.ca:rc.cb; let ok=await T.receiptOk(rc); if(ok){ for(const x of give){ const inv=S.Ledger.inv.get(x.u); if(!inv||inv.id!==x.id||!T.tradeable(inv)){ ok=false; break; } } if(S.Ledger.bal<cgive) ok=false; } N.send({t:'tr',a:'ack',tid:rc.tid,ok:ok?1:0}); break; }
    case 'exec': { const rc=m.rc; if(!(await T.receiptOk(rc))){ S.UI.toast('Rejected a replayed or invalid trade receipt.','err'); break; } const mineA=rc.pa===me.id; if(!mineA&&rc.pb!==me.id) break;
      const give=mineA?rc.ia:rc.ib, get=mineA?rc.ib:rc.ia, cg=mineA?rc.ca:rc.cb, cr=mineA?rc.cb:rc.ca; const sv=S.Save.d; sv.usedReceipts.push(rc.tid+':'+rc.nonce); if(sv.usedReceipts.length>500) sv.usedReceipts.shift();
      give.forEach(x=>S.Ledger.append('tradeout',0,{u:x.u,id:x.id},'trade:'+rc.tid.slice(0,8))); get.forEach(x=>{ if(S.ITEMS[x.id]) S.Ledger.append('tradein',0,{u:x.u,id:x.id},'trade:'+rc.tid.slice(0,8)); });
      if(cg>0) S.Ledger.append('tradeout',-cg,null,'trade:'+rc.tid.slice(0,8)); if(cr>0) S.Ledger.append('tradein',cr,null,'trade:'+rc.tid.slice(0,8));
      sv.trades.unshift({tid:rc.tid,nonce:rc.nonce,ts:rc.ts,with:mineA?rc.nb:rc.na,gave:give.map(x=>x.id),got:get.map(x=>x.id),cg:cg,cr:cr,sig:rc.sig.slice(0,16)}); if(sv.trades.length>50) sv.trades.length=50; sv.stats.trades++; S.Save.save();
      T.cur=null; S.UI.tradeClose(); S.UI.toast('Trade complete! Receipt '+rc.tid.slice(0,8),'good',5000); S.Audio.coin(); if(S.UI.checkAch) S.UI.checkAch(); break; } } };
T.sendOffer=function(uuids,coins){ if(!T.cur) return; const it=uuids.map(u=>{ const inv=S.Ledger.inv.get(u); if(!inv) return null; const e=S.Ledger.L[inv.n]; return e?{u:u,e:{n:e.n,k:e.k,c:e.c,it:e.it,ts:e.ts,m:e.m,b:e.b,p:e.p,h:e.h}}:null; }).filter(Boolean); N.send({t:'tr',a:'off',tid:T.cur.tid,it:it,c:U.clamp(Math.floor(+coins||0),0,Math.min(5000,S.Ledger.bal))}); };
T.act=function(a){ if(T.cur) N.send({t:'tr',a:a,tid:T.cur.tid}); };
T.respond=function(from,acc){ N.send({t:'tr',a:acc?'acc':'dec',to:from}); };
/* trade board (session memory on the hub host) */
T.boardMsg=function(p,m){ if(!(G.M&&G.M.id==='plaza')) return; N.board=N.board.filter(e=>e.id!==p.id); if(m.a==='post'){ const clean=x=>Sec.cleanText(Sec.sanitize(String(x||''),120).trim()); const lf=clean(m.lf), of=clean(m.of); if(lf||of) N.board.unshift({id:p.id,n:p.name,lf:lf,of:of,ts:Date.now()}); } if(N.board.length>30) N.board.length=30; if(N.isHost()) N.bcast({t:'bd',l:N.board}); T.boardUpdate(N.board); };
T.boardUpdate=function(l){ if(!Array.isArray(l)) return; T.boardList=l.slice(0,30).map(e=>({id:e.id|0,n:Sec.sanitize(String(e.n),30),lf:Sec.sanitize(String(e.lf||''),120),of:Sec.sanitize(String(e.of||''),120),ts:+e.ts||0})); if(S.UI.boardRender) S.UI.boardRender(); if(G.redrawBoard) G.redrawBoard(); };
})();

function miniBg(M,sl,W,sc){ const c=document.createElement('canvas'); c.width=c.height=W; const g=c.getContext('2d'); g.fillStyle='rgba(30,20,60,.6)'; g.fillRect(0,0,W,W); const bit=1<<sl;
  M.boxes.forEach(b=>{ if(!(b.m&bit)||b.y1<0.3||b.y0>4) return; const h=U.clamp(b.y1,0,6); g.fillStyle='rgba('+(120+h*18)+','+(110+h*15)+','+(170+h*10)+',.85)'; g.fillRect(W/2+b.x0*sc,W/2-b.z1*sc,(b.x1-b.x0)*sc,(b.z1-b.z0)*sc); }); return c; }
function drawMini(){ const cv=$('minimap'), g=cv.getContext('2d'); const M=G.M, me=G.me; if(!M||!me) return; const bd=M.bounds, W=180; const sc=Math.min(W/(bd.x1-bd.x0),W/(bd.z1-bd.z0))*0.92; const tx=x=>W/2+x*sc, ty=z=>W/2-z*sc;
  if(!H.miniBg||H.miniSl!==me.slice){ H.miniBg=miniBg(M,me.slice,W,sc); H.miniSl=me.slice; }
  g.clearRect(0,0,W,W); g.save(); g.beginPath(); g.arc(W/2,W/2,W/2-2,0,7); g.clip(); g.drawImage(H.miniBg,0,0);
  const gr=S.Paint.grid; if(gr){ const cs=S.Paint.cell*sc; for(let i=0;i<gr.w;i++) for(let j=0;j<gr.h;j++){ const v=gr.d[i+j*gr.w]; if(!v) continue; g.fillStyle=v===1?'rgba(255,60,100,.35)':'rgba(60,140,255,.35)'; g.fillRect(tx(gr.x0+i*S.Paint.cell),ty(gr.z0+(j+1)*S.Paint.cell),cs+0.5,cs+0.5); } }
  if(G.cfg.mode==='koth'){ const hi=G.auth?G.hill.i:(G.hillNet?G.hillNet[0]:0); const h=M.hills[hi]; if(h){ g.strokeStyle='#ffe23d'; g.lineWidth=2; g.beginPath(); g.arc(tx(h[0]),ty(h[2]),5*sc,0,7); g.stroke(); } }
  if(G.cfg.mode==='ctf'){ ['red','blue'].forEach((t,i)=>{ const pos=G.auth&&G.flagSt?G.flagSt[t].pos:(G.flagNet?G.flagNet[i]:null); if(!pos) return; g.fillStyle=t==='red'?'#ff3b5c':'#2f8bff'; g.fillRect(tx(pos[0])-4,ty(pos[2])-4,8,8); g.strokeStyle='#fff'; g.strokeRect(tx(pos[0])-4,ty(pos[2])-4,8,8); }); }
  G.pk.forEach(k=>{ if(!k.on) return; g.fillStyle={health:'#ff3d6a',ammo:'#ffe23d',speed:'#26e8ff',shield:'#5a8aff',dbl:'#ffd700'}[k.k]; g.fillRect(tx(k.x)-1.5,ty(k.z)-1.5,3,3); });
  G.players.forEach(p=>{ if(p.local||!p.alive) return; const mate=G.isTeam()&&p.team===me.team; const spotted=G.radarT>0||(G.now-(p.lastShotT||-9)<1.5)||(p.lastFire&&G.now-p.lastFire<1.5); if(!mate&&!spotted) return; if(G.fourD()&&p.slice!==me.slice&&!mate) return; g.fillStyle=mate?G.teamCss(p.team):'#ff3030'; g.beginPath(); g.arc(tx(p.x),ty(p.z),mate?3.2:3.6,0,7); g.fill(); if(!mate){ g.strokeStyle='#fff'; g.lineWidth=1; g.stroke(); } });
  g.save(); g.translate(tx(me.x),ty(me.z)); g.rotate(me.yaw); g.fillStyle='#fff'; g.beginPath(); g.moveTo(0,-7); g.lineTo(5,5); g.lineTo(0,2); g.lineTo(-5,5); g.closePath(); g.fill(); g.restore(); g.restore(); }
function drawCross(sp,show){ const c=$('cross'), g=c.getContext('2d'); g.clearRect(0,0,120,120); if(!show) return; const st=S.Save.d.settings.cross, me=G.me; const k=G.muts.oneshot?0.65:1; const sz=st.size*k, th=st.thick, gap=st.gap*k+sp*260*k, cx=60, cy=60;
  const line=(a,b,c2,d)=>{ if(st.outline){ g.strokeStyle='rgba(0,0,0,.85)'; g.lineWidth=th+2; g.beginPath(); g.moveTo(a,b); g.lineTo(c2,d); g.stroke(); } g.strokeStyle=st.color; g.lineWidth=th; g.beginPath(); g.moveTo(a,b); g.lineTo(c2,d); g.stroke(); };
  if(st.shape==='cross'||st.shape==='t'){ if(st.shape==='cross') line(cx,cy-gap,cx,cy-gap-sz); line(cx,cy+gap,cx,cy+gap+sz); line(cx-gap,cy,cx-gap-sz,cy); line(cx+gap,cy,cx+gap+sz,cy); }
  else if(st.shape==='circle'){ if(st.outline){ g.strokeStyle='rgba(0,0,0,.85)'; g.lineWidth=th+2; g.beginPath(); g.arc(cx,cy,gap+sz/2,0,7); g.stroke(); } g.strokeStyle=st.color; g.lineWidth=th; g.beginPath(); g.arc(cx,cy,gap+sz/2,0,7); g.stroke(); }
  if(st.dot||st.shape==='dot'){ if(st.outline){ g.fillStyle='rgba(0,0,0,.85)'; g.beginPath(); g.arc(cx,cy,th+1,0,7); g.fill(); } g.fillStyle=st.color; g.beginPath(); g.arc(cx,cy,th,0,7); g.fill(); }
  if(me&&(me.charging||me.spin>0&&me.spin<1)){ const v=me.charging?me.charge:me.spin; g.strokeStyle=me.charging?'hsl('+(v*300)+',100%,60%)':'#ffe23d'; g.lineWidth=4; g.beginPath(); g.arc(cx,cy,24,-Math.PI/2,-Math.PI/2+v*Math.PI*2); g.stroke(); } }

I.onKey=function(e,down){ if(!G.active||G.kind==='menu') return; const b=S.Save.d.binds;
  if(e.code===b.score){ if(down&&!e.repeat) UI.scoreboard(true); else if(!down) UI.hideOv('scoreOv'); return; }
  if(!down){ if(UI.wheelOpen&&(e.code===b.quick||e.code===b.emote)) UI.closeWheel(); return; } if(e.repeat) return;
  if(!I.locked) return;
  if(e.code===b.chatAll){ UI.openChat(false); e.preventDefault(); } else if(e.code===b.chatTeam){ UI.openChat(true); e.preventDefault(); }
  else if(e.code===b.quick) UI.openWheel('quick'); else if(e.code===b.emote) UI.openWheel('emote'); };

UI.pause=function(){ const o=UI.overlay('pauseOv'); o.style.background='rgba(8,3,22,.55)'; const box=el('div',{class:'glass gb panel',style:'max-width:560px;text-align:center'}); o.appendChild(box);

/* Two secret codes, both stored as salted SHA-256 digests only:
   - SESSION code  -> admin until reload.
   - PERMANENT site-admin code -> writes a token bound to this install's save salt; re-verified on every boot. */

      if((await S.sha256(SALT+s))===HASH){ a.fails=0; S.Save.save(); on=true; return {ok:true,perm:false}; }
      a.fails++; if(a.fails>=5){ const d=[60e3,300e3,1800e3][Math.min(a.lockLevel,2)]; a.lockUntil=Date.now()+d; a.lockLevel++; a.fails=0; S.Save.save(); return {ok:false,locked:a.lockUntil}; } S.Save.save(); return {ok:false}; },
    revokePerm(){ sv().admin.permTok=''; perm=false; on=false; S.Save.save(); },
    local:()=>on&&(G.kind==='offline'||G.kind==='range'), hosted:()=>on&&S.Net.isHost() }); })();

  const mw=el('div',{class:'row'}); S.MUTATORS.forEach(m=>mw.appendChild(btn((G.muts[m.id]?'✔ ':'')+m.name,'xs '+(G.muts[m.id]?'y':'d'),()=>{ const c=Object.assign({},G.cfg); const l=(c.muts||[]).slice(); const i=l.indexOf(m.id); if(i>=0) l.splice(i,1); else l.push(m.id); c.muts=l; UI.closeAdminModal&&UI.closeAdminModal(); G.nextRound(c); UI.enterGame(); })));
  box.appendChild(sec('🎛 Toggle mutators (restarts round)',loc,[mw]));
  const mapS=el('select'); mapS.appendChild(el('option',{value:'random'},'Random')); S.MAPS.forEach(m=>mapS.appendChild(el('option',{value:m.id},m.name))); const modeS=el('select'); S.MODES.forEach(m=>modeS.appendChild(el('option',{value:m.id},m.name))); const ann=el('input',{type:'text',maxlength:'80',placeholder:'Announcement…'});
  box.appendChild(sec('👑 Room powers (rooms you host)',host,[modeS,mapS,btn('Change now','xs y',()=>{ G.nextRound(Object.assign({},G.cfg,{mode:modeS.value,map:mapS.value,mapChoice:mapS.value})); }),btn('End round','xs r',()=>{ const t=G.isTeam()?(G.score.red>=G.score.blue?'red':'blue'):(G.topPlayer()||{}).id; G.endMatch(t||'draw'); }),btn('+1 min','xs d',()=>{ if(G.cfg.time>0){ G.timeLeft+=60; } }),btn('−1 min','xs d',()=>{ if(G.cfg.time>0) G.timeLeft=Math.max(5,G.timeLeft-60); }),btn('∞ timer','xs d',()=>{ G.cfg.time=0; G.elapsed=G.elapsed||0; S.Net.bcast({t:'sys',m:'Timer set to indefinite'}); }),ann,btn('Broadcast','xs o',()=>{ const t=S.Sec.sanitize(ann.value,80).trim(); if(t) G.emit({t:'ann',b:t}); ann.value=''; }),btn((G.cfg.botFill?'✔ ':'')+'Bot fill','xs c',()=>{ G.cfg.botFill=!G.cfg.botFill; G.fillBots(); UI.openAdmin(); }),btn((S.Net.locked?'✔ ':'')+'Lock room','xs v',()=>{ S.Net.locked=!S.Net.locked; UI.openAdmin(); }),btn('Players (kick/ban/mute/swap)…','xs p',()=>{ UI.closeAdminModal&&UI.closeAdminModal(); UI.scoreboard(false); })]));
  if(UI.closeAdminModal) UI.closeAdminModal(); const wrap=el('div',{class:'rainbow'},box); UI.closeAdminModal=UI.modal('🛠 ADMIN PANEL',wrap,[{label:'Close',cls:'d',fn:()=>{ UI.closeAdminModal=null; }}]); };
G.adminPickup=function(k,x,y,z){ const sc=S.R.scene; const m=BABYLON.MeshBuilder.CreateSphere('pk',{diameter:0.7},sc); m.material=S.R.mat('pk_'+k,{c:'#111111',e:{health:'#ff3d6a',ammo:'#ffe23d',speed:'#26e8ff',shield:'#5a8aff',dbl:'#ffd700'}[k],glow:true}); S.R.glowAdd(m); const ring=BABYLON.MeshBuilder.CreateTorus('pkr',{diameter:1.4,thickness:0.06},sc); ring.material=m.material; ring.position.set(x,y+0.05,z); G.pk.push({k:k,x:x,y:y,z:z,on:true,t:0,mesh:m,ring:ring}); };
UI.adminTick=function(dt){ const me=G.me; if(!S.Admin.on()||!me) return;
  if(me.noclip&&S.Admin.local()&&I.locked){ const f=G.fwd(me.yaw,me.pitch); const sp=(I.down('sprint')?30:14)*dt; const mz=(I.down('fwd')?1:0)-(I.down('back')?1:0), mx=(I.down('right')?1:0)-(I.down('left')?1:0); me.x+=f[0]*mz*sp+Math.cos(me.yaw)*mx*sp; me.z+=f[2]*mz*sp-Math.sin(me.yaw)*mx*sp; me.y+=f[1]*mz*sp+(I.down('jump')?sp:0)-(I.down('crouch')?sp:0); me.vx=me.vy=me.vz=0; }
  if(G.showHit&&S.R.scene){ G.hitMeshes=G.hitMeshes||[]; let i=0; G.players.forEach(p=>{ if(!p.alive) return; G.hitboxes(p,p.x,p.y,p.z).forEach(h=>{ let m=G.hitMeshes[i]; if(!m||m.isDisposed()){ m=BABYLON.MeshBuilder.CreateSphere('hb',{diameter:1,segments:6},S.R.scene); m.material=S.R.mat('hbM',{c:'#ff0000',e:'#ff0000',wire:true}); m.isPickable=false; G.hitMeshes[i]=m; } m.setEnabled(true); m.position.set(h[0],h[1],h[2]); m.scaling.setAll(h[3]*2); i++; }); }); for(;i<G.hitMeshes.length;i++) if(G.hitMeshes[i]&&!G.hitMeshes[i].isDisposed()) G.hitMeshes[i].setEnabled(false); }
  else if(G.hitMeshes){ G.hitMeshes.forEach(m=>{ if(m&&!m.isDisposed()) m.setEnabled(false); }); } };

/* ---------- boot ---------- */
G.startMenu=function(){ G.start({kind:'menu',mode:'tdm',map:U.pick(['warehouse','candy','skate','moon','jungle','frost','pirate']),muts:[],time:0,botFill:false,botDiff:'easy'}); };
S.boot=async function(){ const canvas=$('c'); let gl=false; try{ const t=document.createElement('canvas'); gl=!!(t.getContext('webgl2')||t.getContext('webgl')); }catch(e){}
  if(!window.BABYLON){ fatal('Engine failed to load','Babylon.js could not be loaded from the CDN. Check your connection and reload.'); return; }
  if(!gl){ fatal('WebGL unavailable','Your browser or device does not support WebGL, which Paintball Pro needs. Try enabling hardware acceleration or another browser.'); return; }
  try{ await S.Save.init(); }catch(e){ S.Save.d=S.Save.defaults(); }
  try{ await S.Admin.restore(); }catch(e){}
  try{ S.R.init(canvas); }catch(e){ fatal('Could not start the 3D engine',String(e&&e.message||e)); return; }
  S.Input.init(canvas); S.Input.onLock=UI.onLock; UI.bindChatInput(); $('hudLeave').addEventListener('click',()=>{ UI.leave(); });
  const aud=()=>S.Audio.init(); document.addEventListener('pointerdown',aud); document.addEventListener('keydown',aud);
  canvas.addEventListener('click',()=>{ if(G.active&&G.kind!=='menu'&&!I.locked&&!UI.ovOpen('pauseOv')&&!UI.ovOpen('endOv')&&!UI.ovOpen('voteOv')&&!UI.ovOpen('tradeOv')&&!UI.ovOpen('boardOv')&&!$('modalRoot').children.length) I.lock(); });
  UI.applyScale(); G.startMenu(); UI.dailyInit(); UI.checkAch();
  S.Net.init().then(on=>UI.setOnline(on));
  if(!S.Save.d.profileDone) UI.show('setup'); else UI.show('menu');
  if(S.Admin.perm()) setTimeout(()=>UI.toast('🛠 Permanent site admin active','good',3500),1200);
  S.log('boot ok'); };
})();
