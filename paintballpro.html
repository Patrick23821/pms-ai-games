<script>
/* Isolated regression checks. No save data, live room state, or rendered match scene is modified. */
(function(){ 'use strict';
const S=window.__SS;
S.Diagnostics={
  run(){
    const report=[], test=(name,fn)=>{ try{ fn(); report.push({name:name,ok:true}); }catch(e){ report.push({name:name,ok:false,detail:String(e.message||e)}); } };
    const assert=(value,message)=>{ if(!value) throw new Error(message); };
    let engine=null, scene=null;
    try{
      engine=new BABYLON.NullEngine({renderWidth:128,renderHeight:128,textureSize:128}); scene=new BABYLON.Scene(engine);
      const av=S.Avatar.create(scene,{color:[.9,.25,.5],gun:'pistol',name:'Test Dummy'});
      const state={x:0,y:0,z:0,yaw:.25,pitch:0,speed:0,grounded:true,scale:1};
      test('Painted Disaster Isle-style face on head sphere',()=>{
        assert(av.head.material&&av.head.material.diffuseTexture,'Head should use a painted face texture.');
        assert(av.face.getChildMeshes().length===0,'Face should be texture-painted, not 3D eye meshes.');
        const uvs=av.head.getVerticesData(BABYLON.VertexBuffer.UVKind);
        assert(uvs&&uvs.length>=12,'Head mesh needs front-facing UVs for the face paint.');
        assert(av.face instanceof BABYLON.TransformNode,'Facial rig node should remain for decals and metadata.');
      });
      test('Preview is an opaque studio and faces the avatar front',()=>{
        const pv=S.Preview; if(!pv||!pv.sc||!pv.cam) return;
        assert(pv.sc.clearColor.a===1,'The menu preview is transparent over the live arena.');
        pv.resetFront();
        assert(pv.cam.position.z>pv.cam.target.z,'Preview camera is behind the avatar front.');
      });
      test('Hair and headband leave the eyebrows unobstructed',()=>{
        const band=av.band.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for(let i=1;i<band.length;i+=3) assert(band[i]>.1,'Headband crosses the eyebrows.');
        [-.085,0,.085].forEach(x=>{
          const angle=Math.atan2(x,S.faceDepth(x,.055));
          assert(S.hairlineHeight(angle)>.085,'Hairline crosses a facial feature.');
        });
      });
      test('Hair remains visible with and without hats',()=>{
        assert(av.hair.isEnabled()&&av.crown===av.hair,'Hair is missing without a hat.');
        av.hair.refreshBoundingInfo(true);
        const cap=av.hair.getBoundingInfo().boundingBox;
        assert(cap.maximumWorld.y>S.FACE.ry+.01&&cap.maximumWorld.x>S.FACE.rx+.01,'Hair cap is buried inside the skull.');
        ['hat_cap','hat_beanie','hat_propeller'].forEach(hat=>{
          const withHat=S.Avatar.create(scene,{color:[.9,.25,.5],gun:false,hat:hat});
          assert(withHat.hair.isEnabled(),'Hair disappears under '+hat+'.');
          withHat.root.dispose();
        });
      });
      test('Headband geometry faces outward',()=>{
        assert(av.band.material.backFaceCulling===true,'Headband renders its inside surface.');
        const bp=av.band.getVerticesData(BABYLON.VertexBuffer.PositionKind), bi=av.band.getIndices();
        const tri=n=>[bp[n*3],bp[n*3+1],bp[n*3+2]], t0=tri(bi[0]), t1=tri(bi[1]), t2=tri(bi[2]);
        const nz=(t1[0]-t0[0])*(t2[1]-t0[1])-(t1[1]-t0[1])*(t2[0]-t0[0]);
        assert(nz>0,'Headband triangles face into the head.');
      });
      test('Avatar decals cannot z-fight or occlude the model',()=>{
        assert(av.face instanceof BABYLON.TransformNode,'Facial features are not using the depth-safe 3D rig.');
        assert(av.tag&&av.tag.material.disableDepthWrite===true,'Nameplate background occludes the scene.');
        assert(av.shield.material.disableDepthWrite===true,'Spawn shield can hide the face.');
        S.Avatar.splot(av,[1,0,0]);
        assert(av.splots.length===1&&av.splots[0].material.disableDepthWrite===true,'Paint splots can clip each other.');
        S.Avatar.clearSplots(av);
      });
      test('Transparent decals do not punch holes in the glow pass',()=>{
        if(!S.R.glow||!S.R.glow.customEmissiveColorSelector) return;
        const out=new BABYLON.Color4(1,1,1,1);
        S.R.glow.customEmissiveColorSelector({},null,{useAlphaFromDiffuseTexture:true,alpha:1},out);
        assert(out.a===0,'Alpha decal occludes glow behind it.');
        S.R.glow.customEmissiveColorSelector({},{}, {alpha:1},out);
        assert(out.r===0&&out.a===1,'Opaque occluders stopped blocking glow.');
      });
      test('Avatar has no attached paint canisters',()=>{
        assert(!av.root.getChildMeshes().some(m=>/tank|canister|paintPod/i.test(m.name)),'An attached paint container remains.');
      });
      test('Death pose resets to an upright standing pose',()=>{
        S.Avatar.update(av,.02,Object.assign({},state,{dead:true,deadT:1}));
        assert(Math.abs(av.root.rotation.x)>1,'Death animation was not exercised.');
        S.Avatar.update(av,.02,state);
        assert(av.root.rotation.x===0&&av.root.rotation.z===0,'Root tilt remained after death.');
      });
      test('Flip and wave poses do not leave residual rotations',()=>{
        S.Avatar.update(av,.02,Object.assign({},state,{emote:{k:'flip',t:.35}}));
        S.Avatar.update(av,.02,Object.assign({},state,{emote:{k:'wave',t:1}}));
        S.Avatar.update(av,.02,state);
        assert(av.root.rotation.x===0&&av.headRoot.rotation.z===0&&av.torso.rotation.z===0,'An emote rotation leaked into idle.');
      });
      test('Crouch and slide return to a neutral standing pose',()=>{
        S.Avatar.update(av,.02,Object.assign({},state,{crouch:true,slide:true}));
        S.Avatar.update(av,.02,state);
        assert(av.root.rotation.x===0&&av.torso.rotation.x===0,'Slide tilt remained.');
        av.legL.foot.computeWorldMatrix(true);
        assert(Math.abs(av.legL.foot.getAbsolutePosition().y-.066)<.003,'Standing foot is not grounded.');
      });
      S.WEAPON_IDS.forEach(id=>{
        test(S.WEAPONS[id].name+': hands follow grips',()=>{
          S.Avatar.setGun(av,id,'#ff3d9a');
          [-1,0,1].forEach(pitch=>{
            S.Avatar.update(av,.01,Object.assign({},state,{pitch:pitch}));
            av.gun.computeWorldMatrix(true); av.handR.computeWorldMatrix(true);
            const grip=BABYLON.Vector3.TransformCoordinates(av.gun.rig.grip,av.gun.getWorldMatrix());
            assert(BABYLON.Vector3.Distance(grip,av.handR.getAbsolutePosition())<.008,'Right hand missed the grip at pitch '+pitch+'.');
            if(id!=='paddle'){
              av.handL.computeWorldMatrix(true);
              const support=BABYLON.Vector3.TransformCoordinates(av.gun.rig.support,av.gun.getWorldMatrix());
              assert(BABYLON.Vector3.Distance(support,av.handL.getAbsolutePosition())<.008,'Support hand missed the grip at pitch '+pitch+'.');
            }
          });
          S.Avatar.update(av,.01,Object.assign({},state,{preview:true}));
          av.gun.computeWorldMatrix(true); av.handR.computeWorldMatrix(true);
          const grip=BABYLON.Vector3.TransformCoordinates(av.gun.rig.grip,av.gun.getWorldMatrix());
          assert(BABYLON.Vector3.Distance(grip,av.handR.getAbsolutePosition())<.008,'Menu grip is misaligned.');
        });
        test(S.WEAPONS[id].name+': unobstructed ADS axis',()=>{
          const gun=S.buildGun(scene,id,{paint:'#ff3d9a'});
          try{
            assert(gun.hopper==null,'A paint hopper remains attached to the weapon.');
            assert(!gun.getChildMeshes().some(m=>m.material&&/hopShell/i.test(m.material.name)),'A paint reservoir remains.');
            const pose=S.viewPose(gun,1);
            assert(Math.abs(pose.y+gun.rig.sightY*pose.scale)<.00001,'Sight is not aligned with the camera.');
            const ray=new BABYLON.Ray(new BABYLON.Vector3(-pose.x/pose.scale,gun.rig.sightY,-.55),new BABYLON.Vector3(0,0,1),2);
            gun.getChildMeshes().forEach(mesh=>{
              if(mesh.material&&mesh.material.alpha<.95) return;
              mesh.computeWorldMatrix(true);
              assert(!ray.intersectsMesh(mesh,false).hit,'Opaque geometry blocks the sight line: '+mesh.name);
            });
          }finally{ gun.dispose(); }
        });
      });
      test('Round intro maintains a constant orbit, height and field of view',()=>{
        [{x0:-42,x1:42,z0:-30,z1:30},{x0:8,x1:78,z0:-12,z1:58}].forEach(bounds=>{
          const first=S.introOrbit(bounds,0,false), cx=first.target[0], cy=first.target[1], cz=first.target[2];
          const distance=Math.hypot(first.x-cx,first.y-cy,first.z-cz); let angle=null;
          for(let elapsed=0;elapsed<=S.INTRO.duration;elapsed+=.25){
            const p=S.introOrbit(bounds,elapsed,false);
            assert(Math.abs(Math.hypot(p.x-cx,p.z-cz)-first.radius)<.00001,'Intro orbit radius changed.');
            assert(Math.abs(Math.hypot(p.x-cx,p.y-cy,p.z-cz)-distance)<.00001,'Intro zoomed towards or away from the target.');
            assert(p.y===first.y&&p.fov===first.fov,'Intro height or field of view changed.');
            const a=Math.atan2(p.z-cz,p.x-cx);
            if(angle!=null) assert(Math.abs(S.U.angDiff(angle,a)-.25*S.INTRO.angularSpeed)<.00001,'Intro rotation speed changed.');
            angle=a;
          }
          const still=S.introOrbit(bounds,S.INTRO.duration,true);
          assert(Math.abs(still.x-first.x)<.00001&&Math.abs(still.z-first.z)<.00001,'Reduced-motion intro is not static.');
        });
      });
      test('Random maps respect mode compatibility and avoid immediate repeats',()=>{
        const rng=S.U.rng(157), seen=new Set(); let last='warehouse';
        for(let i=0;i<100;i++){ const map=S.pickMap('tdm',[],last,rng); assert(map!==last,'Immediate repeated arena.'); assert(S.mapPool('tdm',[]).indexOf(map)>=0,'Unsupported normal map.'); seen.add(map); last=map; }
        assert(seen.size>=6,'Random selection did not vary.');
        for(let i=0;i<30;i++){ const map=S.pickMap('fourd',[],null,rng); assert(S.MAPS.find(m=>m.id===map).d4,'4D selected an unsupported map.'); }
      });
      test('Network config retains the host-selected arena',()=>{
        const cfg=S.Net.cleanCfg({map:'moon',mapChoice:'random',mode:'fourd',muts:['fourd']});
        assert(cfg.map==='moon'&&cfg.mapChoice==='random','Client config lost the concrete host map.');
      });
      test('Only offline Bot Matches are pausable',()=>{
        assert(S.Game.pausePolicy('offline',true,null),'Bot Match should pause.');
        assert(!S.Game.pausePolicy('host',true,'host'),'Hosted matches must remain live.');
        assert(!S.Game.pausePolicy('client',false,'client'),'Clients must remain live.');
        assert(!S.Game.pausePolicy('hub',true,'host'),'Plazas must remain live.');
        assert(!S.Game.pausePolicy('range',true,null),'Range is not a Bot Match.');
      });
    }catch(e){ report.push({name:'Check setup',ok:false,detail:String(e.message||e)}); }
    finally{ if(scene) scene.dispose(); if(engine) engine.dispose(); }
    const body=S.UI.el('div',{class:'col',style:'max-height:60vh;overflow:auto;font-size:12px'});
    const passed=report.filter(r=>r.ok).length;
    body.appendChild(S.UI.el('b',{text:passed+' / '+report.length+' checks passed',style:'margin-bottom:8px'}));
    report.forEach(r=>body.appendChild(S.UI.el('div',{text:(r.ok?'PASS: ':'FAIL: ')+r.name+(r.detail?' | '+r.detail:''),style:'color:'+(r.ok?'#80e9b1':'#ff829e')+';padding:5px 0;border-bottom:1px solid #ffffff12'})));
    S.UI.modal('Model and Rules Checks',body,[{label:'Close',cls:'d'}]);
    return report;
  }
};
})();
</script>
