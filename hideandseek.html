<style>html, body, #root { height: 100%; margin: 0; background: #04050b; overflow: hidden; }
body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e5e7eb; }

@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.95); } to { opacity: 1; transform: none; } }
@keyframes floatUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pulseGlow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes shimmer { to { background-position: 200% center; } }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }

.title-gradient {
  background: linear-gradient(100deg, #fde68a 0%, #fb923c 30%, #ef4444 55%, #fb923c 80%, #fde68a 100%);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite;
}
.glass { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(18px); box-shadow: 0 10px 60px rgba(0,0,0,.55); }
.glass-dark { background: rgba(6,8,16,.78); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(16px); }
.hud-chip { background: linear-gradient(180deg, rgba(20,24,38,.72), rgba(8,10,18,.72)); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); }
.anim-in { animation: floatUp .5s ease-out both; }

input[type="range"] { height: 6px; cursor: pointer; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 8px; }
