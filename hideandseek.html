: \"gazebo\", x: px - rx * 0.55, z: pz - rz * 0.55, rot: 0.4 });\n    K.push({ type: \"playground\", x: px + rx * 0.55, z: pz + rz * 0.5, rot: 0 });\n    K.push({ type: \"statue\", x: px + rx * 0.6, z: pz - rz * 0.6, rot: 0 });\n    for (let k = 0; k \u003c 4; k++) {\n        const a = k * Math.PI / 2;\n        K.push({ type: \"bench\", x: px + Math.cos(a) * 11, z: pz + Math.sin(a) * 11, rot: -a - Math.PI / 2 });\n        K.push({ type: \"lamp\", x: px + Math.cos(a + 0.78) * 9, z: pz + Math.sin(a + 0.78) * 9, rot: 0 });\n    }\n    // hedge rows along two edges\n    for (const s of [-1, 1]) {\n        K.push({ type: \"hedge\", x: px, z: pz + s * (rz + 0.5), rot: 0, len: w - 12 });\n        K.push({ type: \"hedge\", x: px + s * (rx + 0.5), z: pz - 4, rot: Math.PI / 2, len: d * 0.45 });\n    }\n    // trees + bushes (picked up as normal vegetation → bushes are real hiding spots)\n    const cnt = Math.round((w * d) / 60);\n    for (let k = 0; k \u003c cnt; k++) {\n        const x = px + (t() - 0.5) * (w - 6), zz = pz + (t() - 0.5) * (d - 6);\n        if (Math.hypot(x - px, zz - pz) \u003c 9) continue;\n        const nearGaz = Math.hypot(x - (px - rx * 0.55), zz - (pz - rz * 0.55)) \u003c 6 || Math.hypot(x - (px + rx * 0.55), zz - (pz + rz * 0.5)) \u003c 8;\n        if (nearGaz) continue;\n        const type = t() \u003c 0.5 ? 1 : t() \u003c 0.6 ? 2 : 10; // oak, birch, bush\n        out.vegExtra.push({ type, x, z: zz, rot: t() * 6.28, s: type === 10 ? 0.9 + t() * 0.5 : 0.9 + t() * 0.6, tint: t() });\n    }\n};\n\n// ───────────────────────── geometry (runs per prop inside Buildings) ─────────────────────────\nexports.STRUCT_TYPES = new Set([\n    \"glasstower\", \"office\", \"apartment\", \"parklawn\", \"fountain\", \"gazebo\", \"playground\", \"hedge\", \"statue\",\n    \"planter\", \"busstop\", \"billboard\", \"gasstation\", \"watertower\", \"windmill\", \"campsite\",\n]);\n\nexports.buildStruct = function (r, t, i, s, H) {\n    const { Kn, Bt, Er } = H;\n    const L = Kn(r.x, t, r.z, r.rot);\n    const cs = Math.cos(r.rot), sn = Math.sin(r.rot);\n    const colC = {};\n    const col = (h) =\u003e colC[h] || (colC[h] = Bt(h));\n    const B = (m, x, y, z, w, h, d, c, ry = 0, rx = 0, rz = 0) =\u003e i[m].box(Kn(x, y, z, ry, rx, rz, L), w, h, d, col(c));\n    const CY = (m, x, y, z, rt, rb, h, seg, c, caps = true, rx = 0, rz = 0) =\u003e i[m].cylinder(Kn(x, y, z, 0, rx, rz, L), rt, rb, h, seg, col(c), caps);\n    const W2 = (lx, lz) =\u003e [r.x + lx * cs + lz * sn, r.z - lx * sn + lz * cs];\n    const SB = (lx, lz, hx, hz, y0, y1) =\u003e { const [wx, wz] = W2(lx, lz); s.box(wx, wz, hx, hz, r.rot, t + y0, t + y1); };\n    const SC = (lx, lz, rad, y0, y1) =\u003e { const [wx, wz] = W2(lx, lz); s.circle(wx, wz, rad, t + y0, t + y1); };\n    const HIDE = (lx, ly, lz, hx, hy, hz, label, power = 0.45, crouch = false) =\u003e {\n        const [wx, wz] = W2(lx, lz);\n        s.hide({ x: wx, y: t + ly, z: wz, r: 0, hx, hy, hz, c: cs, s: sn, label, power, crouch });\n    };\n    const rnd = Er((r.seed || 7) + 11);\n    const FRAME = \"#c7ccd2\", DARK = \"#2b313a\";\n\n    // façade helpers shared by towers / offices\n    const mullions = (w, d, y0, h) =\u003e {\n        const nx = Math.max(2, Math.floor(w / 3)), nz = Math.max(2, Math.floor(d / 3));\n        for (let j = 0; j \u003c= nx; j++)\n            for (const sg of [-1, 1]) B(\"stone\", -w / 2 + j * (w / nx), y0 + h / 2, sg * (d / 2 + 0.1), 0.28, h, 0.28, FRAME);\n        for (let j = 1; j \u003c nz; j++)\n            for (const sg of [-1, 1]) B(\"stone\", sg * (w / 2 + 0.1), y0 + h / 2, -d / 2 + j * (d / nz), 0.28, h, 0.28, FRAME);\n    };\n    const litPanes = (w, d, y0, floors, FH, prob) =\u003e {\n        const nx = Math.max(2, Math.floor(w / 3)), nz = Math.max(2, Math.floor(d / 3));\n        for (let k = 0; k \u003c floors; k++) {\n            const y = y0 + k * FH + FH * 0.55;\n            for (const sg of [-1, 1]) {\n                for (let j = 0; j \u003c nx; j++)\n
