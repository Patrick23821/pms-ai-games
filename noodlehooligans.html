<html lang="en">
<head>
<meta charset="utf-8">

<title>Noodle Hooligans</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
--pink:#FF3D8B;--blue:#2EC4FF;--yellow:#FFD93D;--lime:#7CFF4F;--grape:#7B3FF2;--ink:#1B1032;--orange:#FF8A3D;--teal:#2EF2C4;
--ink2:#2a1b4d;--paper:#fff8ef;--glass:rgba(27,16,50,.72);--r:24px;--r-sm:16px;--r-lg:28px;--o:4px;
--font-display:"Lilita One","Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
--font-body:"Fredoka","Nunito","Segoe UI Rounded","Trebuchet MS",system-ui,sans-serif;
--shadow:0 6px 0 var(--ink);--shadow-sm:0 4px 0 var(--ink);
--spring:cubic-bezier(.34,1.56,.64,1);--spring2:cubic-bezier(.18,1.8,.4,.9);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:var(--font-body);color:#fff;user-select:none;-webkit-user-select:none}
#nh-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#nh-ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#nh-ui *{pointer-events:auto}
#nh-ui .pass,#nh-ui .pass *{pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none!important}
.layer>*{pointer-events:auto}
button{font-family:var(--font-display);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font-body)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:rgba(27,16,50,.25);border-radius:12px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--grape),var(--pink));border-radius:12px;border:3px solid rgba(27,16,50,.4)}
*{scrollbar-color:var(--grape) rgba(27,16,50,.25)}
.hidden{display:none!important}
.display{font-family:var(--font-display);letter-spacing:.5px}
.outline-text{-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:20px;padding:12px 22px;border-radius:var(--r-sm);
background:var(--c,var(--pink));color:#fff;border:var(--o) solid var(--ink);box-shadow:var(--shadow);text-shadow:0 2px 0 rgba(27,16,50,.45);
transition:transform .18s var(--spring),box-shadow .12s,filter .15s;white-space:nowrap;overflow:hidden;isolation:isolate}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:5px;height:38%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.08));z-index:-1;pointer-events:none}
.btn::after{content:"";position:absolute;top:-60%;left:-40%;width:30%;height:220%;background:rgba(255,255,255,.35);transform:rotate(25deg) translateX(-200%);transition:transform .6s;pointer-events:none}
.btn:hover{transform:translateY(-3px) scale(1.04) rotate(-1deg);filter:brightness(1.08)}
.btn:hover::after{transform:rotate(25deg) translateX(600%)}
.btn:active{transform:translateY(4px) scale(.94,.9);box-shadow:0 1px 0 var(--ink)}
.btn:disabled,.btn.disabled{filter:grayscale(.85) brightness(.8);cursor:not-allowed;transform:none!important}
.btn.big{font-size:30px;padding:18px 30px;border-radius:var(--r);min-width:310px;box-shadow:0 8px 0 var(--ink)}
.btn.sm{font-size:16px;padding:8px 14px;border-radius:14px;box-shadow:var(--shadow-sm)}
.btn.xs{font-size:13px;padding:5px 10px;border-radius:11px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
.btn.pink{--c:var(--pink)}.btn.blue{--c:var(--blue)}.btn.yellow{--c:var(--yellow);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.btn.lime{--c:var(--lime);color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.5)}.btn.grape{--c:var(--grape)}.btn.orange{--c:var(--orange)}.btn.ink{--c:#3a2a63}.btn.white{--c:#fff;color:var(--ink);text-shadow:none}
.btn .ico{font-size:1.15em;filter:drop-shadow(0 2px 0 rgba(27,16,50,.5))}
.iconbtn{width:46px;height:46px;border-radius:14px;padding:0;font-size:22px}
.panel{background:linear-gradient(160deg,#fff 0%,var(--paper) 100%);color:var(--ink);border:var(--o) solid var(--ink);border-radius:var(--r-lg);box-shadow:0 10px 0 var(--ink),0 18px 40px rgba(0,0,0,.35);position:relative}
.panel.dark{background:linear-gradient(160deg,#3a2470,#24164a);color:#fff}
.panel-title{font-family:var(--font-display);font-size:34px;text-align:center;padding:10px 0 4px;color:var(--ink)}
.panel.dark .panel-title{color:#fff}
.ribbon{position:relative;display:inline-block;font-family:var(--font-display);font-size:28px;padding:8px 34px;background:var(--c,var(--pink));color:#fff;border:var(--o) solid var(--ink);border-radius:14px;box-shadow:var(--shadow-sm);text-shadow:0 3px 0 var(--ink);transform:rotate(-2deg)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:10px;width:24px;height:100%;background:var(--c,var(--pink));filter:brightness(.75);border:var(--o) solid var(--ink);z-index:-1}
.ribbon::before{left:-18px;border-radius:8px 0 0 8px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}.ribbon::after{right:-18px;border-radius:0 8px 8px 0;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-size:13px;padding:2px 9px;border-radius:999px;border:3px solid var(--ink);background:var(--c,var(--yellow));color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(27,16,50,.08);font-weight:600;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-display);font-size:16px;color:var(--ink);opacity:.85}
.panel.dark .field label{color:#fff}
.input{font-size:20px;font-weight:600;padding:10px 16px;border-radius:16px;border:var(--o) solid var(--ink);background:#fff;color:var(--ink);box-shadow:inset 0 4px 0 rgba(27,16,50,.12);outline:none;transition:transform .2s var(--spring),box-shadow .2s}
.input:focus{box-shadow:inset 0 4px 0 rgba(27,16,50,.12),0 0 0 4px var(--yellow)}
.input.bad{border-color:#e0144f;animation:shake .45s}
.input.good{box-shadow:inset 0 4px 0 rgba(27,16,50,.12),0 0 0 4px var(--lime)}
select.input{appearance:none;-webkit-appearance:none;padding-right:42px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><path d='M4 8l7 7 7-7' stroke='%231B1032' stroke-width='4' fill='none' stroke-linecap='round'/></svg>") no-repeat right 12px center;cursor:pointer}
.hint{font-size:14px;font-weight:600;min-height:18px}.hint.bad{color:#e0144f}.hint.good{color:#2a9d18}
input[type=range].slider{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:999px;background:linear-gradient(90deg,var(--pink) var(--p,50%),#e8dff5 var(--p,50%));border:3px solid var(--ink);outline:none;cursor:pointer}
input[type=range].slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .15s var(--spring)}
input[type=range].slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range].slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink)}
.switch{position:relative;width:64px;height:34px;flex:none;border-radius:999px;border:3px solid var(--ink);background:#d9cfe8;cursor:pointer;transition:background .2s;box-shadow:inset 0 3px 0 rgba(0,0,0,.15)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:transform .25s var(--spring)}
.switch.on{background:var(--lime)}.switch.on::after{transform:translateX(30px)}
.switch{box-sizing:border-box}
.seg{display:inline-flex;max-width:100%;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--ink);background:#fff;gap:0}
.seg button{font-size:15px;padding:7px 12px;background:#fff;color:var(--ink);transition:background .15s;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--yellow);box-shadow:2px 0 0 var(--yellow)}.seg button:hover{background:#fff1b8}.seg button.on:hover{background:var(--yellow)}
#toasts{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;z-index:60;pointer-events:none!important}
.toast{font-family:var(--font-display);font-size:20px;padding:10px 20px;border-radius:18px;border:var(--o) solid var(--ink);background:var(--c,#fff);color:var(--ink);box-shadow:var(--shadow-sm);animation:toastIn .5s var(--spring) both;display:flex;align-items:center;gap:10px;max-width:80vw}
.toast.out{animation:toastOut .35s ease-in both}.toast.error{--c:#ffd0dc}.toast.good{--c:#d9ffcc}.toast.gold{--c:var(--yellow)}.toast.admin{--c:linear-gradient(90deg,var(--grape),var(--pink));color:#fff;text-shadow:0 2px 0 var(--ink)}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:80;background:radial-gradient(circle at 50% 40%,#5a2fb8 0%,#2a1460 55%,#140a2e 100%)}
#loading .stripes{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.04) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite}
.load-bar{width:min(520px,70vw);height:30px;border-radius:999px;border:var(--o) solid var(--ink);background:#2a1b4d;overflow:hidden;box-shadow:var(--shadow-sm);position:relative}
.load-bar>i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 18px,#ff6aa6 18px 36px);transition:width .5s var(--spring);animation:barScroll .8s linear infinite;border-right:var(--o) solid var(--ink)}
.load-tip{font-size:19px;font-weight:600;max-width:600px;text-align:center;opacity:.95;min-height:50px;text-shadow:0 2px 0 var(--ink)}
.load-status{font-family:var(--font-display);font-size:18px;color:var(--yellow)}
.bean-loader{width:90px;height:110px;position:relative;animation:beanHop .7s var(--spring) infinite alternate}
.bean-loader i{position:absolute;inset:0;border-radius:45px;background:var(--pink);border:var(--o) solid var(--ink);box-shadow:inset -10px -8px 0 rgba(0,0,0,.12),inset 10px 10px 0 rgba(255,255,255,.35)}
.bean-loader b{position:absolute;top:28px;width:20px;height:24px;background:#fff;border:3px solid var(--ink);border-radius:50%}
.bean-loader b::after{content:"";position:absolute;width:9px;height:10px;background:var(--ink);border-radius:50%;left:4px;top:6px}
.bean-loader b:nth-of-type(1){left:20px}.bean-loader b:nth-of-type(2){right:20px}
#fade{position:absolute;inset:0;background:radial-gradient(circle,#fff 0%,#ffd9ec 60%,#c6a8ff 100%);opacity:0;pointer-events:none!important;transition:opacity .35s;z-index:70}
#fade.on{opacity:1}
#bgfade{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#7b3ff2 0%,#2a1460 60%,#140a2e 100%);opacity:0;transition:opacity .4s ease;pointer-events:none!important}
#bgfade.on{opacity:1}
@keyframes wiggle{0%{transform:translateY(-3px) scale(1.04) rotate(0)}25%{transform:translateY(-3px) scale(1.04) rotate(-2.5deg)}55%{transform:translateY(-3px) scale(1.04) rotate(2deg)}100%{transform:translateY(-3px) scale(1.04) rotate(-1deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes toastIn{0%{transform:translateY(-40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-30px) scale(.7);opacity:0}}
@keyframes popIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes popInUp{0%{transform:translateY(60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideL{0%{transform:translateX(-120px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideR{0%{transform:translateX(120px);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes barScroll{to{background-position:51px 0}}
@keyframes beanHop{0%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(-34px) scale(.94,1.06)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.stagger>*{animation:popInUp .55s var(--spring) backwards}
.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.11s}.stagger>*:nth-child(3){animation-delay:.17s}.stagger>*:nth-child(4){animation-delay:.23s}.stagger>*:nth-child(5){animation-delay:.29s}.stagger>*:nth-child(6){animation-delay:.35s}.stagger>*:nth-child(7){animation-delay:.41s}.stagger>*:nth-child(8){animation-delay:.47s}.stagger>*:nth-child(9){animation-delay:.53s}.stagger>*:nth-child(10){animation-delay:.59s}
.bob{animation:bob 2.6s ease-in-out infinite}
.screen{position:absolute;inset:0;display:flex;pointer-events:none!important}
.screen>*{pointer-events:auto}
.screen.enter .panel{animation:popIn .5s var(--spring) backwards}
.modal-back{position:absolute;inset:0;background:rgba(20,8,40,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{min-width:380px;max-width:min(680px,92vw);padding:26px 30px;animation:popIn .45s var(--spring) both}
.modal p{font-size:18px;font-weight:500;text-align:center;margin:10px 0 18px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.center{justify-content:center}.wrap{flex-wrap:wrap}.grow{flex:1}.spread{justify-content:space-between}
.fatal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#5a2fb8,#140a2e);z-index:99}
.fatal .panel{max-width:560px;padding:30px;text-align:center}
.fatal h1{font-family:var(--font-display);font-size:36px;margin-bottom:12px}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0 0 18%,var(--yellow) 22% 60%,#e0a800 64%);border:3px solid var(--ink);vertical-align:-0.15em;box-shadow:0 2px 0 var(--ink)}
.flycoin{position:absolute;width:26px;height:26px;z-index:90;pointer-events:none!important;transition:transform .8s cubic-bezier(.5,-0.4,.6,1),opacity .8s}
.kbd{display:inline-block;min-width:28px;text-align:center;font-family:var(--font-display);font-size:14px;padding:3px 8px;border-radius:9px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:.82;filter:drop-shadow(0 8px 0 var(--ink))}
.logo-word{display:flex;font-family:var(--font-display);font-size:78px;letter-spacing:1px}
.logo.big .logo-word{font-size:96px}
.logo-word span{display:inline-block;color:var(--c);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,255,255,.25);animation:logoBob 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.12s);position:relative}
.logo-word span::after{content:"";position:absolute;left:18%;top:14%;width:28%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-20deg)}
.logo-word.w1 span{--c:var(--yellow)}.logo-word.w1 span:nth-child(odd){--c:#FFB13D}
.logo-word.w2 span{--c:var(--pink)}.logo-word.w2 span:nth-child(3n){--c:var(--blue)}.logo-word.w2 span:nth-child(3n+1){--c:var(--lime)}
.logo-word.w2{margin-left:34px;margin-top:-4px}
.logo-sub{font-family:var(--font-display);font-size:20px;color:#fff;background:var(--grape);border:4px solid var(--ink);border-radius:12px;padding:3px 14px;margin:10px 0 0 120px;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink);letter-spacing:2px}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-8px) rotate(3deg) scale(1.04,.97)}}
.menu-screen{padding:3.2vh 3vw;gap:3vw;align-items:stretch;background:linear-gradient(90deg,rgba(27,16,50,.55) 0%,rgba(27,16,50,.12) 45%,rgba(27,16,50,0) 60%,rgba(27,16,50,.35) 100%)}

.profile-card{padding:16px 18px}

.level-badge b{font-size:28px}.level-badge span{font-size:12px}
.xp-wrap{padding:0 12px}.xp-bar{height:18px;border-radius:999px;border:3px solid var(--ink);background:#eadff7;overflow:hidden}.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#c4ff4f);border-right:3px solid var(--ink);transition:width .8s var(--spring)}

.srv-ico{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--grape);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}

{ title: 'THROW', text: () => 'Now hold <span class="kbd">LMB</span> to charge and release to YEET! Release in the green shimmer for a perfect throw.', check: (t, f) => f.stats.throws > t.throws0 },

UI.tutorial = {
start(s) {
this.s = s; this.i = 0; this.done = false;
const el = this.el = UI.el('div', { class: 'tut-box' });
UI.layers.hud.appendChild(el);
this.go(0);
NH.events.on('round', () => this.stop());
},
go(i) {

this.t = { dist: 0, jumps: 0, since: 0, last: f ? f.pos.clone() : null, wasG: true, throws0: f ? f.stats.throws : 0, hits: new Set(), hit(kind) { return this.hits.has(kind); } };

const sk = this.el.querySelector('.tut-skip'); if (sk) sk.onclick = () => this.next();

const ag = this.el.querySelector('.tut-again'); if (ag) ag.onclick = () => { this.el.remove(); this.el = null; };
if (st.start) st.start(this.s);
if (st.final && !NH.core.Save.kvGet('tutDone', false)) { NH.core.Save.kvSet('tutDone', true); NH.shop.Economy.addCoins(100, 'Tutorial complete!'); }
this.el.classList.remove('ok'); void this.el.offsetWidth; this.el.classList.add('ok');
},
next() { NH.audio.ui('unlock'); if (this.i < STEPS.length - 1) this.go(this.i + 1); },
stop() { if (this.el) this.el.remove(); this.el = null; this.s = null; },
frame(dt) {
if (!this.el || !this.s || !this.s.match) return;
const f = this.s.match.localFighter; if (!f || !f.alive) return;
const t = this.t, st = STEPS[this.i];
t.since += dt;
if (t.last) { t.dist += Math.hypot(f.pos.x - t.last.x, f.pos.z - t.last.z); t.last.copyFrom(f.pos); } else t.last = f.pos.clone();

for (const o of this.s.match.fighters) for (const a of o.lastAttackers) if (a.id === f.id && a.t > this.s.match.time - 0.5) t.hits.add(a.kind);

}

if (errShown[msg]) return; errShown[msg] = 1;
setTimeout(() => { errShown[msg] = 0; }, 8000);

};

window.addEventListener('unhandledrejection', (ev) => { NH.core.reportError(ev.reason || ev); ev.preventDefault(); });

setTimeout(() => {

NH.shop && NH.shop.Economy && NH.shop.Economy.onBoot();

if (showFade) setTimeout(() => NH.ui.bgFade && NH.ui.bgFade(false), 150);
};
App.stopMenuBackground = function () { NH.ui.bgFade && NH.ui.bgFade(false); if (App.menuSession) { App.menuSession.dispose(); App.menuSession = null; } };
App.startSolo = async function (cfg) {
NH.ui.fade(true);
await new Promise(r => setTimeout(r, 300));
App.stopMenuBackground();
NH.audio.sfxEnabled = true;
const save = NH.core.Save.data;
const s = new NH.core.Session({ kind: 'solo', settings: cfg });
App.session = s;
s.addPlayer({ pid: save.playerId, name: save.username, cos: save.cosmetics, isLocal: true, admin: NH.admin.isUnlocked && NH.admin.isUnlocked(), title: save.cosmetics.title });
for (let i = 0; i < (cfg.bots || 5); i++) s.addBot({ diff: cfg.botDiff });
if (cfg.teams) { /* teams balanced in startRound */ }
NH.ui.show('hud');
await s.startRound();
NH.ui.fade(false);
};
App.startTutorial = async function () {
NH.ui.fade(true);
await new Promise(r => setTimeout(r, 300));
App.stopMenuBackground();
NH.audio.sfxEnabled = true;
const save = NH.core.Save.data;
const s = new NH.core.Session({ kind: 'tutorial', settings: { mode: 'rumble', koRule: 'respawn', roundTime: 99999, hazardFreq: 0, props: true } });
App.session = s;
s.addPlayer({ pid: save.playerId, name: save.username, cos: save.cosmetics, isLocal: true });
for (let i = 0; i < 3; i++) { const b = s.addBot({ diff: 'chill' }); b.bot.passive = true; }
NH.ui.show('hud');
await s.startRound({ map: 'yard', mode: 'rumble' });
NH.ui.tutorial && NH.ui.tutorial.start(s);
NH.ui.fade(false);
};
App.leaveToMenu = async function () {
NH.ui.fade(true);
await new Promise(r => setTimeout(r, 300));
NH.core.Input.unlock();
if (NH.net && NH.net.leave) NH.net.leave();
if (App.session) { App.session.dispose(); App.session = null; }
App.clock.timeScale = 1; App.slowT = 0; App.stopT = 0;
NH.core.Config.reset();
await App.startMenuBackground();
NH.ui.show('menu');
NH.ui.fade(false);
};
})();

/* core/Boot.js */
/* Boot: start the game once the DOM is ready. */
(function () {
'use strict';
const go = () => { try { window.NH.core.App.boot(); } catch (e) { console.warn(e); } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();

</script>
