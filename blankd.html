  $('#view-game').innerHTML = `<div class="game">
    ${stepsHTML()}
    <div class="prompt-card ${fresh ? 'pop' : ''}">
      <div class="pc-label"><span>Blank'd</span><span>${roundText()}</span></div>
      <div class="pc-text" id="pc-text">${fillHTML(S.prompt, promptFill)}</div>
      <div class="pc-foot"><span>${foot}</span><span>${S.phase === 'pick' ? 'Hover a card to preview' : ''}</span></div>
    </div>
    <div class="instr">${instr}</div>
    ${area}
  </div>`;
}

// ---------- game over ----------
function renderOver() {
  if (!changed('over', [S.over, isHost(), S.disconnected])) return;
  const o = S.over || { standings: [], winners: [], reason: '' };
  const st = o.standings || [];
  const pod = [st[1], st[0], st[2]];
  const cls = ['p2', 'p1', 'p3'], medal = ['🥈', '🥇', '🥉'];
  $('#view-over').innerHTML = `<div class="over">
    <div class="over-title">GAME OVER</div>
    <div class="muted over-reason">${esc(o.reason || '')}</div>
    <div class="podium">${pod.map((p, i) => p ? `<div class="pod ${cls[i]}">
      ${avatarHTML(p.name, p.bot)}<div class="pod-name">${esc(p.name)}</div><div class="pod-score">${p.score} pts</div>
      <div class="pod-bar">${medal[i]}</div></div>` : '<div class="pod empty-pod"></div>').join('')}</div>
    <div class="winner-line">🏆 ${esc((o.winners || []).join(' & ') || '—')} ${(o.winners || []).length > 1 ? 'tie' : 'wins'} with <b>${o.top || 0}</b> point${o.top === 1 ? '' : 's'}${o.rounds ? ` after ${o.rounds} round${o.rounds > 1 ? 's' : ''}` : ''}!</div>
    <div class="panel standings"><table>
      <thead><tr><th>#</th><th>Player</th><th>Points</th></tr></thead>
      <tbody>${st.map((p, i) => `<tr class="${p.id === S.you ? 'me' : ''}"><td>${i + 1}</td><td>${esc(p.name)} ${p.bot ? '🤖' : ''}${p.id === S.you ? ' <span class="tag you">YOU</span>' : ''}</td><td>${p.score}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="over-actions">
      ${isHost() && !S.disconnected ? `<button class="btn primary" data-act="to-lobby">↺ Play again (back to waiting room)</button>` : ''}
      ${!isHost() && !S.disconnected ? `<div class="waiting"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Waiting for the host…</div>` : ''}
      <button class="btn ${S.disconnected ? 'primary' : 'ghost'}" data-act="leave">${S.disconnected ? 'Back to menu' : 'Leave room'}</button>
    </div>
  </div>`;
}

// ---------- timer (rAF) ----------
const ARC_LEN = 2 * Math.PI * 19;
function tick() {
  requestAnimationFrame(tick);
  if (!S) return;
  const el = $('#timer'), arc = $('#timer-arc'), num = $('#timer-num');
  const active = UI.dur > 0 && ['pick', 'reveal', 'vote', 'results'].includes(S.phase) && !S.disconnected;
  if (!active) {
    if (!el.classList.contains('idle')) { el.classList.add('idle'); el.classList.remove('warn'); num.textContent = '--'; arc.style.strokeDashoffset = 0; }
    return;
  }
  el.classList.remove('idle');
  const left = Math.max(0, UI.localEnd - performance.now());
  const secs = Math.ceil(left / 1000);
  num.textContent = secs;
  arc.style.strokeDashoffset = ARC_LEN * (1 - Math.min(1, left / UI.dur));
  const warn = secs <= 5 && S.phase !== 'results';
  el.classList.toggle('warn', warn);
  if (secs !== UI.lastTickSec) { UI.lastTickSec = secs; if (warn && secs > 0) SFX.tick(); }
}

// ---------- chat ----------
function renderChatTargets() {
  const others = S.players.filter(p => p.id !== S.you);
  if (!changed('chatTo', others.map(p => [p.id, p.name]))) return;
  const sel = $('#chat-to'), cur = sel.value;
  sel.innerHTML = '<option value="">💬 Everyone</option>' + others.map(p => `<option value="${esc(p.id)}">🔒 Whisper to ${esc(p.name)}${p.bot ? ' 🤖' : ''}</option>`).join('');
  sel.value = others.some(p => p.id === cur) ? cur : '';
}
function addChat(m) {
  if (!m || UI.chatIds.has(m.id)) return;
  UI.chatIds.add(m.id);
  const log = $('#chat-log');
  const el = document.createElement('div');
  const mine = m.from && m.from === NET.myId;
  if (m.sys) { el.className = 'msg sys'; el.textContent = m.text; }
  else {
    el.className = 'msg' + (mine ? ' mine' : '') + (m.to ? ' whisper' : '');
    const head = m.to ? (mine ? `🔒 you → ${esc(m.toName)}` : `🔒 ${esc(m.name)} → you`) : esc(m.name);
    el.innerHTML = `<div class="msg-head"><span class="msg-name" style="color:hsl(${hueOf(m.name)} 80% var(--name-l))" data-act="whisper" data-id="${esc(mine ? (m.to || '') : m.from)}">${head}</span><span class="msg-time">${fmtTime(m.ts)}</span></div><div class="msg-text">${esc(m.text)}</div>`;
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(el);
  while (log.children.length > 200) log.firstChild.remove();
  if (atBottom || mine) log.scrollTop = log.scrollHeight;
  if (!m.sys && !mine) {
    SFX.msg();
    if (!UI.chatOpen && getComputedStyle($('#btn-chat-toggle')).display !== 'none') {
      UI.unread++; const b = $('#chat-badge'); b.textContent = UI.unread > 9 ? '9+' : UI.unread; b.classList.remove('hidden');
    }
  }
}
function setChatOpen(open) {
  UI.chatOpen = open;
  $('#chat-panel').classList.toggle('open', open);
  if (open) { UI.unread = 0; $('#chat-badge').classList.add('hidden'); setTimeout(() => $('#chat-in').focus(), 50); }
}
function whisperTo(id) {
  if (!S || !id || id === S.you || !S.players.some(p => p.id === id)) return;
  $('#chat-to').value = id;
  if (getComputedStyle($('#btn-chat-toggle')).display !== 'none') setChatOpen(true);
  $('#chat-in').focus();
}

// ---------- screens ----------
function showScreen(id) { $$('.screen').forEach(s => s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
function resetRoomUI() {
  UI.sig = {}; UI.chatIds = new Set(); UI.unread = 0; UI.localEnd = 0; UI.dur = 0;
  $('#chat-log').innerHTML = ''; $('#chat-badge').classList.add('hidden');
  ['lobby', 'game', 'over'].forEach(v => { $('#view-' + v).innerHTML = ''; $('#view-' + v).classList.remove('active'); });
  $('#player-list').innerHTML = ''; $('#room-title').textContent = 'Connecting…'; $('#room-sub').textContent = '';
  setChatOpen(false);
}
function enterRoom() {
  NET.mode = 'room';
  S = null; resetRoomUI(); showScreen('room');
}
function goHome() {
  hideConnecting();
  S = null; NET.mode = 'home'; NET.conn = null; NET.hosting = false;
  if (H) hDestroy();
  showScreen('home'); applyTheme();
  initHomePeer(); renderRoomList();
}

// ---------- home: room list ----------
function renderRoomList() {
  const el = $('#room-list'); if (!el) return;
  if (!peerAvailable()) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">📡</div>Multiplayer is unavailable — PeerJS couldn't load.<br>Quick Play vs Bots still works!</div>`;
    return;
  }
  const rooms = [...NET.found.values()].sort((a, b) => (a.phase === 'lobby' ? 0 : 1) - (b.phase === 'lobby' ? 0 : 1) || b.players - a.players);
  $('#room-count').textContent = rooms.length ? `${rooms.length} found` : '';
  if (!rooms.length) {
    el.innerHTML = `<div class="empty"><div class="radar"><i></i></div>${NET.ready ? (NET.scanning ? 'Scanning for public rooms…' : 'No public rooms right now.<br><b>Create one</b> and others will see it here!') : 'Connecting to the network…'}</div>`;
    return;
  }
  el.innerHTML = rooms.map(r => {
    const full = r.players >= r.max;
    const status = r.phase === 'lobby' ? '<span class="st wait">● Waiting</span>' : r.phase === 'over' ? '<span class="st over">● Game over</span>' : `<span class="st live">● Round ${r.round}/${r.rounds || '∞'}</span>`;
    return `<div class="room-item">
      <div class="ri-icon">${esc((r.name || '?').charAt(0).toUpperCase())}</div>
      <div class="ri-main"><div class="ri-name">${esc(r.name)}</div>
        <div class="ri-meta">${status}<span>👑 ${esc(r.host)}</span><span>👥 ${r.players}/${r.max}</span><span>🎨 ${esc(themeName(r.theme))}</span><span>🃏 ${r.rounds ? r.rounds + ' rds' : 'Endless'}</span></div></div>
      <button class="btn ${full ? '' : 'primary'} sm" data-act="join-public" data-id="${esc(r.id)}" data-name="${esc(r.name)}" ${full ? 'disabled' : ''}>${full ? 'Full' : 'Join'}</button>
    </div>`;
  }).join('');
}

// ---------- modals ----------
function openSettings() {
  const themeChip = (id, label) => `<button class="theme-chip ${prefs.theme === id ? 'on' : ''}" data-theme-pick="${id}">
    ${id === 'room' ? '<span class="swatch room-sw">🏠</span>' : `<span class="swatch" data-theme="${id}"><i></i><i></i><i></i></span>`}<span>${esc(label)}</span></button>`;
  const inRoom = !!S;
  modal(`<h3 class="modal-h">⚙ Settings</h3>
    <div class="set-sec"><div class="set-label">Theme ${inRoom ? `<span class="muted">· room theme is <b>${esc(themeName(S.settings.theme))}</b></span>` : ''}</div>
      <div class="theme-grid">${themeChip('room', inRoom ? 'Use room theme' : 'Room theme (follow host)')}${THEMES.map(t => themeChip(t[0], t[1])).join('')}</div>
      <div class="hint">Your choice overrides the host's room theme on your screen only.</div></div>
    <div class="set-sec set-toggles">
      <label class="switch"><input type="checkbox" id="set-sound" ${prefs.sound ? 'checked' : ''}><span></span> Sound effects</label>
      <label class="switch"><input type="checkbox" id="set-motion" ${prefs.motion ? 'checked' : ''}><span></span> Animations & confetti</label>
    </div>
    <div class="modal-actions"><button class="btn primary" data-close>Done</button></div>`, {
    wide: true,
    onMount: w => {
      w.addEventListener('click', e => {
        const b = e.target.closest('[data-theme-pick]'); if (!b) return;
        prefs.theme = b.dataset.themePick; savePrefs(); applyTheme(); SFX.click();
        w.querySelectorAll('.theme-chip').forEach(c => c.classList.toggle('on', c === b));
      });
      w.querySelector('#set-sound').onchange = e => { prefs.sound = e.target.checked; savePrefs(); SFX.click(); };
      w.querySelector('#set-motion').onchange = e => { prefs.motion = e.target.checked; savePrefs(); applyMotion(); };
    }
  });
}
function openHowTo() {
  modal(`<h3 class="modal-h">How to play Blank'd</h3>
    <ol class="howto">
      <li><b>Join or create a room.</b> Public rooms appear in the room browser; private rooms need their 8-character code. At least ${MIN_PLAYERS} players are needed — bots count!</li>
      <li><b>A prompt card is revealed</b> with a blank in it. Everyone holds a hand of answer cards (8 by default).</li>
      <li><b>Pick (20s):</b> tap the card from your hand that fills the blank in the funniest way. Out of time? A random card gets played for you.</li>
      <li><b>Inspect (10s):</b> every filled-in sentence is shown anonymously. Read them all!</li>
      <li><b>Vote (15s):</b> vote for your favorite. You can't vote for your own.</li>
      <li><b>Score:</b> 1 point per vote, plus a 1-point bonus for the round's top answer. Highest score after the last round wins — or in Endless mode, when the host ends the game.</li>
    </ol>
    <p class="hint">Tips: press keys <b>1–9</b> to pick or vote quickly. Click a player's name to whisper to them privately.</p>
    <div class="modal-actions"><button class="btn primary" data-close>Got it</button></div>`);
}
function requireName() {
  const n = ($('#in-name').value || '');
  const e = validateName(n);
  if (e) { toast(e, 'bad'); $('#in-name').focus(); $('#in-name').classList.add('shake'); setTimeout(() => $('#in-name').classList.remove('shake'), 500); return null; }
  prefs.name = n; savePrefs();
  return n;
}
function updateNameHint() {
  const n = $('#in-name').value, e = n ? validateName(n) : '';
  const h = $('#name-hint');
  h.textContent = e || (n ? '✓ Looks good' : '3–25 characters, no spaces');
  h.className = 'hint ' + (e ? 'bad' : n ? 'good' : '');
  $('#name-count').textContent = `${n.length}/25`;
}

/* ===== 06_boot.js ===== */
// ============================================================
//  BOOT — wire up DOM events and start
// ============================================================
function boot() {
  applyTheme(); applyMotion();

  // ----- home -----
  const nameIn = $('#in-name');
  nameIn.value = prefs.name || '';
  nameIn.addEventListener('input', () => { prefs.name = nameIn.value; savePrefs(); updateNameHint(); });
  nameIn.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); toast('Spaces aren\'t allowed in usernames — try _ or -', 'warn', 2200); } });
  updateNameHint();

  const setVis = v => { prefs.vis = v; savePrefs(); $$('#seg-vis button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); $('#vis-hint').textContent = v === 'public' ? 'Anyone can find and join from the room list.' : 'Only people with your 8-character code can join.'; };
  $$('#seg-vis button').forEach(b => b.addEventListener('click', () => { setVis(b.dataset.v); SFX.click(); }));
  setVis(prefs.vis === 'private' ? 'private' : 'public');

  $('#btn-create').addEventListener('click', () => createRoom(prefs.vis !== 'private'));
  $('#btn-solo').addEventListener('click', () => createRoom(false, { offline: true }));
  $('#btn-join').addEventListener('click', () => joinByCode($('#in-code').value));
  $('#in-code').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 8); });
  $('#in-code').addEventListener('keydown', e => { if (e.key === 'Enter') joinByCode(e.target.value); });
  $('#btn-refresh').addEventListener('click', () => { if (!NET.ready) initHomePeer(); else scanRooms(true); SFX.click(); });
  $('#btn-settings-home').addEventListener('click', openSettings);
  $('#btn-howto').addEventListener('click', openHowTo);

  // ----- room top bar -----
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-leave').addEventListener('click', () => leaveRoom(S && S.disconnected));
  $('#btn-end').addEventListener('click', async () => { if (await confirmBox('End the game now and show the final standings?', 'End game')) send({ t: 'end' }); });
  $('#btn-chat-toggle').addEventListener('click', () => setChatOpen(!UI.chatOpen));
  $('#btn-chat-close').addEventListener('click', () => setChatOpen(false));

  // ----- chat -----
  $('#chat-form').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('#chat-in'), text = inp.value.trim();
    if (!text || !S) return;
    if (S.disconnected) { toast('You are no longer connected to the room.', 'warn'); return; }
    send({ t: 'chat', text, to: $('#chat-to').value || null });
    inp.value = '';
  });

  // ----- delegated clicks -----
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case 'join-public': joinRoom(el.dataset.id, '"' + (el.dataset.name || 'room') + '"', false); break;
      case 'pick': {
        if (!S || S.phase !== 'pick' || S.disconnected) return;
        const c = S.hand[+el.dataset.i]; if (c == null) return;
        send({ t: 'pick', card: c }); SFX.pick(); break;
      }
      case 'vote': if (S && S.phase === 'vote' && !S.disconnected) { send({ t: 'vote', sid: el.dataset.sid }); SFX.vote(); } break;
      case 'kick': {
        const p = S && S.players.find(x => x.id === el.dataset.id); if (!p) return;
        if (p.bot) send({ t: 'kick', id: p.id });
        else confirmBox(`Kick ${p.name} from the room?`, 'Kick').then(ok => ok && send({ t: 'kick', id: p.id }));
        break;
      }
      case 'whisper': whisperTo(el.dataset.id); break;
      case 'copy-code': if (S && S.code) copyText(S.code, 'Room code copied!'); break;
      case 'copy-link': copyText(el.dataset.link, 'Invite link copied!'); break;
      case 'start': send({ t: 'start' }); SFX.click(); break;
      case 'add-bot': send({ t: 'addBot' }); SFX.click(); break;
      case 'fill-bots': send({ t: 'fillBots' }); SFX.click(); break;
      case 'remove-bots': send({ t: 'removeBots' }); SFX.click(); break;
      case 'to-lobby': send({ t: 'lobby' }); break;
      case 'leave': leaveRoom(S && S.disconnected); break;
    }
  });

  // lobby settings (host)
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.matches('[data-set]') && isHost()) {
      const k = el.dataset.set;
      send({ t: 'settings', s: { [k]: el.type === 'checkbox' ? el.checked : (k === 'theme' ? el.value : +el.value) } });
    } else if (el.matches('[data-room-name]') && isHost()) {
      const v = el.value.trim();
      if (v) send({ t: 'roomName', name: v }); else el.value = S.roomName;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('[data-room-name]') && e.key === 'Enter') e.target.blur();
  });

  // hover preview of hand cards on the prompt
  document.addEventListener('mouseover', e => {
    if (!S || S.phase !== 'pick') return;
    const card = e.target.closest('.answer-card'); const pc = $('#pc-text'); if (!pc) return;
    const c = card ? S.hand[+card.dataset.i] : S.mySub;
    const key = card ? 'h' + card.dataset.i : 'm';
    if (pc.dataset.k === key) return;
    pc.dataset.k = key;
    pc.innerHTML = fillHTML(S.prompt, c == null ? null : c);
    pc.classList.toggle('previewing', !!card && c !== S.mySub);
  });

  // keyboard shortcuts 1–9
  document.addEventListener('keydown', e => {
    if (!S || S.disconnected || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'Escape' && UI.chatOpen) { setChatOpen(false); return; }
    const k = parseInt(e.key, 10); if (!(k >= 1 && k <= 9)) return;
    if (S.phase === 'pick' && S.hand[k - 1] != null) { send({ t: 'pick', card: S.hand[k - 1] }); SFX.pick(); }
    else if (S.phase === 'vote') { const s = S.subs.filter(x => !x.mine)[k - 1]; if (s) { send({ t: 'vote', sid: s.sid }); SFX.vote(); } }
  });

  // invite links: #join=CODE or ?room=CODE
  const m = (location.hash.match(/join=([A-Za-z0-9]{8})/) || location.search.match(/room=([A-Za-z0-9]{8})/));
  if (m) { autoJoinCode = m[1]; $('#in-code').value = m[1]; history.replaceState(null, '', location.pathname); }

  // periodic public-room refresh
  setInterval(() => { if (NET.mode === 'home' && !document.hidden) { if (NET.ready) scanRooms(); } }, 9000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && NET.mode === 'home') scanRooms(true); });

  requestAnimationFrame(tick);
  initHomePeer();
  renderRoomList();
  if (!peerAvailable() && autoJoinCode) toast('Multiplayer is unavailable right now (PeerJS failed to load).', 'bad', 5000);
}
boot();

})();
</script>
</body>
</html>
