/* ================================================================
   BASE
   ================================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(15px * var(--fscale,1));height:100%}
body{min-height:100%;font-family:var(--font);color:var(--text);background:var(--page-bg);background-attachment:fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.35}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgfx::before,#bgfx::after{content:'';position:absolute}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:var(--text);background:var(--input-bg);border:var(--bw,1px) solid var(--border);border-radius:var(--radius-sm);padding:.6rem .75rem;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select{cursor:pointer}
select:disabled,input:disabled{opacity:.7;cursor:default}
select option{background:var(--bg2);color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.screen{display:none;min-height:100vh}
.screen.active{display:flex}
.hint{font-size:.8rem;color:var(--muted);margin-top:.3rem}
.hint.bad{color:var(--bad)}.hint.good{color:var(--good)}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

.panel{position:relative;background:var(--panel);border:var(--bw,1px) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur,0px));-webkit-backdrop-filter:blur(var(--blur,0px));padding:1.1rem}
.panel-title{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.panel-title .muted{letter-spacing:.04em;text-transform:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1rem;border-radius:var(--radius-sm);background:var(--btn2-bg);border:var(--bw,1px) solid var(--border);color:var(--text);font-weight:700;letter-spacing:.04em;text-transform:var(--btn-transform,none);transition:transform .12s,box-shadow .2s,background .2s,filter .2s,border-color .2s;white-space:nowrap;user-select:none;position:relative}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--glow);border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--btn-bg);color:var(--btn-text);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{padding:.38rem .7rem;font-size:.85rem}
.btn.big{padding:.85rem 1.4rem;font-size:1.1rem;width:100%}
.btn.icon{padding:.38rem .62rem}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.pill{font-size:.68rem;padding:.15rem .55rem;border-radius:99px;border:1px solid var(--border);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.chip{font-size:.78rem;padding:.2rem .6rem;border-radius:99px;background:var(--chip);white-space:nowrap}
.vis{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.12em;padding:.12rem .45rem;border-radius:4px;margin-right:.35rem;font-weight:700}
.vis.pub{background:var(--good);color:#04140c}.vis.priv{background:var(--accent2);color:#fff}.vis.off{background:var(--warn);color:#1a1000}
.tag{padding:.05rem .35rem;border-radius:3px;background:var(--chip);font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tag.host{background:var(--accent3);color:#111}.tag.bot{background:var(--accent2);color:#fff}.tag.you{background:var(--accent);color:var(--btn-text)}.tag.auto{background:var(--warn);color:#1a1000;margin-left:.3rem}

.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--bw,1px) solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin:.5rem 0 .2rem}
.seg button{padding:.55rem;font-weight:700;color:var(--muted);transition:.2s;text-transform:var(--btn-transform,none);letter-spacing:.04em}
.seg button.on{background:var(--btn-bg);color:var(--btn-text)}
.switch{display:inline-flex;align-items:center;gap:.55rem;cursor:pointer;font-weight:600;user-select:none}
.switch input{display:none}
.switch span{display:inline-block;width:40px;height:22px;border-radius:11px;background:var(--track);border:1px solid var(--border);position:relative;transition:.2s;flex:none}
.switch span::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:20px;background:var(--btn-text)}
.switch input:disabled+span{opacity:.6}

/* ================================================================
   LOGO + HOME
   ================================================================ */
.logo{font-family:var(--font-display);font-weight:900;line-height:1;letter-spacing:.02em;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(var(--logo-shadow));white-space:nowrap;user-select:none}
.logo .apos{margin:0 .02em}
.logo.big{font-size:clamp(3.4rem,10vw,6.4rem)}
.logo.sm{font-size:1.55rem}
#home{flex-direction:column;align-items:center;padding:2.4rem 1.2rem 1.4rem;gap:1.6rem}
.home-head{text-align:center;animation:fadein .6s}
.tagline{margin-top:.7rem;font-size:1.15rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.blank-inline{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--accent);margin:0 .2em;animation:blankpulse 2s infinite}
.home-grid{display:grid;grid-template-columns:minmax(300px,400px) minmax(320px,660px);gap:1.2rem;width:100%;max-width:1100px;align-items:start}
.profile-panel{display:flex;flex-direction:column;gap:.35rem}
.profile-panel .panel-title:not(:first-child){margin-top:1rem}
.label-row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:.5rem}
.row input{flex:1}
#in-code{font-family:var(--font-mono);letter-spacing:.2em;text-align:center}
.rooms-panel{min-height:420px;display:flex;flex-direction:column}
.rooms-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem}
.rooms-head .panel-title{margin:0;flex:1}
.room-list{display:flex;flex-direction:column;gap:.55rem;overflow:auto;max-height:520px;flex:1}
.room-item{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.7rem .8rem;background:var(--panel2);border:var(--bw,1px) solid var(--border);border-radius:var(--radius-sm);transition:border-color .2s,box-shadow .2s,transform .15s;animation:fadein .3s}
.room-item:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateX(2px)}
.ri-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:grid;place-items:center;font-weight:900;font-family:var(--font-display);font-size:1.2rem;background:var(--btn-bg);color:var(--btn-text)}
.ri-main{min-width:0}
.ri-name{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-meta{font-size:.8rem;color:var(--muted);display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.15rem}
.st{font-weight:700}.st.wait{color:var(--good)}.st.live{color:var(--warn)}.st.over{color:var(--muted)}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--muted);line-height:1.6}
.empty b{color:var(--accent)}
.empty-ico{font-size:2.2rem;margin-bottom:.4rem}
.radar{width:74px;height:74px;margin:0 auto 1rem;border-radius:50%;border:2px solid var(--border);position:relative;overflow:hidden;background:radial-gradient(circle,transparent 30%,color-mix(in srgb,var(--accent) 8%,transparent) 31%,transparent 33%,transparent 62%,color-mix(in srgb,var(--accent) 8%,transparent) 63%,transparent 65%)}
.radar i{position:absolute;inset:0;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent 25%);animation:spin 2s linear infinite;border-radius:50%}
.home-foot{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.home-foot .ver{font-size:.75rem;color:var(--muted);align-self:center;font-family:var(--font-mono)}

/* ================================================================
   ROOM LAYOUT
   ================================================================ */
#room{flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;background:var(--panel);border-bottom:var(--bw,1px) solid var(--border);backdrop-filter:blur(var(--blur,0px));-webkit-backdrop-filter:blur(var(--blur,0px));position:relative;z-index:5;box-shadow:var(--shadow)}
.room-meta{min-width:0;flex:1}
#room-title{font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#room-sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-inline{color:var(--accent);cursor:pointer;letter-spacing:.12em}
.phase-box{text-align:center;min-width:150px}
#phase-label{font-family:var(--font-display);font-weight:900;letter-spacing:.14em;color:var(--accent);font-size:1rem;text-shadow:var(--glow)}
#round-label{font-size:.76rem;color:var(--muted);font-family:var(--font-mono);letter-spacing:.08em}
.timer{position:relative;width:54px;height:54px;flex:none;transition:opacity .3s}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-bg{fill:none;stroke:var(--track);stroke-width:4}
.t-fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:119.38;transition:stroke .3s;filter:drop-shadow(0 0 4px var(--accent))}
#timer-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.timer.warn .t-fg{stroke:var(--bad);filter:drop-shadow(0 0 5px var(--bad))}
.timer.warn #timer-num{color:var(--bad);animation:pulse .5s infinite alternate}
.timer.idle{opacity:.35}
.top-actions{display:flex;gap:.4rem;align-items:center}
.room-body{flex:1;display:grid;grid-template-columns:272px minmax(0,1fr) 320px;gap:.9rem;padding:.9rem;min-height:0}
.players-panel,.chat-panel{display:flex;flex-direction:column;min-height:0}
#player-list{overflow:auto;display:flex;flex-direction:column;gap:.4rem;padding-right:2px}
#stage{min-height:0;overflow:auto;position:relative;padding:0 .2rem .8rem}
.view{display:none}.view.active{display:block;animation:fadein .35s}

.player{display:flex;align-items:center;gap:.55rem;padding:.45rem .55rem;border-radius:var(--radius-sm);background:var(--panel2);border:var(--bw,1px) solid transparent;transition:.2s;animation:fadein .3s}
.player.me{border-color:var(--accent)}
.p-rank{font-family:var(--font-display);font-weight:900;font-size:.85rem;color:var(--muted);width:16px;text-align:center}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none;font-size:.95rem;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);font-family:var(--font)}
.avatar.xs{width:22px;height:22px;font-size:.7rem}
.p-main{flex:1;min-width:0}
.p-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.p-name:hover{color:var(--accent)}
.p-tags{display:flex;gap:.25rem;margin-top:.1rem}
.p-score{font-family:var(--font);font-weight:800;font-size:1.3rem;color:var(--accent);min-width:1.4em;text-align:right;line-height:1}
.p-status{font-size:.8rem;width:22px;text-align:center}
.p-status.done{color:var(--good);font-weight:900}
.p-status.wait{color:var(--muted);animation:blink 1.2s infinite}
.player{position:relative}
.kick{position:absolute;top:2px;right:2px;opacity:0;font-size:.7rem;padding:0 .3rem;border-radius:4px;background:var(--panel);line-height:1.5;transition:opacity .15s}
.player:hover .kick,.kick:focus{opacity:.8}
.kick:hover{opacity:1!important;color:var(--bad)}
@media (hover:none){.kick{opacity:.6}}

/* chat */
.chat-head{display:flex;align-items:center;justify-content:space-between}
#btn-chat-close{display:none}
#chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.45rem;padding-right:.2rem;min-height:120px}
.msg{background:var(--panel2);border-radius:var(--radius-sm);padding:.4rem .6rem;font-size:.92rem;overflow-wrap:anywhere;border-left:3px solid var(--border);animation:msgin .25s}
.msg.mine{border-left-color:var(--accent)}
.msg.whisper{border-left-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--panel2))}
.msg.sys{background:transparent;border:none;color:var(--muted);font-size:.8rem;text-align:center;font-style:italic;padding:.1rem .3rem}
.msg-head{display:flex;justify-content:space-between;gap:.5rem;font-size:.75rem;margin-bottom:.1rem}
.msg-name{font-weight:800;cursor:pointer}
.msg-time{color:var(--muted);font-family:var(--font-mono)}
#chat-form{display:grid;grid-template-columns:1fr auto;gap:.4rem;margin-top:.6rem}
#chat-to{grid-column:1/-1;padding:.35rem .5rem;font-size:.82rem}

/* lobby */
.lobby{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem}
.lobby-hero{display:flex;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;align-items:center}
.lh-main{flex:1;min-width:240px}
.lobby-hero h2,.room-name-in{font-family:var(--font-display);font-size:1.7rem;margin:.25rem 0 .5rem;font-weight:800}
.room-name-in{background:transparent;border:var(--bw,1px) dashed var(--border);padding:.2rem .5rem;color:var(--text)}
.lh-badges{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.code-box{text-align:center;padding:.6rem 1rem;border:var(--bw,1px) dashed var(--accent);border-radius:var(--radius-md);background:var(--panel2)}
.code{font-family:var(--font-mono);font-size:2.1rem;letter-spacing:.2em;color:var(--accent);text-shadow:var(--glow);margin:.2rem 0 .4rem;user-select:all}
.code-actions{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.85rem}
.field label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.field label.switch{display:inline-flex;padding:.5rem 0;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--text)}
.bot-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.start-row{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.4rem 0 1rem}
.start-row .btn.big{max-width:380px;font-size:1.25rem;animation:glowpulse 2.4s infinite}
.start-row .btn.big:disabled{animation:none}
.waiting{display:flex;align-items:center;gap:.35rem;color:var(--muted);font-weight:700;padding:.8rem}
.waiting .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.waiting .dot:nth-child(2){animation-delay:.15s}.waiting .dot:nth-child(3){animation-delay:.3s}

/* game */
.game{max-width:1120px;margin:0 auto}
.steps{display:flex;justify-content:center;align-items:center;gap:.35rem;margin:.2rem 0 .9rem;flex-wrap:wrap}
.step{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;padding:.28rem .75rem;border:1px solid var(--border);border-radius:99px;color:var(--muted);text-transform:uppercase;transition:.3s}
.step.on{background:var(--accent);color:var(--btn-text);border-color:var(--accent);box-shadow:var(--glow);font-weight:700}
.step.done{color:var(--text)}
.step-sep{color:var(--muted);font-size:.8rem}
.prompt-card{position:relative;background:var(--prompt-bg);color:var(--prompt-text);border:var(--bw,1px) solid var(--prompt-border);border-radius:var(--radius-lg);padding:1.3rem 1.7rem 1rem;box-shadow:var(--shadow),var(--glow);max-width:780px;margin:0 auto 1rem;min-height:168px;display:flex;flex-direction:column;overflow:hidden}
.prompt-card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);pointer-events:none}
.prompt-card.pop{animation:popin .55s cubic-bezier(.2,1.4,.4,1)}
.pc-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:.7rem}
.pc-text{font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:800;line-height:1.32;flex:1;font-family:var(--font)}
.pc-text .fill{color:var(--prompt-fill)}
.pc-text.previewing .fill{opacity:.75;font-style:italic}
.blank{display:inline-block;min-width:5.5em;height:.9em;border-bottom:.13em solid var(--prompt-fill);margin:0 .12em;vertical-align:baseline;animation:blankpulse 1.6s infinite}
.fill{color:var(--card-fill);text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.16em;font-weight:800}
.pc-foot{display:flex;justify-content:space-between;font-size:.76rem;opacity:.7;margin-top:.8rem;font-family:var(--font-mono);letter-spacing:.06em}
.instr{text-align:center;font-size:1.05rem;font-weight:600;margin:0 auto 1rem;max-width:760px}
.instr b{color:var(--accent)}
.round-winner{display:inline-block;font-family:var(--font-display);font-size:1.45rem;font-weight:900;color:var(--accent3);text-shadow:var(--glow);animation:popin .6s}
.round-winner.dim{color:var(--muted)}

.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;max-width:1040px;margin:0 auto}
.answer-card{position:relative;text-align:left;background:var(--card-bg);color:var(--card-text);border:var(--bw,1px) solid var(--card-border);border-radius:var(--radius-md);padding:.9rem .85rem 1.9rem;min-height:128px;font-weight:700;font-size:1rem;line-height:1.25;box-shadow:var(--card-shadow);transition:transform .16s,box-shadow .2s,outline-color .2s;outline:3px solid transparent;outline-offset:2px;display:flex;font-family:var(--font)}
.hand.deal .answer-card{animation:dealin .4s backwards}
.answer-card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:var(--card-shadow),var(--glow)}
.answer-card.sel{outline-color:var(--accent);transform:translateY(-7px)}
.ac-brand{position:absolute;left:.85rem;bottom:.55rem;font-size:.6rem;font-family:var(--font-mono);letter-spacing:.14em;opacity:.45;text-transform:uppercase}
.ac-key{position:absolute;right:.6rem;bottom:.5rem;font-size:.66rem;opacity:.5;font-family:var(--font-mono);border:1px solid currentColor;border-radius:3px;padding:0 .3rem;line-height:1.4}
.sc-foot .ac-key{position:static}
.stamp{position:absolute;top:-.55rem;right:.5rem;background:var(--accent);color:var(--btn-text);font-size:.6rem;font-weight:900;padding:.18rem .45rem;border-radius:3px;letter-spacing:.1em;font-family:var(--font-mono);box-shadow:var(--glow)}

.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.85rem;max-width:1120px;margin:0 auto}
.sub-card{position:relative;background:var(--card-bg);color:var(--card-text);border:var(--bw,1px) solid var(--card-border);border-radius:var(--radius-md);padding:1rem 1rem 2.3rem;font-weight:600;font-size:1.02rem;line-height:1.38;box-shadow:var(--card-shadow);animation:flipin .5s backwards;text-align:left;transition:transform .16s,outline-color .2s,box-shadow .2s;outline:3px solid transparent;outline-offset:2px;width:100%;font-family:var(--font)}
.sub-card.votable{cursor:pointer}
.sub-card.votable:hover{transform:translateY(-4px);box-shadow:var(--card-shadow),var(--glow)}
.sub-card.mine{opacity:.6;filter:saturate(.6)}
.sub-card.voted{outline-color:var(--accent);transform:translateY(-4px)}
.sub-card.winner{outline-color:var(--accent3);box-shadow:0 0 0 2px var(--accent3),0 0 34px color-mix(in srgb,var(--accent3) 55%,transparent)}
.sub-card.result{padding-bottom:2.4rem}
.sub-card.own{border-style:dashed}
.sc-text{min-height:3.5em}
.sc-foot{position:absolute;left:1rem;right:1rem;bottom:.6rem;display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-family:var(--font-mono);letter-spacing:.06em}
.sc-mine{opacity:.75}.sc-hint{opacity:.5}.sc-voted{color:var(--card-fill);font-weight:800}
.sc-author{display:flex;align-items:center;gap:.4rem;margin-top:.6rem;font-size:.88rem}
.crown{position:absolute;top:-.9rem;right:.7rem;font-size:1.6rem;animation:bob 1.2s infinite alternate}
.vote-pips{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.pip{width:9px;height:9px;border-radius:50%;background:var(--card-fill);display:inline-block}
.gain{font-family:var(--font-display);font-weight:900;font-size:1rem;color:var(--card-fill)}
.gain.zero{opacity:.4}

/* game over */
.over{max-width:820px;margin:0 auto;text-align:center;padding-top:.5rem}
.over-title{font-family:var(--font-display);font-size:clamp(2.4rem,6vw,3.8rem);font-weight:900;background:var(--logo-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(var(--logo-shadow));animation:popin .7s}
.over-reason{margin-top:.3rem}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:.8rem;margin:1.6rem 0 1rem}
.pod{width:140px;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.pod .avatar{width:48px;height:48px;font-size:1.3rem}
.pod-name{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-score{font-size:.85rem;color:var(--muted);font-family:var(--font-mono)}
.pod-bar{width:100%;border-radius:var(--radius-md) var(--radius-md) 0 0;background:var(--panel2);border:var(--bw,1px) solid var(--border);display:grid;place-items:center;font-size:2.2rem;animation:rise .9s cubic-bezier(.2,1.2,.4,1) backwards;margin-top:.3rem}
.pod.p1 .pod-bar{height:150px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent3) 70%,transparent),var(--panel2));animation-delay:.5s}
.pod.p2 .pod-bar{height:110px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--panel2));animation-delay:.25s}
.pod.p3 .pod-bar{height:80px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent2) 55%,transparent),var(--panel2))}
.empty-pod{visibility:hidden}
.winner-line{font-size:1.2rem;font-weight:700;margin-bottom:1rem}
.winner-line b{color:var(--accent3)}
.standings{text-align:left;padding:.5rem 1rem;margin-bottom:1rem}
.standings table{width:100%;border-collapse:collapse}
.standings th{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-align:left;padding:.4rem;text-transform:uppercase}
.standings td{padding:.45rem .4rem;border-top:1px solid var(--border)}
.standings td:last-child,.standings th:last-child{text-align:right;font-family:var(--font-display);font-weight:800}
.standings tr.me td{color:var(--accent)}
.over-actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;align-items:center;padding-bottom:1rem}

/* modals, toasts */
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;z-index:200;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--modal-bg);color:var(--text);border:var(--bw,1px) solid var(--border);border-left:4px solid var(--accent);padding:.65rem 1rem;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-weight:700;animation:toastin .3s;text-align:center;max-width:100%}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateY(10px);transition:.4s}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:150;padding:1rem;animation:fadein .2s;backdrop-filter:blur(3px)}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--modal-bg);animation:popin .35s}
.modal.wide{width:min(780px,100%)}
.modal-h{font-family:var(--font-display);font-size:1.3rem;margin-bottom:1rem;line-height:1.3}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.2rem}
.set-sec{margin-bottom:1.1rem}
.set-label{font-weight:800;margin-bottom:.5rem}
.set-toggles{display:flex;gap:1.5rem;flex-wrap:wrap}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.5rem}
.theme-chip{display:flex;align-items:center;gap:.55rem;padding:.45rem .55rem;border:var(--bw,1px) solid var(--border);border-radius:var(--radius-sm);background:var(--panel2);text-align:left;font-size:.86rem;font-weight:700;transition:.15s}
.theme-chip:hover{border-color:var(--accent)}
.theme-chip.on{border-color:var(--accent);box-shadow:var(--glow)}
.swatch{width:36px;height:26px;border-radius:5px;background:var(--page-bg);display:flex;align-items:flex-end;gap:2px;padding:3px;border:1px solid rgba(128,128,128,.45);flex:none;overflow:hidden}
.swatch i{flex:1;height:9px;border-radius:2px;background:var(--accent)}
.swatch i:nth-child(2){background:var(--accent2)}
.swatch i:nth-child(3){background:var(--card-bg)}
.swatch.room-sw{display:grid;place-items:center;font-size:1rem;background:var(--chip)}
.howto{padding-left:1.3rem;display:flex;flex-direction:column;gap:.55rem;line-height:1.45}
.howto b{color:var(--accent)}
.connecting{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1rem}
.conn-text{font-weight:700;text-align:center}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--track);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin .8s linear infinite}
.confetti{position:fixed;top:-20px;z-index:300;pointer-events:none;animation:fall linear forwards;border-radius:2px}
.shake{animation:shake .4s}
.mobile-only{display:none!important}

/* ================================================================
   ANIMATIONS
   ================================================================ */
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
@keyframes msgin{from{opacity:0;transform:translateX(10px)}}
@keyframes popin{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
@keyframes dealin{from{opacity:0;transform:translateY(30px) rotate(4deg) scale(.9)}}
@keyframes flipin{from{opacity:0;transform:perspective(600px) rotateY(75deg)}}
@keyframes rise{from{height:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.25}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes bob{to{transform:translateY(-5px) rotate(8deg)}}
@keyframes blankpulse{50%{opacity:.45}}
@keyframes glowpulse{50%{box-shadow:var(--glow),0 0 32px color-mix(in srgb,var(--accent) 40%,transparent)}}
@keyframes toastin{from{opacity:0;transform:translateY(14px)}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes gridmove{to{background-position:0 48px}}
@keyframes drift{to{transform:translate(-50px,-40px) scale(1.15)}}
@keyframes floatup{to{background-position:0 -1200px,0 -900px,0 -700px}}
@keyframes flicker{0%,100%{opacity:.9}50%{opacity:1}52%{opacity:.75}54%{opacity:1}}
html.no-motion *,html.no-motion *::before,html.no-motion *::after{animation:none!important;transition:none!important}

/* ================================================================
   THEME-SPECIFIC DECORATION
   ================================================================ */
/* Default (dark/light): HUD corner brackets + moving perspective grid */
html[data-theme="default"] .panel::before,html[data-theme="light"] .panel::before{content:'';position:absolute;inset:-1px;pointer-events:none;border-radius:inherit;
  background:linear-gradient(var(--accent),var(--accent)) top left/16px 2px no-repeat,linear-gradient(var(--accent),var(--accent)) top left/2px 16px no-repeat,
  linear-gradient(var(--accent2),var(--accent2)) bottom right/16px 2px no-repeat,linear-gradient(var(--accent2),var(--accent2)) bottom right/2px 16px no-repeat}
html[data-theme="default"] #bgfx::before,html[data-theme="light"] #bgfx::before{left:-50%;right:-50%;bottom:-6%;height:58%;
  background-image:linear-gradient(rgba(34,228,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(34,228,255,.22) 1px,transparent 1px);background-size:48px 48px;
  transform:perspective(520px) rotateX(64deg);transform-origin:bottom;animation:gridmove 2.6s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent)}
html[data-theme="light"] #bgfx::before{background-image:linear-gradient(rgba(10,90,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(10,90,255,.14) 1px,transparent 1px)}
html[data-theme="default"] #bgfx::after{inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
html[data-theme="default"] .prompt-card,html[data-theme="light"] .prompt-card{border-left:4px solid var(--accent)}
html[data-theme="default"] .logo .apos{-webkit-text-fill-color:#ff2bd6}

/* Aero: glossy panels & bubbles */
html[data-theme="aero"] .panel::after,html[data-theme="aero"] .btn::after{content:'';position:absolute;left:1px;right:1px;top:1px;height:48%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
html[data-theme="aero"] .btn.primary{border:1px solid #2f8a16;text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 6px rgba(0,80,0,.3)}
html[data-theme="aero"] .topbar{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(200,235,255,.6))}
html[data-theme="aero"] #bgfx::before{inset:0;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,.25) 9%,rgba(255,255,255,.08) 12%,transparent 13%) 0 0/300px 300px,radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,255,255,.2) 6%,transparent 8%) 120px 80px/220px 260px,radial-gradient(circle at 35% 35%,rgba(255,255,255,.85),rgba(255,255,255,.15) 4%,transparent 5%) 60px 160px/180px 200px;opacity:.6;animation:floatup 60s linear infinite}
html[data-theme="aero"] #bgfx::after{left:-10%;right:-10%;bottom:-30%;height:55%;background:radial-gradient(ellipse at 50% 0%,#7ad35a 0%,#3a9a2c 55%,transparent 70%);opacity:.65}
html[data-theme="aero"] .logo{-webkit-text-stroke:1px rgba(10,90,160,.35)}

/* Synthwave: sun + neon floor */
html[data-theme="synthwave"] #bgfx::before{left:-50%;right:-50%;bottom:0;height:22%;background-image:linear-gradient(#ff3ec8 2px,transparent 2px),linear-gradient(90deg,#ff3ec8 2px,transparent 2px);background-size:60px 40px;transform:perspective(300px) rotateX(60deg);transform-origin:top;animation:gridmove 1.5s linear infinite;opacity:.65;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)}
html[data-theme="synthwave"] #bgfx::after{width:340px;height:340px;left:50%;bottom:22%;transform:translate(-50%,50%);border-radius:50%;background:repeating-linear-gradient(180deg,transparent 0 55%,#14012b 55% 60%,transparent 60% 64%),linear-gradient(180deg,#f9c80e,#ff3ec8 70%);-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 50%);mask-image:linear-gradient(180deg,#000 50%,transparent 50%);filter:drop-shadow(0 0 40px rgba(255,62,200,.6));opacity:.85}

<section id="home" class="screen active">

      </div>
      <div id="room-list" class="room-list"></div>

  </footer>
</section>

<!-- ======================= ROOM ======================= -->
<section id="room" class="screen">
  <header class="topbar">
    <div class="logo sm">Blank<span class="apos">'</span>d</div>

    </aside>
  </div>
</section>

const CODE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const ROUND_OPTS = [3, 5, 8, 10, 15, 20, 30, 0];          // 0 = endless

];
const THEME_IDS = new Set(THEMES.map(t => t[0]));
const themeName = id => (THEMES.find(t => t[0] === id) || [id, id])[1];

// ---------- tiny helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[rnd(a.length)];
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uid(n = 8) { let s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); }
function genCode() {
  const out = []; const buf = new Uint32Array(8);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for (let i = 0; i < 8; i++) out.push(CODE_CHARS[buf[i] % CODE_CHARS.length]);
  return out.join('');
}
const slotId = i => PREFIX + 'pub-' + String(i).padStart(2, '0');
const roomPeerId = code => PREFIX + 'r-' + code;
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const hueOf = name => hashStr(String(name).toLowerCase()) % 360;
const fmtTime = ts => { const d = new Date(ts); return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0'); };

function validateName(n) {
  n = String(n == null ? '' : n);
  if (/\s/.test(n)) return 'Usernames cannot contain spaces';
  if (n.length < 3) return 'Username must be at least 3 characters';
  if (n.length > 25) return 'Username must be 25 characters or fewer';
  return '';
}
const validCode = c => /^[A-Za-z0-9]{8}$/.test(c);

// Fill a prompt's blank with an answer (HTML-safe).
function blankStartsSentence(before) {
  const b = before.replace(/\s+$/, '');
  return b === '' || /[.!?:"\u201C]$/.test(b);
}
function fillHTML(prompt, answer) {
  prompt = String(prompt || '');
  const i = prompt.indexOf('_');
  if (i < 0) return esc(prompt) + (answer != null ? ' <span class="fill">' + esc(cap(answer)) + '</span>' : '');
  const before = prompt.slice(0, i), after = prompt.slice(i + 1);
  if (answer == null) return esc(before) + '<span class="blank"></span>' + esc(after);
  let a = String(answer).trim();
  if (/^[.!?,]/.test(after)) a = a.replace(/[.!?]+$/, '');
  if (blankStartsSentence(before)) a = cap(a);
  return esc(before) + '<span class="fill">' + esc(a) + '</span>' + esc(after);
}

// ---------- preferences ----------
const PREFS_KEY = 'blankd.prefs';
const prefs = Object.assign({ name: '', theme: 'room', sound: true, motion: true, vis: 'public' },
  (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } })());
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { } }

// ---------- sound ----------
let actx = null;
function beep(freq = 660, dur = 0.08, type = 'sine', vol = 0.05, delay = 0) {
  if (!prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { }
}
const SFX = {
  click: () => beep(520, .05, 'square', .025),
  pick: () => { beep(660, .07, 'triangle', .07); beep(990, .09, 'triangle', .06, .06); },
  vote: () => { beep(440, .06, 'sine', .07); beep(880, .1, 'sine', .06, .05); },
  tick: () => beep(1250, .035, 'square', .02),
  phase: () => { beep(392, .09, 'sawtooth', .025); beep(523, .09, 'sawtooth', .025, .08); beep(784, .14, 'sawtooth', .025, .16); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .2, 'triangle', .07, i * .11)),
  msg: () => beep(880, .04, 'sine', .03),
  join: () => { beep(600, .06, 'sine', .04); beep(800, .08, 'sine', .04, .06); },
  leave: () => { beep(500, .06, 'sine', .04); beep(350, .1, 'sine', .04, .06); },
  err: () => { beep(200, .12, 'square', .03); }
};

// ---------- theme ----------
let S = null; // latest room view (client side), declared here so the theme can follow the room
function currentTheme() {
  if (prefs.theme && prefs.theme !== 'room' && THEME_IDS.has(prefs.theme)) return prefs.theme;
  if (S && S.settings && THEME_IDS.has(S.settings.theme)) return S.settings.theme;
  return 'default';
}
function applyTheme() {
  const t = currentTheme();
  if (document.documentElement.dataset.theme !== t) document.documentElement.dataset.theme = t;
}
function applyMotion() { document.documentElement.classList.toggle('no-motion', !prefs.motion); }

// ---------- toasts / modals ----------
function toast(msg, kind = '', ms = 3400) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  if (kind === 'bad') SFX.err();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, ms);
}
function modal(html, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="modal panel ${opts.wide ? 'wide' : ''}">${html}</div>`;
  $('#modal-root').appendChild(wrap);
  let closed = false;
  const close = () => { if (closed) return; closed = true; wrap.remove(); opts.onClose && opts.onClose(); };
  if (!opts.locked) wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  opts.onMount && opts.onMount(wrap, close);
  return close;
}
function confirmBox(text, okLabel = 'OK', danger = true) {
  return new Promise(res => {
    let answered = false;
    modal(`<h3 class="modal-h">${esc(text)}</h3>
      <div class="modal-actions"><button class="btn ghost" data-close>Cancel</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="cf-ok">${esc(okLabel)}</button></div>`, {
      onClose: () => { if (!answered) res(false); },
      onMount: (w, close) => { w.querySelector('#cf-ok').onclick = () => { answered = true; close(); res(true); }; }
    });
  });
}
let connectingClose = null;
function showConnecting(text, onCancel) {
  hideConnecting();
  connectingClose = modal(`<div class="connecting"><div class="spinner"></div><div class="conn-text">${esc(text)}</div>
    ${onCancel ? '<button class="btn ghost sm" id="conn-cancel">Cancel</button>' : ''}</div>`, {
    locked: true,
    onMount: (w, close) => { const b = w.querySelector('#conn-cancel'); if (b) b.onclick = () => { close(); onCancel(); }; }
  });
}
function hideConnecting() { if (connectingClose) { const c = connectingClose; connectingClose = null; c(); } }

function confetti(n = 90) {
  if (!prefs.motion) return;
  const colors = ['var(--accent)', 'var(--accent2)', 'var(--accent3)', '#ffd23f', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = rand(0, 100) + 'vw';
    c.style.background = pick(colors);
    c.style.animationDuration = rand(2.2, 4.2) + 's';
    c.style.animationDelay = rand(0, .8) + 's';
    c.style.transform = `rotate(${rnd(360)}deg)`;
    c.style.width = rand(6, 12) + 'px'; c.style.height = rand(8, 16) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}
async function copyText(t, label = 'Copied!') {
  try { await navigator.clipboard.writeText(t); toast(label, 'good', 1800); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(label, 'good', 1800); } catch (_) { toast('Copy failed — ' + t, 'warn'); }
    ta.remove();
  }
}

function hDestroy() {
  if (!H) return;
  clearTimeout(H.timer); hClearBots();
  H = null;
}

// ---------- messaging ----------
function hSendTo(pid, msg) {
  if (!H) return;
  if (pid === H.hostId) { clientReceive(JSON.parse(JSON.stringify(msg))); return; }
  const p = hP(pid);
  if (p && p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) { } }
}
function hSendAll(msg, exceptHost) {
  if (!H) return;
  H.players.forEach(p => { if (!p.bot && !(exceptHost && p.id === H.hostId)) hSendTo(p.id, msg); });
}
let hBcastPending = false;
function hBroadcast() {
  if (hBcastPending) return;
  hBcastPending = true;
  setTimeout(() => {
    hBcastPending = false;
    if (!H) return;
    H.players.forEach(p => { if (!p.bot) hSendTo(p.id, { t: 'state', s: hView(p.id) }); });
  }, 0);
}
function hView(pid) {
  const now = Date.now();
  const me = hP(pid);
  const showSubs = ['reveal', 'vote', 'results'].includes(H.phase);
  const authors = H.phase === 'results';
  const mine = H.subs.find(s => s.pid === pid);
  return {
    v: VERSION, you: pid, hostId: H.hostId, roomName: H.roomName, isPublic: H.isPublic,
    code: H.isPublic ? null : H.code, offline: H.offline,
    settings: H.settings, phase: H.phase, round: H.round,
    remain: H.phaseEnd ? Math.max(0, H.phaseEnd - now) : 0, dur: H.phaseDur,
    prompt: H.prompt,
    players: H.players.map(p => ({
      id: p.id, name: p.name, bot: p.bot, score: p.score,
      picked: H.subs.some(s => s.pid === p.id), voted: !!H.votes[p.id]
    })),
    hand: me ? me.hand.slice() : [],
    mySub: mine ? mine.card : null,
    myVote: H.votes[pid] || null,
    subs: showSubs ? H.subs.map(s => authors
      ? { sid: s.sid, card: s.card, name: s.name, pid: s.pid, votes: s.votes, gain: s.gain, auto: s.auto, voters: s.voters }
      : { sid: s.sid, card: s.card, mine: s.pid === pid }) : [],
    subCount: H.subs.length,
    results: H.results, over: H.over
  };
}
function hInfo() {
  const host = hP(H.hostId);
  return {
    v: VERSION, name: H.roomName, host: host ? host.name : '?', players: H.players.length,
    humans: H.players.filter(p => !p.bot).length, max: H.settings.maxPlayers, phase: H.phase,
    round: H.round, rounds: H.settings.rounds, theme: H.settings.theme, hand: H.settings.handSize
  };
}

// ---------- chat ----------
function hPushChat(m) { H.chat.push(m); if (H.chat.length > 60) H.chat.shift(); }
function sysChat(text) {
  if (!H) return;
  const m = { id: ++H.chatSeq, sys: true, text, ts: Date.now() };
  hPushChat(m); hSendAll({ t: 'chat', m });
}
function hChat(pid, text, to) {
  const p = hP(pid); if (!p) return;
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
  if (!text) return;
  const now = Date.now();
  const r = H.rate[pid] = (H.rate[pid] || []).filter(t => now - t < 5000);
  if (r.length >= 5) { hSendTo(pid, { t: 'sys', text: 'Slow down! You\'re sending messages too fast.' }); return; }
  r.push(now);
  let target = null;
  if (to) {
    target = hP(to);
    if (!target || target.id === pid) { hSendTo(pid, { t: 'sys', text: 'That player is no longer in the room.' }); return; }
  }
  const m = { id: ++H.chatSeq, from: pid, name: p.name, text, ts: now, to: target ? target.id : null, toName: target ? target.name : null };
  if (target) {
    hSendTo(pid, { t: 'chat', m });
    if (!target.bot) hSendTo(target.id, { t: 'chat', m });
    else if (!p.bot) setTimeout(() => { if (H && hP(target.id) && hP(pid)) hChat(target.id, pick(BOT_WHISPER), pid); }, rand(900, 2500));
  } else {
    hPushChat(m); hSendAll({ t: 'chat', m });
  }
}
function hBotChat(chance, lines, delay = [800, 3000]) {
  const bots = H.players.filter(p => p.bot);
  if (!bots.length || Math.random() > chance) return;
  const b = pick(bots);
  setTimeout(() => { if (H && hP(b.id)) hChat(b.id, pick(lines)); }, rand(delay[0], delay[1]));
}

// ---------- players ----------
function hAddPlayer({ id, name, bot, conn }, silent) {
  const p = { id, name, bot: !!bot, conn: conn || null, score: 0, hand: [] };
  H.players.push(p);
  if (!['lobby', 'over'].includes(H.phase)) hRefill(p);
  if (!silent) sysChat(`${name}${bot ? ' 🤖' : ''} joined the room`);
  hBroadcast();
  return p;
}
function hRemovePlayer(pid, reason = 'left the room') {
  if (!H) return;
  const i = H.players.findIndex(p => p.id === pid);
  if (i < 0 || pid === H.hostId) return;
  const p = H.players[i];
  H.players.splice(i, 1);
  if (H.phase === 'pick') H.subs = H.subs.filter(s => s.pid !== pid);
  delete H.votes[pid];
  sysChat(`${p.name} ${reason}`);
  if (!p.bot) SFX.leave();
  if (!['lobby', 'over'].includes(H.phase) && H.players.length < MIN_PLAYERS) { hEndGame('Not enough players left to continue.'); return; }
  hBroadcast(); hCheckAllPicked(); hCheckAllVoted();
}
function hCanJoin(name, peerId) {
  const e = validateName(name);
  if (e) return 'Invalid username: ' + e;
  if (H.players.length >= H.settings.maxPlayers) return 'That room is full.';
  if (H.players.some(p => p.name.toLowerCase() === String(name).toLowerCase())) return 'That username is already taken in this room.';
  if (H.players.some(p => p.id === peerId)) return 'You are already in this room.';
  return null;
}
function hAddBot() {
  if (H.players.length >= H.settings.maxPlayers) return false;
  const used = new Set(H.players.map(p => p.name.toLowerCase()));
  let name = shuffle(BOT_NAMES.slice()).find(n => !used.has(n.toLowerCase()));
  if (!name) { let k = 1; while (used.has(('bot_' + k).toLowerCase())) k++; name = 'Bot_' + k; }
  const b = hAddPlayer({ id: 'bot-' + uid(7), name, bot: true });
  if (H.phase === 'lobby' && Math.random() < .45) setTimeout(() => { if (H && hP(b.id)) hChat(b.id, pick(BOT_GREET)); }, rand(600, 2200));
  return true;
}
function hFillBots() { let n = 0; while (hAddBot()) n++; return n; }
function hRemoveBots() { H.players.filter(p => p.bot).map(p => p.id).forEach(id => hRemovePlayer(id, 'was unplugged 🔌')); }
function hKick(pid) {
  const p = hP(pid); if (!p || pid === H.hostId) return;
  if (p.bot) { hRemovePlayer(pid, 'was unplugged 🔌'); return; }
  hSendTo(pid, { t: 'kicked' });
  const c = p.conn;
  hRemovePlayer(pid, 'was kicked by the host');
  setTimeout(() => { try { c && c.close(); } catch (e) { } }, 400);
}

// ---------- decks ----------
function hDrawPrompt() { if (!H.pDeck.length) H.pDeck = shuffle([...new Set(PROMPTS)]); return H.pDeck.pop(); }
function hDrawAnswer() {
  if (!H.aDeck.length) {
    const held = new Set(H.players.flatMap(p => p.hand));
    H.aDeck = shuffle([...new Set(ANSWERS)].filter(a => !held.has(a)));
  }
  return H.aDeck.pop();
}
function hRefill(p) {
  const n = H.settings.handSize;
  if (p.hand.length > n) p.hand.length = n;
  while (p.hand.length < n) { const c = hDrawAnswer(); if (c == null) break; p.hand.push(c); }
}

// ---------- bots ----------
function hBotLater(fn, ms) { H.botTimers.push(setTimeout(() => { if (H) fn(); }, ms)); }
function hClearBots() { if (!H) return; H.botTimers.forEach(clearTimeout); H.botTimers = []; }
function hBotPick(b) { if (!H || H.phase !== 'pick' || !hP(b.id) || !b.hand.length) return; hPick(b.id, pick(b.hand)); }
function hBotVote(b) {
  if (!H || H.phase !== 'vote' || !hP(b.id)) return;
  const opts = H.subs.filter(s => s.pid !== b.id);
  if (opts.length) hVote(b.id, pick(opts).sid);
}

// ---------- phases ----------
function hSetPhase(phase, secs) {
  H.phase = phase;
  clearTimeout(H.timer);
  H.phaseDur = secs ? secs * 1000 : 0;
  H.phaseEnd = secs ? Date.now() + secs * 1000 : 0;
  if (secs) H.timer = setTimeout(hPhaseTimeout, secs * 1000);
  hBroadcast();
}
function hShorten(ms) {
  const now = Date.now();
  if (H.phaseEnd - now > ms) {
    H.phaseEnd = now + ms; clearTimeout(H.timer);
    H.timer = setTimeout(hPhaseTimeout, ms);
    hBroadcast();
  }
}
function hPhaseTimeout() {
  if (!H) return;
  if (H.phase === 'pick') hEndPick();
  else if (H.phase === 'reveal') hEndReveal();
  else if (H.phase === 'vote') hEndVote();
  else if (H.phase === 'results') hNextRound();
}
function hStart() {
  if (!['lobby', 'over'].includes(H.phase)) return null;
  if (H.players.length < MIN_PLAYERS) return `You need at least ${MIN_PLAYERS} players to start (add some bots!).`;
  H.players.forEach(p => { p.score = 0; p.hand = []; });
  H.pDeck = shuffle([...new Set(PROMPTS)]);
  H.aDeck = shuffle([...new Set(ANSWERS)]);
  H.round = 0; H.over = null; H.results = null;
  sysChat(`🎬 Game on! ${H.settings.rounds ? H.settings.rounds + ' rounds' : 'Endless mode'} · ${H.settings.handSize} cards each.`);
  hNextRound();
  return null;
}
function hNextRound() {
  hClearBots();
  if (H.settings.rounds && H.round >= H.settings.rounds) { hEndGame('All rounds complete!'); return; }
  H.round++;
  H.prompt = hDrawPrompt();
  H.subs = []; H.votes = {}; H.results = null;
  H.players.forEach(hRefill);
  hSetPhase('pick', H.settings.pickTime);
  const span = H.settings.pickTime * 1000;
  H.players.filter(p => p.bot).forEach(b => hBotLater(() => hBotPick(b), rand(Math.min(2500, span * .2), span * .75)));
}
function hPick(pid, card) {
  if (H.phase !== 'pick') return;
  const p = hP(pid); if (!p || !p.hand.includes(card)) return;
  const s = H.subs.find(x => x.pid === pid);
  if (s) { s.card = card; s.auto = false; }
  else H.subs.push({ sid: 's' + uid(6), pid, name: p.name, card, auto: false, votes: 0, gain: 0, voters: [] });
  hBroadcast(); hCheckAllPicked();
}
function hCheckAllPicked() {
  if (H && H.settings.skipAhead && H.phase === 'pick' && H.players.length && H.players.every(p => H.subs.some(s => s.pid === p.id))) hShorten(1500);
}
function hEndPick() {
  hClearBots();
  H.players.forEach(p => {
    if (!H.subs.some(s => s.pid === p.id) && p.hand.length)
      H.subs.push({ sid: 's' + uid(6), pid: p.id, name: p.name, card: pick(p.hand), auto: true, votes: 0, gain: 0, voters: [] });
  });
  H.subs.forEach(s => { const p = hP(s.pid); if (p) { const i = p.hand.indexOf(s.card); if (i >= 0) p.hand.splice(i, 1); } });
  shuffle(H.subs);
  if (H.subs.length < 2) { H.results = { winners: [], winnerIds: [], max: 0, none: true }; hSetPhase('results', RESULTS_SECS); return; }
  hSetPhase('reveal', H.settings.revealTime);
}
function hEndReveal() {
  hSetPhase('vote', H.settings.voteTime);
  const span = H.settings.voteTime * 1000;
  H.players.filter(p => p.bot).forEach(b => hBotLater(() => hBotVote(b), rand(Math.min(2000, span * .2), span * .7)));
}
function hVote(pid, sid) {
  if (H.phase !== 'vote' || !hP(pid)) return;
  const s = H.subs.find(x => x.sid === sid);
  if (!s || s.pid === pid) return; // can't vote for your own answer
  H.votes[pid] = sid;
  hBroadcast(); hCheckAllVoted();
}
function hCheckAllVoted() {
  if (!H || !H.settings.skipAhead || H.phase !== 'vote') return;
  const done = H.players.every(p => H.votes[p.id] || !H.subs.some(s => s.pid !== p.id));
  if (done) hShorten(1200);
}
function hEndVote() {
  hClearBots();
  H.subs.forEach(s => { s.votes = 0; s.voters = []; s.gain = 0; });
  Object.entries(H.votes).forEach(([voter, sid]) => {
    const s = H.subs.find(x => x.sid === sid), v = hP(voter);
    if (s) { s.votes++; s.voters.push(v ? v.name : '?'); }
  });
  const max = Math.max(0, ...H.subs.map(s => s.votes));
  const win = max > 0 ? H.subs.filter(s => s.votes === max) : [];
  H.subs.forEach(s => {
    s.gain = s.votes + (max > 0 && s.votes === max ? 1 : 0); // 1 pt per vote, +1 bonus for the round's top answer
    const p = hP(s.pid); if (p) p.score += s.gain;
  });
  H.subs.sort((a, b) => b.votes - a.votes);
  H.results = { winners: win.map(s => s.name), winnerIds: win.map(s => s.pid), max };
  if (win.length) sysChat(`🏆 Round ${H.round}: ${win.map(s => s.name).join(' & ')} took it with "${win[0].card}"`);
  else sysChat(`Round ${H.round}: nobody got any votes 🦗`);
  hSetPhase('results', RESULTS_SECS);
  const botWon = win.some(s => { const p = hP(s.pid); return p && p.bot; });
  if (botWon) hBotChat(.6, BOT_WIN); else hBotChat(.3, BOT_QUIPS);
}
function hEndGame(reason) {
  hClearBots(); clearTimeout(H.timer);
  const standings = H.players.map(p => ({ id: p.id, name: p.name, score: p.score, bot: p.bot })).sort((a, b) => b.score - a.score);
  const top = standings.length ? standings[0].score : 0;
  const winners = standings.filter(s => s.score === top).map(s => s.name);
  H.over = { reason, standings, winners, top, rounds: H.round };
  sysChat(`🏁 Game over — ${winners.join(' & ')} win${winners.length > 1 ? '' : 's'} with ${top} point${top === 1 ? '' : 's'}!`);
  hSetPhase('over', 0);
}
function hToLobby() {
  hClearBots(); clearTimeout(H.timer);
  H.players.forEach(p => { p.score = 0; p.hand = []; });
  H.round = 0; H.subs = []; H.votes = {}; H.prompt = null; H.results = null; H.over = null;
  hSetPhase('lobby', 0);
}
function hSettings(s) {
  if (!s || typeof s !== 'object') return;
  const st = H.settings, inLobby = ['lobby', 'over'].includes(H.phase);
  if ('theme' in s && THEME_IDS.has(s.theme)) st.theme = s.theme;
  if ('skipAhead' in s) st.skipAhead = !!s.skipAhead;
  if (inLobby) {
    if ('rounds' in s && ROUND_OPTS.includes(+s.rounds)) st.rounds = +s.rounds;
    if ('handSize' in s && +s.handSize >= 4 && +s.handSize <= 12) st.handSize = Math.round(+s.handSize);
    if ('maxPlayers' in s && +s.maxPlayers >= MIN_PLAYERS && +s.maxPlayers <= 12) st.maxPlayers = Math.max(H.players.length, Math.round(+s.maxPlayers));
    if ('pickTime' in s && PICK_OPTS.includes(+s.pickTime)) st.pickTime = +s.pickTime;
    if ('revealTime' in s && REVEAL_OPTS.includes(+s.revealTime)) st.revealTime = +s.revealTime;
    if ('voteTime' in s && VOTE_OPTS.includes(+s.voteTime)) st.voteTime = +s.voteTime;
  } else if ('rounds' in s && ROUND_OPTS.includes(+s.rounds)) {
    // allow switching rounds mid-game as long as it isn't below the current round
    const r = +s.rounds; if (r === 0 || r >= H.round) st.rounds = r;
  }
  hBroadcast();
}

// ---------- inbound actions ----------
function hHandle(pid, d) {
  if (!H || !d || typeof d !== 'object' || !hP(pid)) return;
  switch (d.t) {
    case 'pick': hPick(pid, d.card); return;
    case 'vote': hVote(pid, d.sid); return;
    case 'chat': hChat(pid, d.text, d.to); return;
  }
  if (pid !== H.hostId) return; // everything below is host-only
  switch (d.t) {
    case 'settings': hSettings(d.s); break;
    case 'roomName': { const n = String(d.name || '').trim().slice(0, 32); if (n) { H.roomName = n; hBroadcast(); } break; }
    case 'start': { const e = hStart(); if (e) hSendTo(pid, { t: 'sys', text: e }); break; }
    case 'addBot': if (!hAddBot()) hSendTo(pid, { t: 'sys', text: 'The room is full — raise Max Players first.' }); break;
    case 'fillBots': if (!hFillBots()) hSendTo(pid, { t: 'sys', text: 'The room is already full.' }); break;
    case 'removeBots': hRemoveBots(); break;
    case 'kick': hKick(d.id); break;
    case 'end': if (!['lobby', 'over'].includes(H.phase)) hEndGame('The host ended the game.'); break;
    case 'lobby': hToLobby(); break;
  }
}

// ---------- inbound connections (PeerJS) ----------
function hOnConnection(conn) {
  if (conn.metadata && conn.metadata.probe) {
    conn.on('open', () => { try { conn.send({ t: 'info', info: H ? hInfo() : null }); } catch (e) { } setTimeout(() => { try { conn.close(); } catch (e) { } }, 1500); });
    return;
  }
  let pid = null;
  conn.on('data', d => {
    if (!H || !d || typeof d !== 'object') return;
    if (!pid) {
      if (d.t !== 'hello') return;
      const err = hCanJoin(d.name, conn.peer);
      if (err) { try { conn.send({ t: 'reject', reason: err }); } catch (e) { } setTimeout(() => { try { conn.close(); } catch (e) { } }, 600); return; }
      pid = conn.peer;
      hAddPlayer({ id: pid, name: d.name, bot: false, conn });
      try { conn.send({ t: 'welcome', chat: H.chat }); } catch (e) { }
      SFX.join();
      hBroadcast();
      return;
    }
    hHandle(pid, d);
  });
  conn.on('close', () => { if (pid && H) hRemovePlayer(pid, 'left the room'); pid = null; });
  conn.on('error', () => { });
}

/* ===== 04_net.js ===== */
// ============================================================
//  NETWORK — PeerJS lobby scanning, hosting, joining
//  * Public rooms claim one of PUB_SLOTS well-known peer ids, so
//    anyone can discover them by probing those ids.
//  * Private rooms live at PREFIX + 'r-' + <8-char code>.
// ============================================================
const NET = {
  peer: null, ready: false, myId: null, hosting: false, conn: null,
  mode: 'home', probes: new Map(), found: new Map(), pendingJoin: null,
  closeReason: null, scanning: false, lastScan: 0
};
const peerAvailable = () => typeof window.Peer === 'function';

function setNetStatus(text, kind = '') {
  const el = $('#net-status');
  if (el) { el.textContent = text; el.className = 'pill ' + kind; }
}
function destroyPeer() {
  const p = NET.peer;
  NET.peer = null; NET.ready = false;
  NET.probes.forEach(pr => pr.fail()); NET.probes.clear();
  if (p) { try { p.destroy(); } catch (e) { } }
}
function initHomePeer() {
  if (!peerAvailable()) { setNetStatus('offline', 'bad'); renderRoomList(); return; }
  if (NET.peer && !NET.peer.destroyed && !NET.hosting) { if (NET.ready) scanRooms(true); return; }
  destroyPeer();
  NET.hosting = false;
  setNetStatus('connecting…', 'warn');
  let peer;
  try { peer = new Peer(PEER_OPTS); } catch (e) { setNetStatus('offline', 'bad'); renderRoomList(); return; }
  NET.peer = peer;
  peer.on('open', id => {
    if (NET.peer !== peer) return;
    NET.ready = true; NET.myId = id;
    setNetStatus('online', 'good');
    scanRooms(true);
    tryAutoJoin();
  });
  peer.on('error', err => onPeerError(peer, err));
  peer.on('disconnected', () => {
    if (NET.peer !== peer || peer.destroyed) return;
    NET.ready = false; setNetStatus('reconnecting…', 'warn');
    setTimeout(() => { if (NET.peer === peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) { } } }, 1000);
  });
}
function onPeerError(peer, err) {
  const type = err && err.type;
  if (type === 'peer-unavailable') {
    const m = String(err.message || '').match(/([A-Za-z0-9_-]+)\s*$/);
    const id = m && m[1];
    if (id && NET.probes.has(id)) { NET.probes.get(id).fail(); return; }
    if (NET.pendingJoin && (!id || id === NET.pendingJoin.target)) {
      NET.pendingJoin.fail(NET.pendingJoin.isCode ? 'No room found with that code. (Codes are case-sensitive.)' : 'That room is no longer available.');
    }
    return;
  }
  if (NET.peer !== peer) return;
  if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible'].includes(type)) {
    NET.ready = false;
    setNetStatus('offline', 'bad');
    if (NET.pendingJoin) NET.pendingJoin.fail('Network error — could not reach the room.');
    renderRoomList();
    // retry a little later while we're on the home screen
    setTimeout(() => { if (NET.mode === 'home' && NET.peer === peer) { destroyPeer(); initHomePeer(); } }, 6000);
  }
  console.warn('[Blank\'d peer]', type, err && err.message);
}

// ---------- public room discovery ----------
function scanRooms(force) {
  if (!NET.ready || NET.hosting || NET.mode !== 'home' || !NET.peer) return;
  if (!force && Date.now() - NET.lastScan < 4000) return;
  NET.lastScan = Date.now();
  NET.scanning = true;
  let pending = 0;
  for (let i = 1; i <= PUB_SLOTS; i++) {
    const id = slotId(i);
    if (NET.probes.has(id)) continue;
    pending++;
    probe(id).then(info => {
      if (info && info.v === VERSION) NET.found.set(id, Object.assign({}, info, { id, seen: Date.now() }));
      else NET.found.delete(id);
    }).catch(() => { NET.found.delete(id); })
      .finally(() => { if (--pending <= 0) NET.scanning = false; renderRoomList(); });
  }
  renderRoomList();
}
function probe(id) {
  return new Promise((resolve, reject) => {
    let done = false, conn = null, to = null;
    const finish = (ok, val) => {
      if (done) return; done = true; clearTimeout(to); NET.probes.delete(id);
      try { conn && conn.close(); } catch (e) { }
      ok ? resolve(val) : reject(val);
    };
    NET.probes.set(id, { fail: () => finish(false, 'unavailable') });
    to = setTimeout(() => finish(false, 'timeout'), 7000);
    try { conn = NET.peer.connect(id, { reliable: true, metadata: { probe: 1 } }); }
    catch (e) { finish(false, e); return; }
    if (!conn) { finish(false, 'noconn'); return; }
    conn.on('data', d => { if (d && d.t === 'info') finish(true, d.info); });
    conn.on('error', () => finish(false, 'err'));
  });
}

// ---------- joining ----------
function joinRoom(targetId, label, isCode) {
  const name = requireName(); if (!name) return;
  if (!peerAvailable()) { toast('Multiplayer is unavailable (PeerJS failed to load). Try Quick Play vs Bots!', 'bad'); return; }
  if (!NET.ready || !NET.peer) { toast('Still connecting to the network — try again in a second.', 'warn'); initHomePeer(); return; }
  if (NET.pendingJoin) return;
  let conn, to;
  const cancel = () => { if (NET.pendingJoin) { NET.pendingJoin = null; clearTimeout(to); try { conn && conn.close(); } catch (e) { } } };
  showConnecting('Joining ' + label + '…', cancel);
  NET.pendingJoin = {
    target: targetId, isCode,
    fail: reason => { if (!NET.pendingJoin) return; NET.pendingJoin = null; clearTimeout(to); hideConnecting(); toast(reason, 'bad', 4500); try { conn && conn.close(); } catch (e) { } scanRooms(true); }
  };
  to = setTimeout(() => NET.pendingJoin && NET.pendingJoin.fail('Could not reach that room (timed out).'), 12000);
  try { conn = NET.peer.connect(targetId, { reliable: true, metadata: { v: VERSION } }); }
  catch (e) { NET.pendingJoin.fail('Could not connect.'); return; }
  conn.on('open', () => { try { conn.send({ t: 'hello', name, v: VERSION }); } catch (e) { } });
  conn.on('data', d => {
    if (!d || typeof d !== 'object') return;
    if (NET.conn === conn) { clientReceive(d); return; }
    if (!NET.pendingJoin || NET.pendingJoin.target !== targetId) return;
    if (d.t === 'reject') { NET.pendingJoin.fail(d.reason || 'Join refused.'); return; }
    if (d.t === 'welcome') {
      clearTimeout(to); NET.pendingJoin = null; hideConnecting();
      NET.conn = conn; NET.closeReason = null;
      enterRoom();
      (d.chat || []).forEach(addChat);
    }
  });
  conn.on('close', () => {
    if (NET.conn === conn) { NET.conn = null; onHostLost(); }
    else if (NET.pendingJoin && NET.pendingJoin.target === targetId) NET.pendingJoin.fail('The room closed the connection.');
  });
  conn.on('error', () => { });
}
function joinByCode(code) {
  code = String(code || '').trim();
  if (!validCode(code)) { toast('Room codes are exactly 8 letters/numbers.', 'bad'); return; }
  joinRoom(roomPeerId(code), 'room ' + code, true);
}
let autoJoinCode = null;
function tryAutoJoin() {
  if (!autoJoinCode || NET.mode !== 'home') return;
  if (validateName(prefs.name)) { toast('Pick a username, then press Join to enter room ' + autoJoinCode, 'warn', 5000); autoJoinCode = null; return; }
  const c = autoJoinCode; autoJoinCode = null;
  joinByCode(c);
}

// ---------- hosting ----------
function openPeerWithId(id) {
  return new Promise((resolve, reject) => {
    let done = false, peer;
    try { peer = new Peer(id, PEER_OPTS); } catch (e) { reject('error'); return; }
    const to = setTimeout(() => { if (done) return; done = true; try { peer.destroy(); } catch (e) { } reject('timeout'); }, 10000);
    peer.on('open', () => { if (done) return; done = true; clearTimeout(to); resolve(peer); });
    peer.on('error', err => {
      if (done) return; done = true; clearTimeout(to);
      try { peer.destroy(); } catch (e) { }
      reject(err && err.type === 'unavailable-id' ? 'taken' : ((err && err.type) || 'error'));
    });
  });
}
async function createRoom(isPublic, opts = {}) {
  const name = requireName(); if (!name) return;
  const roomName = ($('#in-roomname').value || '').trim().slice(0, 32);
  if (opts.offline || !peerAvailable()) {
    if (!opts.offline) toast('PeerJS unavailable — starting an offline room with bots.', 'warn', 4500);
    startHosting({ peer: null, isPublic: false, code: genCode(), myId: 'local', name, roomName, offline: true, bots: 3 });
    return;
  }
  let cancelled = false;
  showConnecting(isPublic ? 'Opening a public room…' : 'Creating your private room…', () => { cancelled = true; });
  NET.mode = 'creating';
  destroyPeer();
  try {
    let peer = null, code = genCode(), slot = null;
    if (isPublic) {
      const order = shuffle(Array.from({ length: PUB_SLOTS }, (_, i) => i + 1));
      for (const i of order) {
        if (cancelled) break;
        try { peer = await openPeerWithId(slotId(i)); slot = i; break; }
        catch (e) { if (e !== 'taken') throw e; }
      }
      if (!peer && !cancelled) throw 'All public room slots are busy right now. Try a private room!';
    } else {
      for (let k = 0; k < 6 && !cancelled; k++) {
        code = genCode();
        try { peer = await openPeerWithId(roomPeerId(code)); break; }
        catch (e) { if (e !== 'taken') throw e; }
      }
      if (!peer && !cancelled) throw 'Could not allocate a room code — please try again.';
    }
    if (cancelled) { if (peer) try { peer.destroy(); } catch (e) { } NET.mode = 'home'; initHomePeer(); return; }
    hideConnecting();
    startHosting({ peer, isPublic, slot, code, myId: peer.id, name, roomName });
  } catch (e) {
    hideConnecting();
    NET.mode = 'home';
    toast(typeof e === 'string' && e.length > 12 ? e : 'Network error — could not create the room. Quick Play vs Bots works offline!', 'bad', 5500);
    initHomePeer();
  }
}
function startHosting({ peer, isPublic, slot, code, myId, name, roomName, offline, bots }) {
  NET.peer = peer || null; NET.ready = !!peer; NET.hosting = true; NET.myId = myId; NET.mode = 'room'; NET.conn = null;
  if (peer) {
    peer.on('connection', hOnConnection);
    peer.on('disconnected', () => { setTimeout(() => { if (NET.peer === peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) { } } }, 800); });
    peer.on('error', e => console.warn('[Blank\'d host]', e && e.type));
  }
  hostCreate({ roomName, isPublic, code, slot, myId, myName: name, offline });
  enterRoom();
  sysChat(offline ? '🤖 Offline room created — it\'s just you and the bots.' :
    isPublic ? '🌐 Public room created. Others can find it in the room list!' : `🔒 Private room created. Share the code ${code} to invite friends.`);
  for (let i = 0; i < (bots || 0); i++) hAddBot();
  hBroadcast();
}

// ---------- leaving ----------
async function leaveRoom(force) {
  if (H) {
    const others = H.players.some(p => !p.bot && p.id !== H.hostId);
    if (!force && others && !(await confirmBox('Leaving will close the room for everyone. Leave anyway?', 'Close room'))) return;
    hSendAll({ t: 'closed', reason: 'The host closed the room.' }, true);
    hDestroy();
    const p = NET.peer; NET.peer = null; NET.ready = false;
    setTimeout(() => { try { p && p.destroy(); } catch (e) { } }, 400);
  } else if (NET.conn) {
    const c = NET.conn; NET.conn = null;
    try { c.close(); } catch (e) { }
  }
  goHome();
}
function onHostLost() {
  if (!S) { goHome(); return; }
  const reason = NET.closeReason || 'Lost connection to the host.';
  NET.closeReason = null;
  if (S.phase === 'lobby') { toast(reason, 'bad', 4500); goHome(); return; }
  if (S.phase !== 'over') {
    const standings = S.players.map(p => ({ id: p.id, name: p.name, score: p.score, bot: p.bot })).sort((a, b) => b.score - a.score);
    const top = standings.length ? standings[0].score : 0;
    S.over = { reason: reason + ' Final standings below.', standings, winners: standings.filter(s => s.score === top).map(s => s.name), top, rounds: S.round };
    S.phase = 'over';
  } else {
    S.over = Object.assign({}, S.over, { reason: (S.over && S.over.reason ? S.over.reason + ' ' : '') + reason });
  }
  S.disconnected = true; S.remain = 0; S.dur = 0;
  UI.localEnd = 0; UI.dur = 0;
  addChat({ id: 'lost-' + Date.now(), sys: true, text: reason, ts: Date.now() });
  render();
}
window.addEventListener('beforeunload', () => {
  try {
    if (H) { hSendAll({ t: 'closed', reason: 'The host left the game.' }, true); }
    else if (NET.conn) NET.conn.close();
    if (NET.peer) NET.peer.destroy();
  } catch (e) { }
});

// ============================================================
//  CLIENT UI — renders the room view received from the host
// ============================================================
const UI = { localEnd: 0, dur: 0, lastTickSec: -1, sig: {}, chatIds: new Set(), unread: 0, chatOpen: false };
const PHASE_LABEL = { lobby: 'WAITING ROOM', pick: 'PICK A CARD', reveal: 'INSPECT', vote: 'VOTE', results: 'RESULTS', over: 'GAME OVER' };

function send(msg) {
  if (H) hHandle(NET.myId, msg);
  else if (NET.conn && NET.conn.open) { try { NET.conn.send(msg); } catch (e) { } }
}
const isHost = () => !!(S && S.you === S.hostId && H);
const meP = () => S && S.players.find(p => p.id === S.you);

function clientReceive(d) {
  switch (d.t) {
    case 'state': applyState(d.s); break;
    case 'chat': addChat(d.m); break;
    case 'sys': toast(d.text, 'warn'); break;
    case 'closed': NET.closeReason = d.reason || 'The host closed the room.'; break;
    case 'kicked': {
      const c = NET.conn; NET.conn = null;
      try { c && c.close(); } catch (e) { }
      toast('You were kicked from the room by the host.', 'bad', 5000);
      goHome(); break;
    }
  }
}
function applyState(s) {
  const prev = S;
  S = s;
  UI.localEnd = performance.now() + (s.remain || 0);
  UI.dur = s.dur || 0;
  applyTheme();
  if (!prev || prev.phase !== s.phase || prev.round !== s.round) onPhaseChange(prev ? prev.phase : null, s.phase);
  render();
}
function onPhaseChange(prev, cur) {
  UI.lastTickSec = -1;
  if (cur === 'pick' || cur === 'reveal' || cur === 'vote') SFX.phase();
  if (cur === 'results' && S.results) {
    if ((S.results.winnerIds || []).includes(S.you)) { SFX.win(); confetti(50); } else SFX.vote();
  }
  if (cur === 'over' && prev && prev !== 'over') { SFX.win(); confetti(120); }
  if (cur === 'lobby' && prev && prev !== 'lobby') toast('Back in the waiting room.', 'good', 2000);
}
